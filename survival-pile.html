<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Survival Pile — Recovery Misfits</title>
<meta name="theme-color" content="#0e0e0d">

<style>html{background:#0e0e0d}body{background:#0e0e0d;color:#eee6d5;margin:0}</style>
<link rel="stylesheet" href="/assets/daily-reading.css">

<style>
/* ===========================================================================
   THE SURVIVAL PILE -- "Little milestones between the big coins."

   BUILT FOR A PHONE, and reviewed at 393 wide. Phone wins when the two
   disagree; a desktop gets the same column, centered.

   ONLY THE CARDS THEY HAVE. Same rule as the coin case: a wall of locked
   cards is a list of things you have not done yet, and this screen is not
   for that. What is coming is ONE line -- how many days until the next
   card -- and never which card. They can guess.

   THE CARD IS THE CLIFF NOTES; THIS PAGE IS THE BACK OF THE CARD. Tap one
   and it opens big, with the day it was earned and the story behind it
   (the "Back of Card" column in survival-pile-cards.xlsx).

   NO BACK BUTTON ON THE SCREEN, by the rule. The open card is one step of
   history, so the phone's back button and the iPhone edge swipe close it
   and leave them right where they were.
   ======================================================================== */

.wrap{max-width:560px;margin:0 auto;padding:16px 16px 0}

.head{text-align:center;margin:4px 0 14px}
.head h1{
  font-family:var(--display);font-weight:600;text-transform:uppercase;
  font-size:clamp(30px,9vw,42px);line-height:.95;letter-spacing:.6px;
  color:var(--ivory);margin:0;
}
.head .tag{
  margin:6px 0 0;font-family:var(--ui);font-weight:700;font-size:clamp(9.5px,2.9vw,12px);
  letter-spacing:1px;text-transform:uppercase;color:var(--gold);white-space:nowrap;
}
.head .rule{height:2px;width:120px;margin:12px auto 0;background:#9b2b24;border-radius:2px}

.status{
  display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:4px 10px;
  margin:0 2px 12px;font-family:var(--ui);font-size:12.5px;color:var(--muted);
}
.status b{color:var(--ivory);font-weight:800}
.status > span{white-space:nowrap}
.coming{color:var(--gold);font-weight:700;text-align:right}

/* ---- the pile ------------------------------------------------------------
   Three across at 393 -- each card about 115 wide, big enough to read the
   number, and a pile is meant to look like a lot of cards. */
/* minmax(0,1fr), not 1fr: a long date under one card was stretching its
   whole column wider than the other two. */
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tile{
  position:relative;display:block;padding:0;border:0;background:transparent;
  cursor:pointer;-webkit-tap-highlight-color:transparent;text-align:left;
}
.tile .face{
  position:relative;display:block;aspect-ratio:5/7;border-radius:8px;overflow:hidden;
  box-shadow:0 4px 14px rgba(0,0,0,.55);background:#16140f;
}
.tile img{width:100%;height:100%;object-fit:cover;display:block}
.tile:active .face{transform:scale(.97)}
.tile .when{
  display:block;margin:5px 1px 0;font-family:var(--ui);font-weight:700;font-size:9.5px;
  letter-spacing:1px;text-transform:uppercase;color:var(--muted);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.tile.newest .face{box-shadow:0 0 0 2px var(--gold),0 4px 14px rgba(0,0,0,.55)}
.tile.newest .when{color:var(--gold)}

/* A card whose art has not come back from ChatGPT yet still shows up --
   drawn in the same colors, number and name on it -- so nobody's pile has
   holes in it while the art catches up. */
.blank{
  position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:6px;padding:10px;text-align:center;
  background:
    linear-gradient(180deg,rgba(215,178,83,.07),rgba(0,0,0,0) 40%),
    #16140f;
  border:1.5px solid rgba(215,178,83,.55);border-radius:inherit;
}
.blank .no{font-family:var(--display);font-weight:600;color:var(--ivory);font-size:26px;line-height:1}
.blank .nm{font-family:var(--ui);font-weight:800;font-size:10px;letter-spacing:.8px;
  text-transform:uppercase;color:var(--gold);line-height:1.25}
.blank .ft{position:absolute;bottom:7px;left:0;right:0;font-family:var(--ui);font-size:7px;
  letter-spacing:1.2px;text-transform:uppercase;color:rgba(238,230,213,.4)}

/* The year stamp on holiday cards and the count on the Misfitversary,
   written by the app into the round spot the art leaves empty. */
.badge{
  position:absolute;top:5%;right:6%;width:24%;aspect-ratio:1;border-radius:50%;
  display:grid;place-items:center;background:#9b2b24;color:#f6ecd6;
  border:2px solid var(--gold);font-family:var(--display);font-weight:600;
  font-size:9px;line-height:1;box-shadow:0 2px 6px rgba(0,0,0,.5);
}
.count{
  position:absolute;top:6px;left:6px;padding:2px 6px;border-radius:999px;
  background:rgba(14,14,13,.85);color:var(--gold);font-family:var(--ui);font-weight:800;font-size:10px;
}

/* ---- the drop-downs --------------------------------------------------------
   One per series, in the order you earn them: the night you decided, the
   first 90 days, 99 and 100, big numbers, years-months-days, holidays, the
   Misfitversary. Inside each, oldest first -- zero up to now. Only series
   with at least one card in them show up at all. */
.sec{margin:0 0 10px;border:1px solid rgba(215,178,83,.28);border-radius:14px;
  background:rgba(215,178,83,.04);overflow:hidden}
.sec > summary{
  list-style:none;display:flex;align-items:center;gap:10px;min-height:52px;padding:0 14px;
  cursor:pointer;-webkit-tap-highlight-color:transparent;
}
.sec > summary::-webkit-details-marker{display:none}
.sec .st{flex:1;font-family:var(--display);font-weight:600;text-transform:uppercase;
  font-size:16px;letter-spacing:.5px;color:var(--ivory)}
.sec .sn{font-family:var(--ui);font-weight:800;font-size:12px;color:var(--gold)}
.sec .sv{width:18px;height:18px;fill:none;stroke:var(--gold);stroke-width:2;transition:transform .2s}
.sec[open] .sv{transform:rotate(180deg)}
.sec .grid{padding:4px 12px 14px}

/* ---- All / Compact ------------------------------------------------------
   All is the default: every card in the deck, in order, the ones not earned
   yet face-down. Compact folds them into the drop-downs. */
.view{display:flex;gap:4px;margin:0 0 14px;padding:4px;border-radius:999px;
  border:1px solid rgba(215,178,83,.3);background:rgba(215,178,83,.05)}
.view[hidden]{display:none}
.view button{flex:1;min-height:40px;border:0;border-radius:999px;background:transparent;cursor:pointer;
  font-family:var(--ui);font-weight:800;font-size:12.5px;letter-spacing:1.3px;text-transform:uppercase;
  color:var(--muted);-webkit-tap-highlight-color:transparent}
.view button[aria-pressed="true"]{background:var(--gold);color:#17130b}

/* A card not earned yet: face-down. No number, no name -- the surprise is
   the point. */
.back{
  position:absolute;inset:0;display:grid;place-items:center;border-radius:inherit;
  background:
    repeating-linear-gradient(45deg,rgba(215,178,83,.06) 0 6px,rgba(0,0,0,0) 6px 12px),
    #121110;
  border:1.5px solid rgba(215,178,83,.28);
}
.back .q{font-family:var(--display);font-weight:600;font-size:30px;color:rgba(215,178,83,.5);line-height:1}
.back .ft{position:absolute;bottom:7px;left:0;right:0;text-align:center;font-family:var(--ui);font-size:7px;
  letter-spacing:1.2px;text-transform:uppercase;color:rgba(238,230,213,.3)}
.big .back .q{font-size:64px}
.big .back .ft{font-size:9px;bottom:12px}
.tile.locked .when{color:rgba(238,230,213,.3)}

.empty{
  margin:30px 4px 0;padding:20px 18px;border-radius:14px;text-align:center;
  border:1px solid rgba(215,178,83,.3);background:rgba(215,178,83,.06);
}
.empty p{margin:0 0 12px;font-family:var(--ui);font-size:14.5px;line-height:1.5;color:var(--ivory)}
.empty a{display:inline-block;padding:12px 20px;border-radius:999px;background:var(--gold);
  color:#17130b;font-family:var(--ui);font-weight:800;font-size:13px;letter-spacing:1.2px;
  text-transform:uppercase;text-decoration:none}

/* ---- one card, big ------------------------------------------------------ */
.sheet{position:fixed;inset:0;z-index:10050;display:flex;flex-direction:column;
  background:rgba(8,8,7,.94);overflow-y:auto;-webkit-overflow-scrolling:touch}
.sheet[hidden]{display:none}
.sheetin{width:100%;max-width:440px;margin:0 auto;padding:18px 20px 40px;box-sizing:border-box}
.sheetx{position:sticky;top:0;margin-left:auto;display:grid;place-items:center;width:44px;height:44px;
  border-radius:50%;border:1px solid rgba(215,178,83,.45);background:rgba(14,14,13,.9);
  color:var(--ivory);font-size:18px;cursor:pointer;z-index:2}
.big{position:relative;width:78%;margin:0 auto;aspect-ratio:5/7;border-radius:14px;overflow:hidden;
  box-shadow:0 18px 50px rgba(0,0,0,.7)}
.big img{width:100%;height:100%;object-fit:cover;display:block}
.big .badge{font-size:17px}
.big .blank .no{font-size:48px}
.big .blank .nm{font-size:14px}
.big .blank .ft{font-size:9px;bottom:12px}
.dname{margin:18px 0 0;text-align:center;font-family:var(--display);font-weight:600;
  text-transform:uppercase;font-size:26px;line-height:1.05;color:var(--ivory)}
.dtag{margin:6px 0 0;text-align:center;font-family:var(--ui);font-style:italic;font-size:14px;color:var(--muted)}
.dwhen{margin:14px 0 0;text-align:center;font-family:var(--ui);font-weight:800;font-size:11px;
  letter-spacing:1.6px;text-transform:uppercase;color:var(--gold)}
.dback{margin:14px 0 0;padding:14px 16px;border-radius:12px;background:rgba(215,178,83,.07);
  border:1px solid rgba(215,178,83,.22);font-family:var(--ui);font-size:15px;line-height:1.55;color:#ece2cb}
.dback[hidden]{display:none}
.dyears{margin:12px 0 0;text-align:center;font-family:var(--ui);font-size:12px;color:var(--muted)}
.dshare{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;min-height:52px;
  margin:18px 0 0;border:0;border-radius:999px;background:var(--gold);color:#17130b;cursor:pointer;
  font-family:var(--ui);font-weight:800;font-size:14.5px;letter-spacing:1.4px;text-transform:uppercase}
.dshare[hidden]{display:none}
.dshare svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.9}
.dsay{margin:10px 0 0;min-height:16px;text-align:center;font-family:var(--ui);font-size:12px;color:var(--muted)}
</style>
</head>

<body data-rm-nav="index.html">

<div id="rm-topbar"></div>
<script src="/topbar.js" defer></script>

<div class="wrap">
  <header class="head">
    <h1>The Survival Pile</h1>
    <p class="tag">Little milestones between the big coins</p>
    <div class="rule"></div>
  </header>

  <div class="status" id="status" hidden>
    <span id="have"></span>
    <span class="coming" id="coming"></span>
  </div>

  <div class="view" id="view" role="group" aria-label="How to show the pile" hidden>
    <button type="button" data-view="all" aria-pressed="true">All <span id="allN"></span></button>
    <button type="button" data-view="compact" aria-pressed="false">Compact</button>
  </div>

  <div id="grid"></div>

  <div class="empty" id="soon" hidden>
    <p>The Survival Pile is on its way &mdash; little milestones between the big coins. Hang in there.</p>
  </div>

  <div class="empty" id="empty" hidden>
    <p>Your pile starts with the night you decided. Put in your sober date and it's yours.</p>
    <a href="/sober-date.html">Set my sober date</a>
  </div>
</div>

<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="dname">
  <div class="sheetin">
    <button class="sheetx" type="button" id="sheetx" aria-label="Close">&#10005;</button>
    <div class="big" id="big"></div>
    <h2 class="dname" id="dname"></h2>
    <p class="dtag" id="dtag"></p>
    <p class="dwhen" id="dwhen"></p>
    <div class="dback" id="dback"></div>
    <p class="dyears" id="dyears"></p>
    <button class="dshare" type="button" id="dshare" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16V3m0 0L8 7m4-4 4 4M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span id="dshareLabel">Share this card</span>
    </button>
    <p class="dsay" id="dsay" role="status" aria-live="polite"></p>
  </div>
</div>

<div class="tailroom"></div>
<div id="rm-bottom-nav"></div>
<script src="/nav.js" defer></script>
<script src="/assets/survival-pile.js"></script>

<script>
(function () {
  "use strict";
  var P = window.RMPile;
  var $ = function (id) { return document.getElementById(id); };
  var ART = "/assets/survival-pile/cards/";
  var MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

  function esc(x) {
    return String(x == null ? "" : x).replace(/[&<>"]/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
    });
  }
  function short(ymd) { var p = ymd.split("-"); return MON[+p[1] - 1] + " " + (+p[2]) + ", " + p[0]; }
  function title(c) { return c.name || (c.kind === "days" || c.kind === "ymd" ? c.code : c.code); }

  /* ---- one tile per card ---------------------------------------------------
     A holiday is ONE card in the pile. Every year they are sober for it, this
     year's replaces last year's -- the card just wears the newest year. Miss
     one (not sober for it yet) and the first year they are is when it turns
     up; from then on it rolls forward. Same for the Misfitversary. */
  function group(list) {
    var by = {}, order = [];
    list.forEach(function (e) {
      var k = e.card.code;
      if (!by[k]) { by[k] = { card: e.card, all: [] }; order.push(k); }
      by[k].all.push(e);
    });
    return order.map(function (k) { var g = by[k]; g.top = g.all[0]; return g; });
  }

  function face(g, big) {
    var c = g.card, h = "";
    if (c.art) {
      h += '<img src="' + ART + esc(c.code) + (big ? ".webp" : "-thumb.webp") +
           '" alt="' + esc(title(c)) + '" loading="lazy" decoding="async">';
    } else {
      h += '<span class="blank"><span class="no">' + esc(c.kind === "holiday" || c.kind === "misfitversary" ? "★" : c.code) +
           '</span><span class="nm">' + esc(c.name || "") + '</span><span class="ft">Survival Pile</span></span>';
    }
    if (c.kind === "holiday") h += '<span class="badge">' + g.top.edition + '</span>';
    if (c.kind === "misfitversary") h += '<span class="badge">' + g.top.years + '</span>';
    return h;
  }

  function whenLine(g) {
    var c = g.card, e = g.top;
    if (c.kind === "start") return "The night you decided · " + P.fmt(e.date);
    if (c.kind === "holiday") return e.edition + " edition · " + P.fmt(e.date);
    if (c.kind === "misfitversary") return e.years + (e.years === 1 ? " year" : " years") + " a Misfit · " + P.fmt(e.date);
    return (c.unlocks || "") + " · " + P.fmt(e.date);
  }


  var SECTIONS = [
    { key: "start",   title: "The Night You Decided" },
    { key: "first90", title: "The First 90 Days" },
    { key: "pair",    title: "99 & 100" },
    { key: "big",     title: "Big Numbers" },
    { key: "ymd",     title: "Years, Months, Days" },
    { key: "holiday", title: "Holidays" },
    { key: "misfit",  title: "Misfitversary" }
  ];
  function sectionOf(c) {
    if (c.kind === "start") return "start";
    if (c.kind === "holiday") return "holiday";
    if (c.kind === "misfitversary") return "misfit";
    if (c.kind === "ymd") return "ymd";
    if (c.n === 99 || c.n === 100) return "pair";
    return c.n < 99 ? "first90" : "big";
  }

  /* WHICH VIEW. "all" unless they picked Compact on this phone before. */
  var view = "all";
  try { if (localStorage.getItem("rm_pile_view") === "compact") view = "compact"; } catch (e) {}

  var tiles = [], newest = null;

  function tileHtml(g, i) {
    if (!g.top) {
      return '<button class="tile locked" type="button" data-i="' + i + '">' +
               '<span class="face">' + backFace() + '</span>' +
               '<span class="when">Not yet</span>' +
             '</button>';
    }
    var isNew = g === newest;
    return '<button class="tile' + (isNew ? " newest" : "") + '" type="button" data-i="' + i + '">' +
             '<span class="face">' + face(g, false) + '</span>' +
             '<span class="when">' + (isNew ? "Newest · " : "") + esc(short(g.top.date)) + '</span>' +
           '</button>';
  }
  function backFace() {
    return '<span class="back"><span class="q">?</span><span class="ft">Survival Pile</span></span>';
  }

  function draw() {
    document.querySelectorAll("#view button").forEach(function (b) {
      b.setAttribute("aria-pressed", b.getAttribute("data-view") === view ? "true" : "false");
    });
    if (view === "all") {
      /* THE WHOLE DECK, in order: the night you decided, then up from there. */
      $("grid").innerHTML = '<div class="grid">' + tiles.map(tileHtml).join("") + '</div>';
      return;
    }
    $("grid").innerHTML = SECTIONS.map(function (sec) {
      var mine = tiles.filter(function (g) { return sectionOf(g.card) === sec.key; });
      if (!mine.length) return "";
      var have = mine.filter(function (g) { return g.top; }).length;
      var isOpen = mine.indexOf(newest) !== -1;
      return '<details class="sec"' + (isOpen ? " open" : "") + '>' +
               '<summary><span class="st">' + sec.title + '</span>' +
               '<span class="sn">' + have + ' / ' + mine.length + '</span>' +
               '<svg class="sv" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6" stroke-linecap="round" stroke-linejoin="round"/></svg>' +
               '</summary><div class="grid">' +
               mine.map(function (g) { return tileHtml(g, tiles.indexOf(g)); }).join("") +
             '</div></details>';
    }).join("");
  }

  function paint(cards) {
    /* OFF UNTIL MIKE SAYS SO. See isOn() in survival-pile.js. */
    if (!P.isOn(cards)) { $("soon").hidden = false; return; }
    var sober = P.soberYMD(), today = P.todayYMD(), joined = P.joinedYMD();
    if (!sober) { $("empty").hidden = false; return; }

    /* One tile per card in the deck, catalog order. The ones earned carry
       their newest earning (g.top); the rest are face-down. */
    var earned = group(P.earned(cards, sober, today, joined));
    var byCode = {};
    earned.forEach(function (g) { byCode[g.card.code] = g; });
    tiles = cards.map(function (c) { return byCode[c.code] || { card: c, all: [], top: null }; });
    newest = earned[0] || null;                 /* earned() is newest first */
    var nx = P.next(cards, sober, today, joined);

    $("have").innerHTML = "<b>" + earned.length + "</b> of " + cards.length + " cards in your pile";
    $("coming").textContent = !nx ? "" :
      nx.days === 1 ? "Something's coming tomorrow." : "Something's coming in " + nx.days + " days.";
    $("status").hidden = false;
    $("allN").textContent = cards.length;
    $("view").hidden = false;
    draw();
  }

  $("view").addEventListener("click", function (e) {
    var b = e.target.closest("button"); if (!b) return;
    view = b.getAttribute("data-view");
    try { localStorage.setItem("rm_pile_view", view); } catch (e2) {}
    draw();
  });

  /* ---- the open card ---------------------------------------------------- */
  var open = null, pushed = false;

  function show(i) {
    var g = tiles[i]; if (!g) return;
    open = g;
    var c = g.card, got = !!g.top;
    $("big").innerHTML = got ? face(g, true) : backFace();
    $("dname").textContent = got ? title(c) : "Still in the deck";
    $("dtag").textContent = got ? (c.tagline || "") : "Keep coming back. It'll turn up.";
    $("dwhen").textContent = got ? whenLine(g) : "";
    $("dback").textContent = got ? (c.back || "") : "";
    $("dback").hidden = !got || !c.back;
    $("dyears").textContent = "";
    $("dshare").hidden = !got || !c.art;
    $("dshareLabel").textContent = navigator.share ? "Share this card" : "Save the picture";
    $("dsay").textContent = "";
    $("sheet").hidden = false;
    document.body.style.overflow = "hidden";
    $("sheet").scrollTop = 0;
    try { history.pushState({ pile: 1 }, ""); pushed = true; } catch (e) { pushed = false; }
  }
  function hide() {
    $("sheet").hidden = true;
    document.body.style.overflow = "";
    open = null; pushed = false;
  }
  function close() { if (pushed) { try { history.back(); return; } catch (e) {} } hide(); }

  $("grid").addEventListener("click", function (e) {
    var t = e.target.closest(".tile"); if (t) show(+t.getAttribute("data-i"));
  });
  $("sheetx").addEventListener("click", close);
  $("sheet").addEventListener("click", function (e) { if (e.target === $("sheet")) close(); });
  window.addEventListener("popstate", function () { if (open) hide(); });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && open) close(); });

  /* ---- sharing: the Misfits presenting the card ----------------------------
     The card is laid into the gold frame on the share background at the
     exact spot measured off the art (assets/survival-pile/share-bg.json).
     One square picture, 1080 x 1080, nothing for Instagram to crop. */
  var SLOT = { x: 304, y: 174, w: 472, h: 664, r: 18 };
  function img(src) {
    return new Promise(function (ok, no) {
      var i = new Image(); i.onload = function () { ok(i); }; i.onerror = no; i.src = src;
    });
  }
  function rounded(g, x, y, w, h, r) {
    g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
    g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
  }
  function picture(grp) {
    return Promise.all([img("/assets/survival-pile/share-bg.jpg"), img(ART + grp.card.code + ".webp")])
      .then(function (a) {
        var c = document.createElement("canvas"); c.width = c.height = 1080;
        var g = c.getContext("2d");
        g.drawImage(a[0], 0, 0, 1080, 1080);
        var w = SLOT.w, h = Math.round(w * a[1].height / a[1].width);
        var y = SLOT.y + Math.round((SLOT.h - h) / 2);
        g.save(); rounded(g, SLOT.x, y, w, h, SLOT.r); g.clip();
        g.drawImage(a[1], SLOT.x, y, w, h); g.restore();
        var stamp = grp.card.kind === "holiday" ? grp.top.edition : grp.card.kind === "misfitversary" ? grp.top.years : null;
        if (stamp) {
          var bx = SLOT.x + w * 0.82, by = y + w * 0.17, br = w * 0.12;
          g.beginPath(); g.arc(bx, by, br, 0, Math.PI * 2); g.fillStyle = "#9b2b24"; g.fill();
          g.lineWidth = 4; g.strokeStyle = "#d7b253"; g.stroke();
          g.fillStyle = "#f6ecd6"; g.textAlign = "center"; g.textBaseline = "middle";
          g.font = "700 " + Math.round(br * 0.75) + "px system-ui, Arial, sans-serif";
          g.fillText(String(stamp), bx, by + 1);
        }
        return new Promise(function (ok, no) { c.toBlob(function (b) { b ? ok(b) : no(new Error("blank")); }, "image/jpeg", 0.9); });
      });
  }
  $("dshare").addEventListener("click", function () {
    if (!open) return;
    var grp = open, say = $("dsay");
    say.textContent = "Getting it ready…";
    picture(grp).then(function (blob) {
      var name = "survival-pile-" + grp.card.code + ".jpg";
      var f = new File([blob], name, { type: "image/jpeg" });
      var can = false;
      try { can = !!(navigator.canShare && navigator.share && navigator.canShare({ files: [f] })); } catch (e) {}
      if (can) {
        return navigator.share({ files: [f], text: "The Survival Pile — recoverymisfits.org" })
          .then(function () { say.textContent = ""; },
                function (err) {
                  if (err && err.name === "AbortError") { say.textContent = ""; return; }
                  if (err && err.name === "NotAllowedError") { say.textContent = "Ready — tap share again."; return; }
                  say.textContent = "Could not open sharing. Try again in a second.";
                });
      }
      var u = URL.createObjectURL(blob), a = document.createElement("a");
      a.href = u; a.download = name; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function () { URL.revokeObjectURL(u); }, 4000);
      say.textContent = "Saved to your downloads.";
    }).catch(function () { say.textContent = "Could not build the picture. Try again in a second."; });
  });

  P.load().then(paint).catch(function () {
    $("have").textContent = "Could not load your pile. Check back in a minute.";
    $("status").hidden = false;
  });
})();
</script>
