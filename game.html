<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Trudge the Road</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

<style>
  html, body{
    margin:0; padding:0; width:100%; height:100%;
    background:#000; overflow:hidden;
    font-family:"Press Start 2P", monospace;
    touch-action:none;
  }
  body{
    display:flex;
    align-items:center;
    justify-content:center;
  }
  canvas{
    display:block;
    width:390px;
    height:780px;
    max-width:100vw;
    max-height:100vh;
  }

  #pauseBtn, #shareBtn{
    position:fixed;
    left:50%;
    transform:translateX(-50%);
    font-family:"Press Start 2P", monospace;
    font-size:10px;
    padding:10px 14px;
    background:#111;
    color:#fff;
    border:1px solid #444;
    border-radius:10px;
    opacity:.95;
    z-index:10;
    display:none;
  }
  #pauseBtn{ bottom:12px; }
  #shareBtn{ bottom:18px; }
</style>
</head>
<body>

<canvas id="game"></canvas>

<audio id="bgm" loop preload="auto">
  <source src="./assets-trudge/E-Lot%20-%208-Bit%20Boss.mp3" type="audio/mpeg">
</audio>

<audio id="meditationBgm" preload="auto">
  <source src="./assets-trudge/warp-world.mp3" type="audio/mpeg">
</audio>

<button id="pauseBtn">PAUSE / BREATHE</button>
<button id="shareBtn">PASS IT ON</button>

<script>
(() => {
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const bgm = document.getElementById("bgm");
  const meditationBgm = document.getElementById("meditationBgm");
  const pauseBtn = document.getElementById("pauseBtn");
  const shareBtn = document.getElementById("shareBtn");

  // ===== fixed mobile playfield =====
  const GAME_W = 390;
  const GAME_H = 780;
  let W = GAME_W, H = GAME_H;

  function resize(){
    const scale = Math.min(window.innerWidth / GAME_W, window.innerHeight / GAME_H);
    const cssW = Math.max(1, Math.floor(GAME_W * scale));
    const cssH = Math.max(1, Math.floor(GAME_H * scale));

    canvas.style.width = `${cssW}px`;
    canvas.style.height = `${cssH}px`;

    const dpr = Math.max(1, window.devicePixelRatio || 1);
    canvas.width = Math.floor(GAME_W * dpr);
    canvas.height = Math.floor(GAME_H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    const rect = canvas.getBoundingClientRect();
    const centerX = rect.left + rect.width / 2;
    pauseBtn.style.left = `${centerX}px`;
    pauseBtn.style.top = `${Math.max(rect.top + 8, rect.bottom - 52)}px`;
    pauseBtn.style.bottom = "auto";
    shareBtn.style.left = `${centerX}px`;
    shareBtn.style.top = `${Math.max(rect.top + 8, rect.bottom - 58)}px`;
    shareBtn.style.bottom = "auto";
  }
  addEventListener("resize", resize);
  resize();

  // ===== sprite =====
  const runnerImg = new Image();
  runnerImg.src = "./assets-trudge/runner.png";
  let runnerReady = false;
  runnerImg.onload = () => {
    runnerReady = true;
    const targetH = 96;
    const aspect = runnerImg.width / runnerImg.height;
    player.h = targetH;
    player.w = Math.round(targetH * aspect);
    player.x = Math.floor(W * PLAYER_X_RATIO);
  };

  // ===== title logo =====
  const titleImg = new Image();
  titleImg.src = "./assets-trudge/trudge-title.png";
  let titleImgReady = false;
  titleImg.onload = () => { titleImgReady = true; };

  // ===== modes =====
  let mode = "title"; // title | countdown | ready | play | pause | gameover | ending
  function setMode(m){
    mode = m;
    pauseBtn.style.display = (mode === "play" || mode === "pause") ? "block" : "none";
    shareBtn.style.display = (mode === "ending" || mode === "gameover") ? "block" : "none";
  }

  // ===== constants =====
  const MAX_LIVES = 3;

  const DRAG_FOLLOW = 0.92;
  const PLAYER_X_RATIO = 0.04;

  const BASE_SPEED = 3.1;
  const MAX_SPEED  = 6.8;

  const WARMUP_TOTAL = 60 * 10;
  let warmupFrames = 0;

  let prestige = 0;
  let prestigeSpeedBoost = 0;

  let obstacleGapPx = 520;
  let bonusGapPx = 900;
  let microGapPx = 520;

  let stepCooldown = 60 * 6;
  let stepSpawnBias = 0;

  // effects
  let invuln = 0;
  let slowTimer = 0; // meditation frames remaining

  // rocket fuel — pink clouds refill Bill's engine
  const MAX_FUEL = 100;
  const FUEL_BURN_PER_FRAME = 0.025; // roughly 65 seconds from full to empty
  const PINK_CLOUD_FUEL = 38;
  let fuel = MAX_FUEL;
  let fuelWarningCooldown = 0;
  let fuelEmptyPenaltyCooldown = 0;

  // intro overlay
  const INTRO_HOLD = 60 * 4;
  const INTRO_FADE = 60 * 1;
  let introTimer = 0;

  // ===== dopamine / feel systems =====
  let streak = 0;
  let bestStreakThisRun = 0;
  let graceUsed = false;
  let nearMissCooldown = 0;
  let runStartFrame = 0;
  let frameCount = 0;

  let screenShakeFrames = 0;
  let screenShakeMag = 0;
  function shakeScreen(mag, frames){
    screenShakeMag = Math.max(screenShakeMag, mag);
    screenShakeFrames = Math.max(screenShakeFrames, frames);
  }

  let edgeFlash = null; // { color, t, ttl }
  function flashEdges(color, ttl=22){
    edgeFlash = { color, t: 0, ttl };
  }

  let billSquash = null; // { t, ttl, kind: "hit" | "bonus" }
  function squashBill(kind, ttl=16){
    billSquash = { t: 0, ttl, kind };
  }

  const impactParticles = [];
  function spawnImpactBurst(x, y, color, count=16){
    for (let i=0; i<count; i++){
      const a = Math.random() * Math.PI * 2;
      const sp = 1.5 + Math.random()*4;
      impactParticles.push({
        x, y,
        vx: Math.cos(a)*sp,
        vy: Math.sin(a)*sp,
        r: 2 + Math.random()*3,
        t: 0,
        ttl: 20 + (Math.random()*16|0),
        color
      });
    }
    if (impactParticles.length > 160) impactParticles.splice(0, impactParticles.length - 160);
  }
  function updateImpactParticles(){
    for (let i=impactParticles.length-1; i>=0; i--){
      const p = impactParticles[i];
      p.t++;
      p.x += p.vx;
      p.y += p.vy;
      p.vy += 0.12;
      if (p.t >= p.ttl) impactParticles.splice(i,1);
    }
  }
  function drawImpactParticles(){
    for (const p of impactParticles){
      const a = Math.max(0, 1 - p.t/p.ttl);
      ctx.globalAlpha = a;
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  // Cosmetic rocket-trail color that upgrades with prestige level.
  const PRESTIGE_TRAIL_COLORS = [
    "220,220,220", // prestige 0 — classic white/grey
    "255,170,60",  // prestige 1 — orange
    "80,220,255",  // prestige 2 — cyan
    "200,110,255", // prestige 3 — purple
    "120,255,140"  // prestige 4+ — green
  ];
  function currentTrailRGB(){
    const idx = Math.min(prestige, PRESTIGE_TRAIL_COLORS.length - 1);
    return PRESTIGE_TRAIL_COLORS[idx];
  }

  // ===== simple WebAudio chimes (no extra asset files needed) =====
  let audioCtx = null;
  function getAudioCtx(){
    if (!audioCtx){
      try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
      catch(e){ audioCtx = null; }
    }
    return audioCtx;
  }
  function resumeAudioCtx(){
    const a = getAudioCtx();
    if (a && a.state === "suspended") a.resume().catch(()=>{});
  }
  function playTone(freq, dur=0.12, type="square", vol=0.05, delay=0){
    const a = getAudioCtx();
    if (!a) return;
    try {
      const t0 = a.currentTime + delay;
      const osc = a.createOscillator();
      const gain = a.createGain();
      osc.type = type;
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(vol, t0);
      gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      osc.connect(gain);
      gain.connect(a.destination);
      osc.start(t0);
      osc.stop(t0 + dur + 0.02);
    } catch(e){}
  }
  function playHitBuzz(){
    playTone(110, 0.18, "sawtooth", 0.05);
  }
  function playStreakChime(count){
    const freq = 440 + Math.min(count, 12) * 34;
    playTone(freq, 0.10, "square", 0.045);
  }
  function playStepJingle(){
    [523.25, 659.25, 783.99].forEach((f, i) => {
      playTone(f, 0.16, "triangle", 0.05, i * 0.07);
    });
  }

  // ===== personal bests (saved locally in this browser) =====
  const BEST_KEY = "trudge_best_stats_v1";
  function loadBestStats(){
    try {
      const raw = localStorage.getItem(BEST_KEY);
      if (!raw) return { bestStreak: 0, bestSteps: 0, bestSurvivalSec: 0 };
      const p = JSON.parse(raw);
      return {
        bestStreak: p.bestStreak || 0,
        bestSteps: p.bestSteps || 0,
        bestSurvivalSec: p.bestSurvivalSec || 0
      };
    } catch(e){
      return { bestStreak: 0, bestSteps: 0, bestSurvivalSec: 0 };
    }
  }
  function saveBestStats(){
    try { localStorage.setItem(BEST_KEY, JSON.stringify(bestStats)); } catch(e){}
  }
  let bestStats = loadBestStats();
  let justBeatBest = { streak:false, steps:false, survival:false };

  // ===== player =====
  const player = {
    x: 120,
    y: 0,
    w: 72,
    h: 96,
    targetY: 0
  };

  function laneYCenters(){
    const top = Math.max(120, Math.floor(H * 0.28));
    const bottom = Math.min(H - 120, Math.floor(H * 0.78));
    const gap = (bottom - top) / 2;
    return [top, top + gap, bottom];
  }

  function clamp(v, a, b){ return Math.max(a, Math.min(b, v)); }

  // ===== content =====
  const obstaclesPool = [
    "Anger","Resentment","Fear","Self-pity","Anxiety","Guilt","Shame",
    "Ego","Overthinking","Self-obsession","Self-righteousness","Control",
    "People-pleasing","Comparison","Relationship drama","Family conflict",
    "Isolation","Unsaid resentment","Not speaking up","Old friends",
    "Work stress","Money worries","Self-centeredness","Social media","Home chaos","Traffic Rage",
    "Complacency","Dishonesty","Not listening","Selective hearing",
    "Not asking for help","Emotional numbness","Avoidance","Confusion","Uncertainty",
    "Restless","Irritable","Discontent","Catastrophizing","Projection"
  ];

  const bonusesPool = [
    { label:"Go to a meeting", type:"life" },
    { label:"Call a friend", type:"life" },
    { label:"Call your sponsor", type:"life" },
    { label:"Make meeting coffee", type:"life" },
    { label:"Do service work", type:"life" },
    { label:"Read the Big Book", type:"life" },
    { label:"Pray / meditate", type:"slow" },
    { label:"Write it down", type:"clear" }
  ];

  const steps = [
    { n: 1, p: "HONESTY" },
    { n: 2, p: "HOPE" },
    { n: 3, p: "FAITH" },
    { n: 4, p: "COURAGE" },
    { n: 5, p: "INTEGRITY" },
    { n: 6, p: "WILLINGNESS" },
    { n: 7, p: "HUMILITY" },
    { n: 8, p: "BROTHERLY LOVE" },
    { n: 9, p: "DISCIPLINE" },
    { n:10, p: "PERSEVERANCE" },
    { n:11, p: "SPIRITUAL AWARENESS" },
    { n:12, p: "SERVICE" }
  ];

  const calmWhispers = [
    "Breathe.",
    "You’re not alone.",
    "Easy does it.",
    "Keep it simple.",
    "Relax and take it easy.",
    "Just for today."
  ];

  // ===== state =====
  let lives = MAX_LIVES;
  let lastObstacleLabel = "something";
  let stepIndex = 0;
  let obstaclesPassed = 0;
  let clearArmed = false;

  const obstacles = [];
  const bonuses = [];
  const microClouds = [];
  const stepTokens = [];

  // ===== Bill speech bubbles =====
  const resentmentLines = [
    "HEY, WATCH OUT! RESENTMENT IS THE #1 OFFENDER!",
    "WHOA, BUDDY! RESENTMENT DESTROYS MORE ALCOHOLICS THAN ANYTHING ELSE!",
    "CAREFUL! RESENTMENT STEMS ALL FORMS OF SPIRITUAL DISEASE!",
    "HEY! DON'T BLOCK ME OFF FROM THE SUNLIGHT OF THE SPIRIT!"
  ];
  const pitfallLines = [
    "WHOA! {L} JUST KNOCKED ME OFF THE ROAD!",
    "HEY! {L} WILL TAKE YOU OUT EVERY TIME!",
    "CAREFUL! {L} BLOCKS ME OFF FROM THE SUNLIGHT OF THE SPIRIT!",
    "WATCH OUT! {L} IS A SLIPPERY SLOPE!",
    "OOF! DON'T LET {L} GET A FOOTHOLD!"
  ];
  let billSpeech = null;
  let resentmentPauseFrames = 0;
  let resentmentSpeechText = "";

  // kind: "good" (green), "bad" (orange/red), "status" (neutral white)
  function showBillSpeech(text, ttl=140, kind="status"){
    // +120 frames (~2 extra seconds) so there's time to actually read these.
    billSpeech = { text, t: 0, ttl: ttl + 120, kind };
  }

  function tickBillSpeech(){
    if (!billSpeech) return;
    billSpeech.t++;
    if (billSpeech.t >= billSpeech.ttl) billSpeech = null;
  }

  function startResentmentReaction(label, isGrace=false){
    const cleanLabel = label || "Resentment";
    lastObstacleLabel = cleanLabel;

    if (isGrace){
      resentmentSpeechText = `WHOA! ${cleanLabel.toUpperCase()} ALMOST GOT ME — FIRST ONE'S FREE!`;
    } else {
      const isResentment = cleanLabel.toLowerCase().includes("resentment");
      if (isResentment){
        resentmentSpeechText = rand(resentmentLines) || resentmentLines[0];
      } else {
        const template = rand(pitfallLines) || pitfallLines[0];
        resentmentSpeechText = template.replace("{L}", cleanLabel.toUpperCase());
      }
    }

    resentmentPauseFrames = 180; // 3 seconds
    billSpeech = null;

    setMode("resentment");
  }

  // ===== audio =====
  function startMusic(){
    if (!bgm) return;
    if (bgm.paused){
      bgm.volume = 0.22;
      bgm.play().catch(()=>{});
    }
  }

  function startMeditationMusic(){
    if (!meditationBgm) return;
    if (bgm && !bgm.paused) bgm.pause();
    meditationBgm.currentTime = 0;
    meditationBgm.volume = 0.32;
    meditationBgm.play().catch(()=>{});
  }

  function stopMeditationMusic(){
    if (meditationBgm){
      meditationBgm.pause();
      meditationBgm.currentTime = 0;
    }
    if (mode === "play" && bgm){
      bgm.play().catch(()=>{});
    }
  }

  pauseBtn.onclick = () => {
    if (mode === "play"){
      bgm && bgm.pause();
      meditationBgm && meditationBgm.pause();
      setMode("pause");
    } else if (mode === "pause"){
      if (slowTimer > 0){
        meditationBgm && meditationBgm.play().catch(()=>{});
      } else {
        bgm && bgm.play().catch(()=>{});
      }
      setMode("play");
    }
  };

  // ===== PASS IT ON share =====
  const PASS_URL = "https://www.recoverymisfits.org";
  function sharePassItOn(){
    const text =
`PASS IT ON — Recovery Misfits
Find the app here:
${PASS_URL}`;

    // Real phones (iOS/Android) support the native share sheet — use it.
    if (navigator.share){
      navigator.share({ title:"Pass it on", text, url: PASS_URL }).catch(()=>{});
      return;
    }

    // Desktop/other browsers: just copy the link, no unreliable sms: handoff.
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(()=>alert("Copied! Paste it anywhere to share.")).catch(()=>{
        prompt("Copy this and share it:", text);
      });
    } else {
      prompt("Copy this and share it:", text);
    }
  }
  shareBtn.onclick = (e) => { e.preventDefault(); e.stopPropagation(); sharePassItOn(); };

  // ===== helpers =====
  function rand(arr){ return arr[(Math.random()*arr.length)|0]; }

  function aabb(ax, ay, aw, ah, bx, by, bw, bh){
    return ax < bx + bw && ax + aw > bx && ay < by + bh && ay + ah > by;
  }

  function sizeForLabel(label, minW, maxW, h){
    const extra = Math.min(360, Math.max(0, (label.length - 10) * 11));
    const w = Math.min(maxW, minW + extra);
    return { w, h };
  }

  // ===== THE slow-down dial (15% control) =====
  function currentSpeed(){
    let s = BASE_SPEED + prestigeSpeedBoost;
    s += stepIndex * 0.18;
    s += Math.min(1.2, obstaclesPassed * 0.0022);
    s = Math.min(MAX_SPEED + prestigeSpeedBoost, s);

    if (slowTimer > 0) s *= 0.15;  // meditation: VERY slow
    if (warmupFrames < WARMUP_TOTAL) s *= 0.86;

    // Out of fuel: Bill is basically coasting. Keep a little movement so
    // a pink cloud can still reach him and restart the engine.
    if (fuel <= 0) s *= 0.18;
    else if (fuel < 18) s *= 0.72;

    return s;
  }

  // ===== text wrap =====
  function wrapLines(text, maxWidth){
    const words = String(text || "").split(/\s+/).filter(Boolean);
    const lines = [];
    let line = "";
    for (const w of words){
      const test = line ? (line + " " + w) : w;
      if (ctx.measureText(test).width <= maxWidth){
        line = test;
      } else {
        if (line) lines.push(line);
        line = w;
      }
    }
    if (line) lines.push(line);
    return lines;
  }

  function drawWrappedCentered(text, centerX, startY, maxWidth, lineHeight){
    const lines = wrapLines(text, maxWidth);
    let y = startY;
    for (const ln of lines){
      ctx.fillText(ln, centerX, y);
      y += lineHeight;
    }
    return lines.length;
  }

  // ===== starfield =====
  const stars = [];
  const STAR_CHARS = [".",".",".","*","+","·","˙"];
  function initStars(){
    stars.length = 0;
    const count = Math.min(220, Math.floor((W * H) / 7000));
    for (let i=0;i<count;i++){
      stars.push({
        x: Math.random()*W,
        y: Math.random()*H,
        z: 0.4 + Math.random()*1.6,
        ch: STAR_CHARS[(Math.random()*STAR_CHARS.length)|0],
        tw: Math.random()*1000
      });
    }
  }
  initStars();

  function drawStarfield(scrollSpeed){
    ctx.fillStyle = "#fff";
    ctx.font = "10px 'Press Start 2P'";
    for (const s of stars){
      s.x -= scrollSpeed * 0.35 * s.z;
      s.tw += 1;
      if (s.x < -10){
        s.x = W + 10;
        s.y = Math.random()*H;
        s.z = 0.4 + Math.random()*1.6;
      }
      const a = 0.22 + 0.40 * (0.5 + 0.5 * Math.sin((s.tw/35) + s.y*0.02));
      ctx.globalAlpha = a;
      if (s.ch === "." || s.ch === "·" || s.ch === "˙"){
        ctx.fillRect(s.x|0, s.y|0, 2, 2);
      } else {
        ctx.fillText(s.ch, s.x|0, s.y|0);
      }
    }
    ctx.globalAlpha = 1;
  }

  // ===== meditation sky background =====
  const skyClouds = [];
  function initSky(){
    skyClouds.length = 0;
    const count = Math.min(10, Math.max(6, Math.floor(W / 180)));
    for (let i=0;i<count;i++){
      skyClouds.push({
        x: Math.random()*W,
        y: 90 + Math.random()*(Math.max(120, H*0.45)),
        w: 70 + Math.random()*90,
        h: 22 + Math.random()*18,
        vx: 0.20 + Math.random()*0.25
      });
    }
  }

  function drawSky(){
    ctx.fillStyle = "#7cc9ff";
    ctx.fillRect(0,0,W,H);

    ctx.globalAlpha = 0.10;
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(0,0,W,H);
    ctx.globalAlpha = 1;

    for (const c of skyClouds){
      c.x -= c.vx;
      if (c.x < -c.w - 40){
        c.x = W + 40 + Math.random()*120;
        c.y = 90 + Math.random()*(Math.max(120, H*0.45));
        c.w = 70 + Math.random()*90;
        c.h = 22 + Math.random()*18;
        c.vx = 0.20 + Math.random()*0.25;
      }
      const x=c.x, y=c.y, w=c.w, h=c.h;
      ctx.globalAlpha = 0.92;
      ctx.fillStyle = "rgba(255,255,255,0.92)";
      ctx.fillRect(x, y, w, h);
      ctx.fillRect(x + 10, y - 8, w*0.35, h*0.70);
      ctx.fillRect(x + w*0.30, y - 12, w*0.40, h*0.85);
      ctx.fillRect(x + w*0.62, y - 7, w*0.28, h*0.65);

      ctx.globalAlpha = 0.22;
      ctx.strokeStyle = "rgba(255,255,255,0.75)";
      ctx.strokeRect(x, y, w, h);
      ctx.globalAlpha = 1;
    }
  }

  // ===== sparkle FX =====
  const sparkleFx = [];

  // ===== rocket exhaust / smoke =====
  const exhaustFx = [];
  let sputterTick = 0;

  function spawnSputter(){
    // Short irregular dirty puffs when the rocket is starved for fuel.
    const burst = 2 + (Math.random()*3|0);
    for (let i=0; i<burst; i++){
      exhaustFx.push({
        x: player.x + 4 + Math.random()*7,
        y: player.y + player.h*0.72 + (Math.random()*14 - 7),
        vx: -(0.35 + Math.random()*0.9),
        vy: (Math.random()*1.2 - 0.6),
        r: 2 + Math.random()*5,
        t: 0,
        ttl: 12 + (Math.random()*16|0),
        sputter: true
      });
    }
  }

  function spawnExhaust(){
    if (fuel <= 0 || mode !== "play") return;

    // Less exhaust as the tank gets low.
    const fuelRatio = fuel / MAX_FUEL;
    const count = fuelRatio < 0.20 ? 1 : 2;

    for (let i=0; i<count; i++){
      exhaustFx.push({
        x: player.x + 5 + Math.random()*8,
        y: player.y + player.h*0.72 + (Math.random()*12 - 6),
        vx: -(0.8 + Math.random()*1.4),
        vy: (Math.random()*0.7 - 0.35),
        r: 2.5 + Math.random()*4.5,
        t: 0,
        ttl: 22 + (Math.random()*18|0)
      });
    }

    if (exhaustFx.length > 90){
      exhaustFx.splice(0, exhaustFx.length - 90);
    }
  }

  function updateExhaust(){
    for (let i=exhaustFx.length-1; i>=0; i--){
      const p = exhaustFx[i];
      p.t++;
      p.x += p.vx;
      p.y += p.vy;
      p.r += 0.10;
      if (p.t >= p.ttl) exhaustFx.splice(i,1);
    }
  }

  function drawExhaust(){
    for (const p of exhaustFx){
      const a = Math.max(0, 1 - p.t/p.ttl);
      ctx.globalAlpha = (p.sputter ? 0.72 : 0.50) * a;
      ctx.fillStyle = p.sputter ? "rgba(135,135,135,1)" : `rgba(${currentTrailRGB()},1)`;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }
  function spawnSparkles(x, y, count=20){
    for (let i=0;i<count;i++){
      const ch = (Math.random() < 0.55) ? "⭐" : (Math.random() < 0.75 ? "✨" : "🌟");
      const a = (Math.random() * Math.PI * 2);
      const sp = 1.8 + Math.random()*3.2;
      sparkleFx.push({
        x: x + (Math.random()*18 - 9),
        y: y + (Math.random()*18 - 9),
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp - 0.9,
        g: 0.03 + Math.random()*0.05,
        t: 0,
        ttl: 70 + (Math.random()*50|0),
        ch
      });
    }
    if (sparkleFx.length > 140) sparkleFx.splice(0, sparkleFx.length - 140);
  }

  function updateSparkles(){
    for (let i=sparkleFx.length-1;i>=0;i--){
      const s = sparkleFx[i];
      s.t++;
      s.vy += s.g;
      s.x += s.vx;
      s.y += s.vy;
      if (s.t > s.ttl) sparkleFx.splice(i,1);
    }
  }

  function drawSparkles(){
    if (!sparkleFx.length) return;
    ctx.font = "18px 'Press Start 2P'";
    ctx.textAlign = "center";
    for (const s of sparkleFx){
      const a = Math.max(0, 1 - (s.t / s.ttl));
      ctx.globalAlpha = a;
      ctx.fillText(s.ch, s.x, s.y);
    }
    ctx.globalAlpha = 1;
    ctx.textAlign = "left";
  }

  // ===== cloud pattern + draw =====
  function buildCloudPattern(w, h){
    const puffs = [];
    const cx = w/2, cy = h/2;
    const count = 14;
    for (let i=0;i<count;i++){
      const angle = (i / count) * Math.PI * 2;
      const rx = (w * 0.28) + (Math.random()*w*0.06);
      const ry = (h * 0.22) + (Math.random()*h*0.06);
      const px = cx + Math.cos(angle)*rx + (Math.random()*10 - 5);
      const py = cy + Math.sin(angle)*ry + (Math.random()*8 - 4);
      const r  = 16 + Math.random()*16;
      puffs.push({x:px, y:py, r});
    }
    for (let i=0;i<8;i++){
      puffs.push({
        x: cx + (Math.random()*w*0.36 - w*0.18),
        y: cy + (Math.random()*h*0.32 - h*0.16),
        r: 12 + Math.random()*12
      });
    }
    const sparks = [];
    for (let i=0;i<10;i++){
      sparks.push({x: Math.random()*w, y: Math.random()*h});
    }
    return { puffs, sparks };
  }

  function drawCloud(x, y, w, h, cloud, alpha=1, micro=false, theme="pink"){
    const fill =
      (theme === "blue")   ? "rgba(126,203,255,1)" :
      (theme === "purple") ? "rgba(185,120,255,1)" :
      "rgba(255,105,180,1)";

    const stroke =
      (theme === "blue")   ? "rgba(190,235,255,0.95)" :
      (theme === "purple") ? "rgba(232,205,255,0.95)" :
      "rgba(255,180,220,0.95)";

    const spark =
      (theme === "blue")   ? "rgba(240,250,255,1)" :
      (theme === "purple") ? "rgba(250,240,255,1)" :
      "rgba(255,240,250,1)";

    if (!micro){
      ctx.globalAlpha = 0.16 * alpha;
      ctx.fillStyle = fill;
      ctx.fillRect(x-18, y-16, w+36, h+32);
    }

    ctx.globalAlpha = (micro ? 0.30 : 0.34) * alpha;
    ctx.fillStyle = fill;
    for (const p of cloud.puffs){
      ctx.beginPath();
      ctx.arc(x+p.x, y+p.y, p.r, 0, Math.PI*2);
      ctx.fill();
    }

    if (!micro){
      ctx.globalAlpha = 0.95 * alpha;
      ctx.strokeStyle = stroke;
      ctx.lineWidth = 2;
      ctx.strokeRect(x, y, w, h);
      ctx.lineWidth = 1;
    }

    ctx.globalAlpha = 0.70 * alpha;
    ctx.fillStyle = spark;
    for (const s of cloud.sparks){
      ctx.fillRect((x+s.x)|0, (y+s.y)|0, 2, 2);
    }
    ctx.globalAlpha = 1;
  }

  // ===== spawn =====
  function spawnObstacle(labelOverride=null, laneOverride=null, xOverride=null){
    const label = labelOverride || rand(obstaclesPool);
    const lanes = laneYCenters();
    const lane = (laneOverride !== null) ? laneOverride : ((Math.random() * 3) | 0);
    const { w, h } = sizeForLabel(label, 154, 378, 32);
    const x = (xOverride !== null) ? xOverride : (W + 90);

    const tooClose = obstacles.some(o => o.lane === lane && Math.abs(o.x - x) < Math.max(182, w * 0.80));
    if (tooClose) return;

    obstacles.push({ x, y: lanes[lane]-h/2, w, h, label, lane, passed:false });
  }

  function spawnBonus(){
    const b = rand(bonusesPool);
    const lanes = laneYCenters();
    const r = Math.random();
    const lane = r < 0.55 ? 1 : (r < 0.78 ? 0 : 2);
    const { w, h } = sizeForLabel(b.label, 196, 406, 29);

    bonuses.push({
      x: W + 90,
      y: lanes[lane] - h/2,
      w, h,
      lane,
      type: b.type,
      label: b.label,
      cloud: buildCloudPattern(w, h)
    });
  }

  function spawnMicroCloud(){
    const lanes = laneYCenters();
    const lane = (Math.random() * 3) | 0;
    const w = 77, h = 28;
    microClouds.push({
      x: W + 90,
      y: lanes[lane] - h/2,
      w, h,
      lane,
      cloud: buildCloudPattern(w, h)
    });
  }

  function spawnStepToken(){
    if (stepIndex >= 12) return;
    const next = steps[stepIndex];
    const label = `STEP ${next.n} — ${next.p}`;
    const lanes = laneYCenters();
    const lane = (Math.random() * 3) | 0;
    const { w, h } = sizeForLabel(label, 252, 532, 36);
    const x = W + 110;

    stepTokens.push({ x, y: lanes[lane]-h/2, w, h, lane, label });

    const guardLane = (lane + 1 + ((Math.random()*2)|0)) % 3;
    spawnObstacle(null, guardLane, x - 154);
  }

  // ===== reset =====
  function resetRun(keepPrestige=true){
    lives = MAX_LIVES;
    lastObstacleLabel = "something";
    stepIndex = 0;
    obstaclesPassed = 0;
    clearArmed = false;

    obstacles.length = 0;
    bonuses.length = 0;
    microClouds.length = 0;
    stepTokens.length = 0;
    exhaustFx.length = 0;
    sputterTick = 0;

    warmupFrames = 0;
    invuln = 0;
    slowTimer = 0;
    fuel = MAX_FUEL;
    fuelWarningCooldown = 0;
    fuelEmptyPenaltyCooldown = 0;
    if (meditationBgm){ meditationBgm.pause(); meditationBgm.currentTime = 0; }

    obstacleGapPx = 520;
    bonusGapPx = 900;
    microGapPx = 520;
    stepCooldown = 60 * 6;
    stepSpawnBias = 0;

    billSpeech = null;
    resentmentPauseFrames = 0;
    resentmentSpeechText = "";
    introTimer = 0;

    streak = 0;
    bestStreakThisRun = 0;
    graceUsed = false;
    nearMissCooldown = 0;
    runStartFrame = frameCount;
    screenShakeFrames = 0;
    screenShakeMag = 0;
    edgeFlash = null;
    billSquash = null;
    impactParticles.length = 0;

    player.x = Math.floor(W * PLAYER_X_RATIO);
    const lanes = laneYCenters();
    player.y = lanes[1] - player.h/2;
    player.targetY = player.y;

    if (!keepPrestige){
      prestige = 0;
      prestigeSpeedBoost = 0;
    }

    showBillSpeech("TRUDGE THE ROAD — Go thru all 12 steps!", 70, "good");
  }

  // ===== controls =====
  let dragging = false;
  let dragPointerId = null;

  function pointerDown(e){
    canvas.setPointerCapture && canvas.setPointerCapture(e.pointerId);
    startMusic();
    resumeAudioCtx();

    if (mode === "title"){ startCountdown(); return; }
    if (mode === "gameover" || mode === "ending"){ setMode("title"); return; }
    if (mode === "ready") {
      const rect = canvas.getBoundingClientRect();
      const gameX = (e.clientX - rect.left) * (W / rect.width);
      const gameY = (e.clientY - rect.top) * (H / rect.height);
      if (aabb(gameX, gameY, 1, 1, player.x, player.y, player.w, player.h)) {
        introTimer = INTRO_HOLD + INTRO_FADE + 5;
        setMode("play");
      }
      return;
    }
    if (mode !== "play") return;

    dragging = true;
    dragPointerId = e.pointerId;
    const rect = canvas.getBoundingClientRect();
    const gameY = (e.clientY - rect.top) * (H / rect.height);
    player.targetY = gameY - player.h/2;
  }

  function pointerMove(e){
    if (!dragging) return;
    if (dragPointerId !== null && e.pointerId !== dragPointerId) return;
    if (mode !== "play") return;
    const rect = canvas.getBoundingClientRect();
    const gameY = (e.clientY - rect.top) * (H / rect.height);
    player.targetY = gameY - player.h/2;
  }

  function pointerUp(e){
    if (!dragging) return;
    if (dragPointerId !== null && e.pointerId !== dragPointerId) return;
    dragging = false;
    dragPointerId = null;
  }

  canvas.addEventListener("pointerdown", pointerDown, {passive:true});
  canvas.addEventListener("pointermove", pointerMove, {passive:true});
  canvas.addEventListener("pointerup", pointerUp, {passive:true});
  canvas.addEventListener("pointercancel", pointerUp, {passive:true});

  function tapStartOnly(e){
    // Ignore taps that land on the HTML buttons (share/pause) — those have
    // their own handlers and shouldn't also trigger a mode change here.
    if (e && e.target && e.target.closest && e.target.closest("#shareBtn, #pauseBtn")) return;

    startMusic();
    if (mode === "title") { startCountdown(); return; }
    if (mode === "gameover" || mode === "ending") { setMode("title"); return; }
  }
  addEventListener("mousedown", tapStartOnly, {passive:true});
  addEventListener("touchstart", tapStartOnly, {passive:true});

  // ===== title / countdown =====
  let titleTimer = 0;
  let globalTick = 0;
  let countdownTimer = 0;
  let countdownValue = 3;

  function startCountdown(){
    resetRun(true);
    countdownValue = 3;
    countdownTimer = 0;
    setMode("countdown");
  }

  // ===== ending coin fountain =====
  const coins = [];
  let endingFrames = 0;

  function spawnFountainBurst(n=24){
    const ox = W/2;
    const oy = H - 110;
    for (let i=0;i<n;i++){
      const angle = (-Math.PI/2) + (Math.random()*0.95 - 0.475);
      const speed = 7.5 + Math.random()*6.5;
      const vx = Math.cos(angle) * speed * (0.8 + Math.random()*0.35);
      const vy = Math.sin(angle) * speed;

      coins.push({
        x: ox + (Math.random()*18 - 9),
        y: oy + (Math.random()*10 - 5),
        vx, vy,
        g: 0.42 + Math.random()*0.22,
        t: 0,
        ttl: 110 + (Math.random()*70|0),
        ch: (Math.random() < 0.86 ? "🪙" : "✨")
      });
    }
    if (coins.length > 260) coins.splice(0, coins.length - 260);
  }

  function startEnding(){
    setMode("ending");
    coins.length = 0;
    endingFrames = 0;
    spawnFountainBurst(46);
    setTimeout(()=>{ if (mode==="ending") spawnFountainBurst(32); }, 220);
    setTimeout(()=>{ if (mode==="ending") spawnFountainBurst(26); }, 520);
  }

  function updateCoins(){
    for (let i=coins.length-1;i>=0;i--){
      const c = coins[i];
      c.t++;
      c.vy += c.g;
      c.x += c.vx;
      c.y += c.vy;
      if (c.t > c.ttl || c.y > H + 140 || c.x < -140 || c.x > W + 140){
        coins.splice(i,1);
      }
    }
  }

  function drawCoins(){
    if (!coins.length) return;
    ctx.font = "20px 'Press Start 2P'";
    ctx.textAlign = "center";
    for (const c of coins){
      const a = Math.max(0, 1 - (c.t / c.ttl));
      ctx.globalAlpha = a;
      ctx.fillText(c.ch, c.x, c.y);
    }
    ctx.globalAlpha = 1;
    ctx.textAlign = "left";
  }

  // ===== update =====
  function updateTitle(){ titleTimer++; }

  function updateCountdown(){
    countdownTimer++;
    if (countdownTimer % 60 === 0){
      countdownValue--;
      if (countdownValue < 0){
        const boxW = Math.min(W - 44, 980);
        const by = Math.max(92, Math.floor(H * 0.18));
        const pad = 18;
        ctx.font = "12px 'Press Start 2P'";
        const maxTextW = boxW - pad*2;
        const readyLines = [
          "Drag Bill around to go thru all 12 steps.",
          "Be careful — pitfalls cost a life.",
          "Blue clouds help you stay alive.",
          "Purple cloud slows life down."
        ];
        const wrapped = [];
        for (const l of readyLines){
          wrapped.push(...wrapLines(l, maxTextW));
          wrapped.push("");
        }
        if (wrapped.length && wrapped[wrapped.length-1] === "") wrapped.pop();
        const boxH = 24 + wrapped.length * 18 + 26;
        player.x = Math.floor(W * PLAYER_X_RATIO);
        player.y = Math.min(H - player.h - 72, by + boxH + 105);
        player.targetY = player.y;
        setMode("ready");
      }
    }
  }

  function updatePlay(){
    warmupFrames++;
    frameCount++;
    if (nearMissCooldown > 0) nearMissCooldown--;
    if (screenShakeFrames > 0) screenShakeFrames--; else screenShakeMag = 0;
    updateImpactParticles();
    if (billSquash && billSquash.t < billSquash.ttl) billSquash.t++;
    if (edgeFlash){
      edgeFlash.t++;
      if (edgeFlash.t >= edgeFlash.ttl) edgeFlash = null;
    }
    if (introTimer < (INTRO_HOLD + INTRO_FADE + 5)) introTimer++;

    // Burn rocket fuel while the run is active.
    // Prayer & Meditation slows the whole experience, so fuel burns more gently there too.
    const fuelBurn = slowTimer > 0 ? FUEL_BURN_PER_FRAME * 0.25 : FUEL_BURN_PER_FRAME;
    fuel = Math.max(0, fuel - fuelBurn);

    if (fuelWarningCooldown > 0) fuelWarningCooldown--;
    if (fuel <= 0 && fuelWarningCooldown <= 0){
      showBillSpeech("FUEL UP — GET ON THE PINK CLOUD", 110, "pink");
      fuelWarningCooldown = 60 * 4;
    }

    // Running on empty has real teeth now — not just a slowdown.
    if (fuel <= 0){
      if (fuelEmptyPenaltyCooldown > 0){
        fuelEmptyPenaltyCooldown--;
      } else {
        fuelEmptyPenaltyCooldown = 60 * 3; // a life every 3s spent completely empty
        if (invuln === 0){
          lives--;
          invuln = 80;
          streak = 0;
          shakeScreen(6, 10);
          flashEdges("255,90,140", 20);
          squashBill("hit", 14);
          playHitBuzz();
          showBillSpeech("RUNNING ON EMPTY — this'll wear you down!", 90, "pink");

          if (lives <= 0){
            setMode("gameover");
            return;
          }
        }
      }
    } else {
      fuelEmptyPenaltyCooldown = 0;
    }

    if (invuln > 0) invuln--;
    if (slowTimer > 0){
      slowTimer--;
      if (slowTimer === 0) stopMeditationMusic();
    }

    // sparkle drift while meditating
    if (slowTimer > 0 && (slowTimer % 18 === 0)){
      spawnSparkles(player.x + player.w*0.55, player.y + player.h*0.40, 4);
    }
    updateSparkles();

    if (fuel > 0){
      sputterTick = 0;
      if (warmupFrames % 3 === 0) spawnExhaust();
    } else {
      sputterTick++;
      // Uneven bursts: cough, pause, cough-cough.
      if (
        sputterTick % 46 === 1 ||
        sputterTick % 46 === 8 ||
        (sputterTick % 79 === 24)
      ){
        spawnSputter();
      }
    }
    updateExhaust();

    const padTop = 74;
    const padBot = 74;
    player.targetY = clamp(player.targetY, padTop, H - player.h - padBot);
    player.y += (player.targetY - player.y) * DRAG_FOLLOW;

    const lanes = laneYCenters();
    const playerCenter = player.y + player.h/2;
    let playerLane = 1;
    let bestD = Infinity;
    for (let i=0;i<3;i++){
      const d = Math.abs(lanes[i] - playerCenter);
      if (d < bestD){ bestD = d; playerLane = i; }
    }

    const spd = currentSpeed();

    if (stepCooldown > 0) stepCooldown--;
    else stepSpawnBias++;

    for (const o of obstacles) o.x -= spd;
    for (const b of bonuses) b.x -= spd;
    for (const s of stepTokens) s.x -= spd;
    for (const m of microClouds) m.x -= spd;

    // ===== CLEAR EFFECT: clear ALL traps currently on the page =====
    if (clearArmed){
      let cleared = 0;
      for (const o of obstacles){
        if (o.x > -200 && o.x < W + 200){
          o.x = -9999;
          cleared++;
        }
      }
      clearArmed = false;

      if (cleared > 0){
        showBillSpeech("WRITE IT DOWN — Nice! You cleared out the traps!", 90, "good");
      } else {
        showBillSpeech("WRITE IT DOWN — Nothing to clear... yet.", 70, "good");
      }
    }

    // hitbox
    // Scale the collision box with Bill's current sprite dimensions.
    // The old fixed 20px/18px cuts were based on the larger stretched sprite
    // and became too small after runner.png was corrected to its natural ratio.
    const rx = player.x + player.w * 0.12;
    const ry = player.y + player.h * 0.10;
    const rw = player.w * 0.76;
    const rh = player.h * 0.80;

    // obstacles — every obstacle in the pool is a "pitfall" that costs a
    // life, so all of them use the same lane-based hit window and trigger
    // Bill's reaction bubble (worded generically unless it's literally
    // "Resentment", which keeps its own specific lines). Requires real
    // vertical closeness (not just lane index) plus a tighter horizontal
    // window than before, so a hit only registers when Bill is actually
    // visually near the obstacle.
    for (const o of obstacles){
      if (o.lane !== playerLane) continue;

      const playerCenterY = player.y + player.h/2;
      const obstacleCenterY = o.y + o.h/2;
      const verticalClose = Math.abs(playerCenterY - obstacleCenterY) <= player.h * 0.65;

      const reachedBill =
        verticalClose &&
        o.x <= (player.x + player.w * 0.75) &&
        (o.x + o.w) >= (player.x + player.w * 0.20);

      if (reachedBill){
        o.x = -9999;
        lastObstacleLabel = o.label;

        const isFirstHitThisRun = !graceUsed;
        graceUsed = true;

        if (isFirstHitThisRun){
          // Grace: the first pitfall of a run is a warning, not a life loss.
          invuln = Math.max(invuln, 60);
        } else if (invuln === 0){
          lives--;
          invuln = 80;
        }

        streak = 0;
        shakeScreen(9, 14);
        spawnImpactBurst(player.x + player.w*0.5, player.y + player.h*0.5, "rgba(255,120,60,1)", 18);
        flashEdges("255,80,40", 24);
        squashBill("hit", 16);
        playHitBuzz();

        startResentmentReaction(o.label, isFirstHitThisRun);
        return;
      }

      if (!o.passed && (o.x + o.w) < player.x){
        o.passed = true;
        obstaclesPassed++;

        if (nearMissCooldown <= 0){
          nearMissCooldown = 90;
          showBillSpeech("WHEW, CLOSE ONE!", 60, "status");
        }
      }
    }

    // bonuses
    for (const b of bonuses){
      if (b.lane !== playerLane) continue;

      const bx = b.x + 18;
      const by = b.y + 10;
      const bw = Math.max(2, b.w - 36);
      const bh = Math.max(2, b.h - 18);

      if (aabb(rx, ry, rw, rh, bx, by, bw, bh)){
        if (b.type === "life"){
          const before = lives;
          lives = Math.min(MAX_LIVES, lives + 1);
          showBillSpeech(
            b.label.toUpperCase() + " — " + (lives>before ? "+1 SPIRITUAL LIFE" : "LIVING A FULL SPIRITUAL LIFE!"),
            75, "good"
          );
        } else if (b.type === "slow"){
          slowTimer = 60 * 12;
          startMeditationMusic();
          showBillSpeech("PRAYER & MEDITATION — Deep calm for 12 seconds.", 80, "good");
          spawnSparkles(player.x + player.w*0.60, player.y + player.h*0.40, 24);
        } else if (b.type === "clear"){
          clearArmed = true;
          showBillSpeech("WRITE IT DOWN — Clearing traps...", 55, "good");
        }

        streak++;
        if (streak > bestStreakThisRun) bestStreakThisRun = streak;
        squashBill("bonus", 14);
        spawnImpactBurst(player.x + player.w*0.5, player.y + player.h*0.4, "rgba(120,255,150,1)", 14);
        flashEdges("90,255,130", 18);
        playStreakChime(streak);

        b.x = -9999;
      }
    }

    // micro clouds
    for (const m of microClouds){
      if (m.lane !== playerLane) continue;

      const mx = m.x + 12;
      const my = m.y + 8;
      const mw = m.w - 24;
      const mh = m.h - 16;

      if (aabb(rx, ry, rw, rh, mx, my, mw, mh)){
        const beforeFuel = fuel;
        fuel = Math.min(MAX_FUEL, fuel + PINK_CLOUD_FUEL);
        const gained = Math.round(fuel - beforeFuel);
        showBillSpeech(
          "PINK CLOUD — FUEL — " + (gained > 0 ? `+${gained}% FUEL` : "TANK FULL"),
          70, "pink"
        );
        m.x = -9999;
      }
    }

    // steps
    for (const s of stepTokens){
      if (s.lane !== playerLane) continue;

      const sx = s.x + 12;
      const sy = s.y + 10;
      const sw = Math.max(2, s.w - 24);
      const sh = Math.max(2, s.h - 20);

      if (aabb(rx, ry, rw, rh, sx, sy, sw, sh)){
        stepIndex++;
        s.x = -9999;

        playStepJingle();
        spawnSparkles(player.x + player.w*0.5, player.y + player.h*0.35, 18);
        squashBill("bonus", 16);

        if (stepIndex < 12){
          const got = steps[stepIndex-1];
          showBillSpeech(`STEP ${got.n} — ${got.p} — Keep moving.`, 80, "good");
          stepCooldown = 60 * (20 + (Math.random()*12|0));
          stepSpawnBias = 0;
        } else {
          startEnding();
          return;
        }
      }
    }

    // cleanup
    for (let i = obstacles.length - 1; i >= 0; i--) if (obstacles[i].x < -1600) obstacles.splice(i, 1);
    for (let i = bonuses.length - 1; i >= 0; i--) if (bonuses[i].x < -1600) bonuses.splice(i, 1);
    for (let i = stepTokens.length - 1; i >= 0; i--) if (stepTokens[i].x < -1800) stepTokens.splice(i, 1);
    for (let i = microClouds.length - 1; i >= 0; i--) if (microClouds[i].x < -1200) microClouds.splice(i, 1);

    // spawn timers
    obstacleGapPx -= spd;
    bonusGapPx -= spd;
    microGapPx -= spd;

    const inWarmup = warmupFrames < WARMUP_TOTAL;
    const stepOnScreen = stepTokens.length > 0;

    if (obstacleGapPx <= 0){
      spawnObstacle();
      const base = inWarmup ? 600 : 420;
      const spread = inWarmup ? 320 : 260;
      obstacleGapPx = base + ((Math.random() * spread) | 0);

      if (!inWarmup && Math.random() < 0.16){
        const laneA = (Math.random()*3)|0;
        const laneB = (laneA + 1 + ((Math.random()*2)|0)) % 3;
        spawnObstacle(null, laneB, W + 90 + 280);
      }
    }

    if (!stepOnScreen){
      if (bonusGapPx <= 0 && Math.random() < (inWarmup ? 0.55 : 0.40)){
        spawnBonus();
        bonusGapPx = 900 + ((Math.random() * 560) | 0);
      }

      if (microGapPx <= 0 && Math.random() < (inWarmup ? 0.72 : 0.55)){
        spawnMicroCloud();
        microGapPx = (inWarmup ? 520 : 620) + ((Math.random() * 420) | 0);
      }
    } else {
      bonusGapPx = Math.max(bonusGapPx, 90);
      microGapPx = Math.max(microGapPx, 90);
    }

    if (stepIndex < 12 && stepTokens.length === 0 && stepCooldown <= 0){
      const chance = Math.min(0.020 + stepSpawnBias * 0.00008, 0.075);
      if (Math.random() < chance){
        spawnStepToken();
        stepCooldown = 60 * (18 + (Math.random()*12|0));
        stepSpawnBias = 0;

        const next = steps[stepIndex];
        showBillSpeech(`NEXT: STEP ${next.n} — Find the step card.`, 65, "status");
      }
    }

    tickBillSpeech();
  }

  function updateResentment(){
    if (resentmentPauseFrames > 0) resentmentPauseFrames--;

    if (resentmentPauseFrames <= 0){
      resentmentSpeechText = "";
      if (lives <= 0){
        setMode("gameover");
      } else {
        setMode("play");
      }
    }
  }

  function updateEnding(){
    endingFrames++;
    updateCoins();
    if (endingFrames % 42 === 0) spawnFountainBurst(18);
    if (endingFrames % 140 === 0) spawnFountainBurst(30);
  }

  function update(){
    if (mode === "title") return updateTitle();
    if (mode === "countdown") return updateCountdown();
    if (mode === "ready") return;
    if (mode === "play") return updatePlay();
    if (mode === "resentment") return updateResentment();
    if (mode === "ending") return updateEnding();
  }

  function drawDangerObstacle(o){
    const x=o.x, y=o.y, w=o.w, h=o.h;
    const isResentment = String(o.label || "").toLowerCase().includes("resentment");
    const pulse = 0.5 + 0.5*Math.sin(frameCount*0.12 + x*0.05);

    ctx.fillStyle = isResentment ? "rgba(255,160,0,0.22)" : "rgba(255,0,0,0.12)";
    ctx.fillRect(x-8, y-6, w+16, h+12);

    ctx.save();
    ctx.shadowColor = isResentment ? "rgba(255,170,0,0.85)" : "rgba(255,60,60,0.7)";
    ctx.shadowBlur = 4 + pulse*6;

    ctx.fillStyle = isResentment ? "#2a1400" : "#0b0b0b";
    ctx.strokeStyle = isResentment ? "rgba(255,170,0,0.95)" : "rgba(255,80,80,0.9)";
    ctx.lineWidth = isResentment ? 3 : 2;

    ctx.beginPath();
    const spikes = 10;
    const step = w / spikes;
    ctx.moveTo(x, y+h);
    for (let i=0;i<=spikes;i++){
      const px = x + i*step;
      const py = (i%2===0) ? y : (y + 12);
      ctx.lineTo(px, py);
    }
    ctx.lineTo(x+w, y+h);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    ctx.lineWidth = 1;
    ctx.restore();

    ctx.font = "9px 'Press Start 2P'";
    ctx.fillStyle = isResentment ? "#ffcc66" : "#fff";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(o.label.toUpperCase(), x + w/2, y + h/2 + 8);
    ctx.textAlign = "left";
    ctx.textBaseline = "alphabetic";
  }

  function drawRunner(){
    // Squash/stretch feedback on hit or bonus pickup.
    let sx = 1, sy = 1;
    if (billSquash && billSquash.t < billSquash.ttl){
      const u = billSquash.t / billSquash.ttl;
      const wobble = Math.sin(u * Math.PI) * (1 - u);
      if (billSquash.kind === "hit"){
        sx = 1 - wobble * 0.22;
        sy = 1 + wobble * 0.18;
      } else {
        sx = 1 + wobble * 0.16;
        sy = 1 - wobble * 0.14;
      }
    }

    const cx = player.x + player.w/2;
    const cy = player.y + player.h/2;

    ctx.save();
    ctx.translate(cx, cy);
    ctx.scale(sx, sy);
    ctx.translate(-cx, -cy);

    if (!runnerReady){
      ctx.fillStyle = "#fff";
      ctx.fillRect(player.x, player.y, player.w, player.h);
    } else {
      ctx.imageSmoothingEnabled = false;
      ctx.drawImage(runnerImg, 0, 0, runnerImg.width, runnerImg.height, player.x, player.y, player.w, player.h);
    }

    ctx.restore();
  }

  function drawBillSpeech(){
    if (!billSpeech) return;

    const alphaIn = Math.min(1, billSpeech.t / 10);
    const alphaOut = Math.min(1, (billSpeech.ttl - billSpeech.t) / 15);
    const alpha = Math.max(0, Math.min(alphaIn, alphaOut));

    const kind = billSpeech.kind || "status";
    const theme =
      (kind === "good") ? { bg: "rgba(210,255,220,0.97)", border: "rgba(0,110,40,0.95)", text: "#063d16" } :
      (kind === "bad")  ? { bg: "rgba(255,225,200,0.97)", border: "rgba(180,70,0,0.95)", text: "#5c2600" } :
      (kind === "pink") ? { bg: "rgba(255,214,235,0.97)", border: "rgba(220,20,120,0.95)", text: "#7a0a4a" } :
      { bg: "rgba(255,255,255,0.97)", border: "rgba(0,0,0,0.92)", text: "#000" };

    const maxW = Math.min(250, W - 24);
    const pad = 12;

    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.font = "8px 'Press Start 2P'";
    ctx.textAlign = "left";
    ctx.textBaseline = "top";

    const lines = wrapLines(billSpeech.text, maxW - pad*2);
    const lineH = 13;
    const bubbleH = Math.max(54, pad*2 + lines.length*lineH);

    // Always sits directly above Bill's head — never beside/over his sprite,
    // regardless of his width or which lane he's in.
    const bubbleX = Math.max(8, Math.min(W - maxW - 8, player.x + player.w/2 - maxW/2));
    const bubbleY = Math.max(165, player.y - bubbleH - 14);

    ctx.fillStyle = theme.bg;
    ctx.fillRect(bubbleX, bubbleY, maxW, bubbleH);

    ctx.strokeStyle = theme.border;
    ctx.lineWidth = 2;
    ctx.strokeRect(bubbleX, bubbleY, maxW, bubbleH);

    ctx.fillStyle = theme.text;
    let ty = bubbleY + pad;
    for (const line of lines){
      ctx.fillText(line, bubbleX + pad, ty);
      ty += lineH;
    }

    ctx.restore();
  }

  function drawFuelHUD(){
    const x = 12;
    const y = 118;
    const w = W - 24;
    const h = 12;
    const pct = Math.max(0, Math.min(1, fuel / MAX_FUEL));

    ctx.fillRect(barX, barY, barW, h);

    if (critical){
      const pulse = 0.5 + 0.5*Math.sin(frameCount*0.35);
      ctx.save();
      ctx.shadowColor = "rgba(255,60,90,0.9)";
      ctx.shadowBlur = 6 + pulse*6;
      ctx.fillStyle = `rgba(255,${60+pulse*40|0},90,0.98)`;

    ctx.textAlign = "left";
    let y = by + 44;
    for (const ln of wrapped){
      ctx.fillText(ln, bx + pad, y);
      y += lineH;
    }

    drawRunner();

    const bubbleW = 190;
    const bubbleH = 54;
    const bubbleX = clamp(player.x + player.w/2 - bubbleW/2, 12, W - bubbleW - 12);
    const bubbleY = player.y - bubbleH - 20;

    ctx.fillStyle = "#fff";
    ctx.strokeStyle = "#000";
    ctx.lineWidth = 3;
    ctx.fillRect(bubbleX, bubbleY, bubbleW, bubbleH);
    ctx.strokeRect(bubbleX, bubbleY, bubbleW, bubbleH);

    ctx.beginPath();
    ctx.moveTo(player.x + player.w/2 - 10, bubbleY + bubbleH);
    ctx.lineTo(player.x + player.w/2, bubbleY + bubbleH + 16);
    ctx.lineTo(player.x + player.w/2 + 10, bubbleY + bubbleH);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    ctx.fillStyle = "#000";
    ctx.font = "11px 'Press Start 2P'";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText("TAP ME TO START", bubbleX + bubbleW/2, bubbleY + bubbleH/2 + 1);
    ctx.textAlign = "left";
    ctx.textBaseline = "alphabetic";
    ctx.lineWidth = 1;
  }

  function drawPlayfield(){
    ctx.save();
    if (screenShakeFrames > 0 && screenShakeMag > 0){
      const dx = (Math.random()*2 - 1) * screenShakeMag;
      const dy = (Math.random()*2 - 1) * screenShakeMag;
      ctx.translate(dx, dy);
    }

    if (slowTimer > 0){
      drawSky();
    } else {
      ctx.fillStyle = "#000";
      ctx.fillRect(0,0,W,H);
      drawStarfield(currentSpeed());
    }

    drawHeader();

    for (const o of obstacles) drawDangerObstacle(o);
    for (const b of bonuses) drawBonus(b);
    for (const s of stepTokens) drawStepToken(s);
    for (const m of microClouds) drawMicroCloud(m);

    drawExhaust();
    drawRunner();
    drawImpactParticles();
    drawFuelHUD();
    drawLivesHUD();
    drawStreakHUD();

    drawSparkles();

    // Normal Bill speech.
    drawBillSpeech();

    if (mode === "play") drawIntroRules();

    ctx.restore();

    drawEdgeFlash();
  }

  function drawResentmentScreen(){
    // Completely frozen reaction screen.
    ctx.fillStyle = "#000";
    ctx.fillRect(0,0,W,H);
    drawStarfield(0);
    drawHeader();

    // Bill stays visible on the left.
    drawRunner();
    drawFuelHUD();
    drawLivesHUD();

    const reactionText = resentmentSpeechText || resentmentLines[0];

    // Large unmistakable speech bubble.
    const bx = 72;
    const bw = W - 84;
    const pad = 14;

    ctx.save();
    ctx.font = "8px 'Press Start 2P'";
    const lines = wrapLines(reactionText, bw - pad*2);
    const lineH = 15;
    const bh = Math.max(92, pad*2 + lines.length*lineH);
    const by = Math.max(180, Math.min(H - bh - 80, player.y - 55));

    ctx.fillStyle = "#fff";
    ctx.fillRect(bx, by, bw, bh);
    ctx.strokeStyle = "#000";
    ctx.lineWidth = 3;
    ctx.strokeRect(bx, by, bw, bh);

    ctx.fillStyle = "#000";
    ctx.textAlign = "left";
    ctx.textBaseline = "top";
    let ty = by + pad;
    for (const line of lines){
      ctx.fillText(line, bx + pad, ty);
      ty += lineH;
    }
    ctx.restore();
  }

  function drawGameOver(){
    const survivalSec = Math.round((frameCount - runStartFrame) / 60);
    const beatBest = justBeatBest.streak || justBeatBest.steps || justBeatBest.survival;

    ctx.fillStyle = "rgba(0,0,0,0.88)";
    ctx.fillRect(0, 0, W, H);

    ctx.textAlign = "center";
    ctx.fillStyle = "#fff";
    ctx.font = "11px 'Press Start 2P'";
    ctx.shadowColor = "rgba(255,80,80,0.6)";
    ctx.shadowBlur = 6;
    drawWrappedCentered(`${lastObstacleLabel.toUpperCase()} TOOK YOU OUT`, W/2, Math.floor(H*0.14), Math.floor(W*0.86), 18);
    ctx.shadowBlur = 0;

    ctx.font = "18px 'Press Start 2P'";
    ctx.fillStyle = "rgba(255,90,90,0.95)";
    ctx.fillText("GAME OVER", W/2, Math.floor(H*0.22));

    // Stat card
    const cardW = Math.min(W - 48, 320);
    const cx = (W - cardW)/2;
    const cardY = Math.floor(H*0.28);
    const rowH = 34;
    const rows = [
      ["STEPS CLEARED", `${stepIndex} / 12`],
      ["BEST STREAK", `${bestStreakThisRun}`],
      ["TIME ON THE ROAD", `${survivalSec}s`],
      ["ALL-TIME BEST STREAK", `${bestStats.bestStreak}`]
    ];
    const cardH = rows.length * rowH + 24;

    ctx.save();
    ctx.shadowColor = "rgba(0,0,0,0.6)";
    ctx.shadowBlur = 16;
    ctx.shadowOffsetY = 5;
    ctx.fillStyle = "rgba(20,20,26,0.92)";
    ctx.fillRect(cx, cardY, cardW, cardH);
    ctx.restore();

    ctx.strokeStyle = "rgba(255,255,255,0.22)";
    ctx.lineWidth = 2;
    ctx.strokeRect(cx, cardY, cardW, cardH);
    ctx.lineWidth = 1;

    ctx.font = "9px 'Press Start 2P'";
    let ry = cardY + 12;
    for (const [label, val] of rows){
      ctx.textAlign = "left";
      ctx.fillStyle = "rgba(255,255,255,0.65)";
      ctx.fillText(label, cx + 16, ry + 18);

      ctx.textAlign = "right";
      ctx.fillStyle = "#fff";
      ctx.fillText(val, cx + cardW - 16, ry + 18);

      if (ry + rowH < cardY + cardH - 4){
        ctx.strokeStyle = "rgba(255,255,255,0.08)";
        ctx.beginPath();
        ctx.moveTo(cx + 12, ry + rowH - 6);
        ctx.lineTo(cx + cardW - 12, ry + rowH - 6);
        ctx.stroke();
      }
      ry += rowH;
    }

    ctx.textAlign = "center";

    let afterY = cardY + cardH + 30;
    if (beatBest){
      const pulse = 0.6 + 0.4*Math.sin(frameCount*0.25);
      ctx.font = "11px 'Press Start 2P'";
      ctx.fillStyle = `rgba(255,215,${80+pulse*80|0},1)`;
      ctx.fillText("★ NEW PERSONAL BEST! ★", W/2, afterY);
      afterY += 34;
    }

    const blink = ((globalTick/18)|0) % 2 === 0;
    if (blink){
      ctx.font = "11px 'Press Start 2P'";
      ctx.fillStyle = "#fff";
      ctx.fillText("TAP TO TRY AGAIN", W/2, afterY);
    }
    afterY += 30;

    ctx.font = "8px 'Press Start 2P'";
    ctx.fillStyle = "rgba(255,255,255,0.6)";
    ctx.fillText("Try again — or don't. We'll be here.", W/2, afterY);

    ctx.textAlign = "left";
  }

  function drawEnding(){
    drawSky();
    drawCoins();
    drawEndingCard("YOU MADE IT THROUGH THE STEPS.", [
      "That matters.",
      `Best streak this run: ${bestStreakThisRun}`,
      "PASS IT ON below."
    ]);
  }

  function drawPause(){
    drawOverlay("PAUSED", ["Take a breath."]);
  }

  // ===== global screen finish (scanlines + vignette) =====
  let scanlinePattern = null;
  function getScanlinePattern(){
    if (scanlinePattern) return scanlinePattern;
    const p = document.createElement("canvas");
    p.width = 4; p.height = 4;
    const pctx = p.getContext("2d");
    pctx.fillStyle = "rgba(0,0,0,0)";
    pctx.fillRect(0,0,4,4);
    pctx.fillStyle = "rgba(0,0,0,0.16)";
    pctx.fillRect(0,0,4,1);
    scanlinePattern = ctx.createPattern(p, "repeat");
    return scanlinePattern;
  }

  function drawScreenFX(){
    ctx.save();
    ctx.globalAlpha = 0.5;
    ctx.fillStyle = getScanlinePattern();
    ctx.fillRect(0, 0, W, H);
    ctx.restore();

    const grad = ctx.createRadialGradient(W/2, H*0.42, H*0.32, W/2, H*0.5, H*0.78);
    grad.addColorStop(0, "rgba(0,0,0,0)");
    grad.addColorStop(1, "rgba(0,0,0,0.5)");
    ctx.save();
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);
    ctx.restore();
  }

  function draw(){
    if (mode === "title") drawTitle();
    else if (mode === "countdown") drawCountdown();
    else if (mode === "ready") drawReady();
    else if (mode === "play") drawPlayfield();
    else if (mode === "resentment") drawResentmentScreen();
    else if (mode === "pause") drawPause();
    else if (mode === "gameover") drawGameOver();
    else if (mode === "ending") drawEnding();
    drawScreenFX();
  }

  // ===== mode transitions =====
  function handleTryAgainFromEnding(){
    prestige++;
    prestigeSpeedBoost = Math.min(2.0, prestige * 0.30);
  }

  function finalizeRunStats(){
    const survivalSec = Math.round((frameCount - runStartFrame) / 60);
    justBeatBest = { streak:false, steps:false, survival:false };

    if (bestStreakThisRun > bestStats.bestStreak){
      bestStats.bestStreak = bestStreakThisRun;
      justBeatBest.streak = true;
    }
    if (stepIndex > bestStats.bestSteps){
      bestStats.bestSteps = stepIndex;
      justBeatBest.steps = true;
    }
    if (survivalSec > bestStats.bestSurvivalSec){
      bestStats.bestSurvivalSec = survivalSec;
      justBeatBest.survival = true;
    }
    saveBestStats();
  }

  const _setMode = setMode;
  setMode = (m) => {
    if (mode === "ending" && m === "title"){
      handleTryAgainFromEnding();
    }
    if ((m === "gameover" || m === "ending") && mode !== m){
      finalizeRunStats();
    }
    _setMode(m);
  };

  // ===== main loop =====
  function initAll(){
    initStars();
    initSky();
    resize();
  }
  initAll();
  addEventListener("resize", initAll);

  resetRun(true);
  setMode("title");

  function loop(){
    globalTick++;
    update();
    draw();
    requestAnimationFrame(loop);
  }
  loop();

})();
</script>
</body>
