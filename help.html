<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Help &mdash; Recovery Misfits</title>
<meta name="theme-color" content="#11110f">
<meta name="robots" content="noindex, follow">

<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Recovery Misfits">
<link rel="apple-touch-icon" href="./icon-192.png">

<style>html{background:#11110f}body{background:#11110f;color:#f1e7cf;margin:0}</style>

<style>
/* ===========================================================================
   HELP (v229, 7 Oct 2026).

   Mike: "add in a help section into the main profile ... how to do everything
   on the site and they can search".

   BUILT FOR A PHONE, at 393. Opened from the Help row on the You page, so You
   is the tab that stays lit, and that lit tab is the way back out.

   THE WORDS ARE NOT IN THIS FILE. They are in help-cards.js, one card per job.
   When a screen changes, its card changes in the same push.
   ======================================================================== */
@font-face{font-family:"RM Display";src:url("assets/fonts/oswald-600.woff2") format("woff2");font-weight:600;font-style:normal;font-display:swap}
:root{--bg:#11110f;--ivory:#f1e7cf;--gold:#d8b45b;--muted:#b7b0a2;--line:rgba(238,230,213,.16);
  --display:"RM Display","Arial Narrow",Impact,sans-serif;--ui:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
*{box-sizing:border-box}
body{font-family:var(--ui);-webkit-font-smoothing:antialiased}
main{max-width:620px;margin:0 auto;padding:18px 16px 0}
h1{margin:4px 0 2px;font:600 34px/1 var(--display);letter-spacing:.02em;text-transform:uppercase;color:var(--ivory)}
.sub{margin:0 0 14px;color:var(--muted);font-size:15px}

/* the search box: paper, like the comment boxes on the Porch, so it reads as "type here" */
.find{position:sticky;top:0;z-index:5;margin:0 -16px;padding:8px 16px 10px;background:var(--bg)}
.findbox{display:flex;align-items:center;gap:10px;height:52px;padding:0 8px 0 16px;border-radius:26px;background:#fffdf7;border:1.5px solid #cfc5ad}
.findbox svg{flex:none;width:22px;height:22px;fill:none;stroke:#6e675b;stroke-width:2;stroke-linecap:round}
.findbox input{flex:1;min-width:0;height:100%;border:0;background:none;outline:0;color:#1b1a17;font:17px var(--ui)}
.findbox input::placeholder{color:#8a8372}
.findbox button{flex:none;width:36px;height:36px;border:0;border-radius:50%;background:#e9e0cc;color:#1b1a17;font:700 16px var(--ui);cursor:pointer}
.findbox button[hidden]{display:none}

/* the groups to jump to */
.jump{display:flex;gap:8px;overflow-x:auto;margin:2px -16px 6px;padding:2px 16px 8px;scrollbar-width:none}
.jump::-webkit-scrollbar{display:none}
.jump button{flex:none;padding:9px 14px;border-radius:999px;border:1.5px solid var(--line);background:none;color:var(--ivory);font:700 13.5px var(--ui);white-space:nowrap;cursor:pointer}
.jump button.on{background:var(--gold);border-color:var(--gold);color:#17130b}

.grp{margin:18px 0 8px;font:600 15px/1 var(--display);letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
.grp[hidden],.card[hidden]{display:none}

/* one card = one job */
.card{margin:0 0 8px;border-radius:16px;border:1px solid var(--line);background:rgba(238,230,213,.04);overflow:hidden}
.card>button{display:flex;align-items:center;gap:12px;width:100%;min-height:58px;padding:12px 14px 12px 16px;border:0;background:none;color:#fff;font:700 16px/1.3 var(--ui);text-align:left;cursor:pointer}
.card>button span{flex:1}
.card>button i{flex:none;width:22px;height:22px;position:relative;font-style:normal}
.card>button i::before,.card>button i::after{content:"";position:absolute;left:3px;right:3px;top:10px;height:2px;border-radius:1px;background:var(--gold);transition:transform .2s}
.card>button i::after{transform:rotate(90deg)}
.card.open>button i::after{transform:rotate(0)}
.card .in{display:none;padding:0 16px 16px}
.card.open .in{display:block}
.card.open{border-color:rgba(216,180,91,.55)}
.card ol{margin:0;padding:0;list-style:none;counter-reset:n}
.card li{position:relative;counter-increment:n;padding:7px 0 7px 38px;color:var(--ivory);font-size:16px;line-height:1.4}
.card li::before{content:counter(n);position:absolute;left:0;top:6px;width:26px;height:26px;border-radius:50%;background:var(--gold);color:#17130b;font:800 13.5px/26px var(--ui);text-align:center}
.card .one li{padding-left:0}.card .one li::before{display:none}
.card .note{margin:10px 0 0;padding:10px 12px;border-radius:12px;background:#f7f1e3;color:#1b1a17;font-size:14.5px;line-height:1.35}
.card .go{display:inline-block;margin:14px 0 0;padding:13px 20px;border-radius:999px;background:var(--gold);color:#17130b;font:800 15px var(--ui);text-decoration:none}

.none{margin:26px 4px;color:var(--muted);font-size:16px;line-height:1.45;text-align:center}
.none[hidden]{display:none}
.none b{display:block;margin-bottom:6px;color:var(--ivory);font-size:18px}

/* 988: the same blue line as on the share screen */
.help988{display:flex;align-items:center;gap:10px;margin:26px 0 0;padding:10px 10px 10px 16px;border-radius:14px;background:#17324a;color:#dbe8f3;font-size:14px;line-height:1.3;text-decoration:none}
.help988 span{flex:1}
.help988 b{flex:none;padding:11px 15px;border-radius:999px;background:#f1e7cf;color:#17130b;font:800 14px/1 var(--ui)}
.tailroom{height:170px}
</style>
</head>

<!-- Opened from the You page, so You is the tab that stays lit. -->
<body data-rm-nav="account.html">

<div id="rm-topbar"></div>
<script src="./topbar.js" defer></script>

<main>
  <h1>Help</h1>
  <p class="sub">How to do things here. Tap a question, or search.</p>

  <div class="find">
    <label class="findbox">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M16.500 16.500L21 21"/></svg>
      <input type="search" id="q" placeholder="What do you need help with?" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="search" aria-label="Search help">
      <button type="button" id="qx" aria-label="Clear the search" hidden>&#10005;</button>
    </label>
  </div>

  <div class="jump" id="jump"></div>
  <div id="list"></div>
  <p class="none" id="none" hidden><b>Nothing matched that.</b>Try one word, like &ldquo;photo&rdquo; or &ldquo;password&rdquo;.</p>

  <a class="help988" href="tel:988"><span>Having a hard time? A real person answers, day or night.</span><b>Call 988</b></a>
  <div class="tailroom"></div>
</main>

<div id="rm-bottom-nav"></div>
<script src="./nav.js" defer></script>
<script src="./help-cards.js"></script>

<script>
(function () {
  var H = window.RM_HELP || { GROUPS: [], SAME: [], CARDS: [] };
  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) { return String(s).replace(/[&<>]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]; }); };
  var plain = function (s) { return String(s || "").toLowerCase().replace(/[‘’']/g, "").replace(/[^a-z0-9#]+/g, " ").trim(); };

  /* what each card can be found by: its question, steps, note and extra words */
  H.CARDS.forEach(function (c, i) {
    c.i = i;
    c.hq = " " + plain(c.q) + " ";
    c.hay = " " + plain([c.q, (c.s || []).join(" "), c.n || "", c.k || ""].join(" ")) + " ";
  });

  /* draw every card once, grouped */
  var html = "";
  H.GROUPS.forEach(function (g) {
    var mine = H.CARDS.filter(function (c) { return c.g === g[0]; });
    if (!mine.length) return;
    html += '<h2 class="grp" id="g-' + g[0] + '" data-g="' + g[0] + '">' + esc(g[1]) + "</h2>";
    mine.forEach(function (c) {
      html += '<div class="card" data-i="' + c.i + '" data-g="' + c.g + '"><button type="button" aria-expanded="false"><span>' + esc(c.q) + "</span><i></i></button>" +
        '<div class="in"><ol' + (c.s.length < 2 ? ' class="one"' : "") + ">" + c.s.map(function (s) { return "<li>" + esc(s) + "</li>"; }).join("") + "</ol>" +
        (c.n ? '<p class="note">' + esc(c.n) + "</p>" : "") +
        (c.go ? '<a class="go" href="' + esc(c.go[0]) + '">' + esc(c.go[1]) + " &rarr;</a>" : "") + "</div></div>";
    });
  });
  $("list").innerHTML = html;
  $("jump").innerHTML = H.GROUPS.map(function (g) { return '<button type="button" data-j="' + g[0] + '">' + esc(g[1]) + "</button>"; }).join("");

  /* open and close a card */
  $("list").addEventListener("click", function (e) {
    var b = e.target.closest(".card > button"); if (!b) return;
    var c = b.parentNode, on = !c.classList.contains("open");
    c.classList.toggle("open", on); b.setAttribute("aria-expanded", on ? "true" : "false");
  });

  /* jump to a group */
  $("jump").addEventListener("click", function (e) {
    var b = e.target.closest("[data-j]"); if (!b) return;
    if ($("q").value) { $("q").value = ""; run(); }
    var h = $("g-" + b.dataset.j); if (!h) return;
    var y = h.getBoundingClientRect().top + window.pageYOffset - 84;
    window.scrollTo({ top: y, behavior: "smooth" });
  });

  /* SEARCH. Every word they type has to be found in the card, and a word also counts when one of
     its same-meaning words is there ("delete" finds "take off", "picture" finds "photo"). */
  var SAME = H.SAME.map(function (set) { return set.map(plain); });
  function forms(w) {
    var out = [w];
    if (w.length > 3 && w.charAt(w.length - 1) === "s") out.push(w.slice(0, -1));
    if (w.length > 4 && w.slice(-3) === "ing") out.push(w.slice(0, -3));
    SAME.forEach(function (set) { if (out.some(function (o) { return set.indexOf(o) >= 0; })) set.forEach(function (x) { if (out.indexOf(x) < 0) out.push(x); }); });
    return out;
  }
  var SKIP = { how: 1, "do": 1, i: 1, a: 1, an: 1, the: 1, to: 1, my: 1, "is": 1, can: 1, on: 1, of: 1, "in": 1, it: 1, me: 1, what: 1, where: 1, "for": 1, and: 1, or: 1 };
  function run() {
    var raw = plain($("q").value), words = raw.split(" ").filter(function (w) { return w && !SKIP[w]; });
    $("qx").hidden = !$("q").value;
    var shown = {}, any = 0, scored = [];
    H.CARDS.forEach(function (c) {
      var ok = true, score = 0;
      words.forEach(function (w) {
        var f = forms(w), hit = false;
        f.forEach(function (x) { if (c.hay.indexOf(x.length < 3 ? " " + x + " " : " " + x) >= 0) { hit = true; if (c.hq.indexOf(" " + x) >= 0) score += 2; else score += 1; }   /* a word has to START there: "app" is not in "happens" */ });
        if (!hit) ok = false;
      });
      if (raw && raw.length > 2 && c.hay.indexOf(raw) >= 0) { ok = true; score += 3; }   /* the whole phrase, as typed */
      if (!words.length && !raw) ok = true;
      if (!words.length && raw) ok = c.hay.indexOf(raw) >= 0;
      if (ok) { shown[c.g] = 1; any++; scored.push([score, c.i]); }
      var el = $("list").querySelector('.card[data-i="' + c.i + '"]');
      el.hidden = !ok;
      if (!raw) { el.classList.remove("open"); el.style.order = ""; }
    });
    var searching = !!raw;
    $("list").querySelectorAll(".grp").forEach(function (h) { h.hidden = searching || !shown[h.dataset.g]; });
    $("jump").hidden = searching;
    /* while searching: one flat list, best match first, and if only one card is left it opens itself */
    $("list").style.display = searching ? "flex" : ""; $("list").style.flexDirection = searching ? "column" : "";
    if (searching) {
      scored.sort(function (a, b) { return b[0] - a[0] || a[1] - b[1]; });
      scored.forEach(function (s, n) { $("list").querySelector('.card[data-i="' + s[1] + '"]').style.order = n + 1; });
      if (any === 1) $("list").querySelector('.card[data-i="' + scored[0][1] + '"]').classList.add("open");
    }
    $("none").hidden = any > 0;
  }
  var tmr;
  $("q").addEventListener("input", function () { clearTimeout(tmr); tmr = setTimeout(run, 80); });
  $("q").addEventListener("keydown", function (e) { if (e.key === "Enter") this.blur(); });
  $("qx").addEventListener("click", function () { $("q").value = ""; run(); $("q").focus(); });

  /* /help.html?q=photo opens with that search already in */
  try { var pre = new URLSearchParams(location.search).get("q"); if (pre) { $("q").value = pre; } } catch (e) {}
  run();
})();
</script>
</body>
</html>
