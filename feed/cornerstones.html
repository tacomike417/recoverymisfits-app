<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cornerstones · Recovery Misfits</title>
<meta name="theme-color" content="#11110f">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/icon-192.png">
<style>html{background:#11110f}body{background:#11110f;color:#f1e7cf;margin:0}</style>
<style>
/* CORNERSTONES HEADQUARTERS. v3, 3 Nov 2026 (Mike: a six-screen mockup, "pull out my phone, find what I need, and
   get it to somebody in seconds"). Phone first, at 393. Black and gold, same as the Porch.

   SCREENS (hash routes, so the phone's back button and the arrow both work):
     #home      What do you need to do? Four doors + Tasks & deadlines.
     #bank      I'm at the bank: the papers in bank/, in order; one combined PDF; email it.
     #proof     Prove we're a nonprofit: straight to the IRS 501(c)(3) letter.
     #who       Who's in charge: the board, officers, governance papers.
     #search    Find paperwork.
     #tasks     Tasks & deadlines (table cornerstones_tasks, porch_77). Real items only.
     #docs      All documents: folders with real counts. #docs/<folder> lists one.
     #doc/<path> One paper: date, type, use, a preview, View / Save / Email.
     #admin     The board, add a paper, add a task.
   The papers live in the PRIVATE "cornerstones" bucket (porch_70). The database says who is on the board;
   nobody else gets a byte. No papers, names, EINs or passwords in this file: the repo is public.
   Earlier versions: v1/v2 (11 Oct 2026) the board folder with For the bank / Minutes / Board papers. */
@font-face{font-family:"RM Head";src:url("/assets/fonts/anton-400.woff2") format("woff2");font-display:swap}
@font-face{font-family:"RM Rail";src:url("/assets/fonts/oswald-500.woff2") format("woff2");font-weight:500;font-display:swap}
*{box-sizing:border-box}[hidden]{display:none!important}
:root{--gold:#e0bd6a;--gold2:#c9a24d;--line:rgba(224,189,106,.28);--muted:#a99d82;--card:#191814;--ok:#9fd49f;--bad:#e58b7c;--red:#c43b3b}
body{font:16px/1.4 Arial,sans-serif;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--gold)}
main{max-width:520px;margin:0 auto;padding:0 12px calc(86px + env(safe-area-inset-bottom))}
.top{position:sticky;top:0;z-index:5;background:#11110f;padding:calc(10px + env(safe-area-inset-top)) 0 6px}
.bar{display:flex;align-items:center;gap:8px}
.ib{flex:none;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:none;color:var(--gold);display:grid;place-items:center;text-decoration:none;cursor:pointer}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
h1{flex:1;margin:0;text-align:center;font:400 26px/1 "RM Head",Impact,sans-serif;letter-spacing:.04em;text-transform:uppercase}
.ver{position:absolute;right:0;top:calc(56px + env(safe-area-inset-top));padding:2px 8px;border-radius:999px;background:#fff;color:#000;font:800 11px Arial,sans-serif}
.scr{display:none}.scr.on{display:block}
.say{margin:26px 8px;text-align:center;color:var(--muted);font-size:16px}
.say a{color:var(--gold);font-weight:800}
.say b{display:block;margin-bottom:6px;color:#f1e7cf;font:400 26px "RM Head",Impact,sans-serif;text-transform:uppercase}
/* the brush header */
.brush{display:flex;align-items:center;gap:12px;margin:18px 0 10px}
.brush svg{width:40px;height:40px;flex:none;color:#f1e7cf}
.brush span{display:inline-block;padding:6px 16px;background:var(--gold);color:#11110f;font:400 24px/1.1 "RM Head",Impact,sans-serif;letter-spacing:.03em;text-transform:uppercase;border-radius:6px 14px 6px 14px;transform:skew(-4deg)}
.brush.c{justify-content:center;text-align:center}
.lead{margin:0 6px 14px;text-align:center;color:#d9cfb6;font-size:15px}
h2{margin:20px 2px 8px;font:500 13px "RM Rail",Oswald,"Arial Narrow",sans-serif;letter-spacing:.16em;color:var(--gold);text-transform:uppercase}
/* HOME */
.mark{margin:6px 0 4px;text-align:center}
.mark .rm{font:400 20px/1 "RM Head",Impact,sans-serif;letter-spacing:.12em;color:#f1e7cf;text-transform:uppercase}
.mark .star{color:var(--gold);font-size:14px;margin:2px 0}
.mark .cs{font:400 44px/1 "RM Head",Impact,sans-serif;letter-spacing:.06em;color:var(--gold);text-transform:uppercase}
.mark .hq{margin-top:6px;font:500 12px "RM Rail",Oswald,sans-serif;letter-spacing:.3em;color:#f1e7cf;text-transform:uppercase}
.mark .sub{margin-top:4px;color:var(--muted);font-size:13px}
.doors{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.door{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:150px;padding:14px 10px;border:1px solid var(--line);border-radius:18px;background:var(--card);text-align:center;cursor:pointer;position:relative}
.door.hot{background:var(--gold);color:#11110f;border-color:var(--gold)}
.door svg{width:38px;height:38px;color:var(--gold)}
.door.hot svg{color:#11110f}
.door b{font:400 19px/1.05 "RM Head",Impact,sans-serif;letter-spacing:.03em;text-transform:uppercase}
.door small{font-size:12px;color:var(--muted);line-height:1.3}
.door.hot small{color:#2a2410}
.door .go{position:absolute;right:10px;bottom:8px;font-size:18px}
.wide{display:flex;align-items:center;gap:10px;width:100%;min-height:58px;margin-top:10px;padding:0 14px;border:2px solid var(--gold);border-radius:16px;background:none;color:var(--gold);font:400 19px "RM Head",Impact,sans-serif;letter-spacing:.03em;text-transform:uppercase;cursor:pointer;text-align:left}
.wide svg{width:26px;height:26px;flex:none}
.wide .n{margin-left:auto;display:grid;place-items:center;min-width:26px;height:26px;padding:0 7px;border-radius:999px;background:var(--red);color:#fff;font:800 13px Arial,sans-serif}
.wide .arr{margin-left:6px}
/* LISTS OF PAPERS */
.rows{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:12px;min-height:60px;padding:8px 12px;border:1px solid var(--line);border-radius:14px;background:var(--card);text-align:left;cursor:pointer;width:100%}
.row .ic{flex:none;width:40px;display:flex;flex-direction:column;align-items:center;color:#f1e7cf}
.row .ic svg{width:26px;height:26px}
.row .ic em{font:800 9px Arial,sans-serif;font-style:normal;letter-spacing:.06em;padding:1px 4px;border-radius:4px;background:#f1e7cf;color:#11110f;margin-top:-2px}
.row .tx{flex:1;min-width:0}
.row .tx b{display:block;font:700 15px/1.25 Arial,sans-serif;overflow-wrap:anywhere}
.row .tx small{color:var(--muted);font-size:13px}
.row .arr{color:var(--gold);font-size:20px;flex:none}
.row.folder .ic{color:var(--gold)}
.row .cnt{flex:none;color:var(--muted);font-size:14px;margin-right:2px}
.box{margin-top:8px;padding:12px;border-radius:18px;border:1px solid var(--line);background:#15140f}
.box.gold{border:2px solid var(--gold);background:linear-gradient(180deg,#1f1b10,#15140f)}
.box.red{border-color:rgba(196,59,59,.6);background:#1c1313}
.box h2{margin-top:2px}
.none{margin:0;padding:14px;border:1px dashed var(--line);border-radius:14px;color:var(--muted);font-size:15px}
/* BUTTONS */
.big{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:56px;margin-top:10px;border:0;border-radius:16px;background:var(--gold);color:#11110f;font:400 20px "RM Head",Impact,sans-serif;letter-spacing:.03em;text-transform:uppercase;cursor:pointer}
.big svg{width:24px;height:24px}
.big small{display:block;font:600 12px Arial,sans-serif;letter-spacing:0;text-transform:none;color:#2a2410}
.big.line{background:none;border:2px solid var(--gold);color:var(--gold)}
.big.line small{color:var(--muted)}
.big:disabled{opacity:.5}
.two{display:flex;gap:10px}
.two .big{flex:1}
.msg{min-height:0;margin:8px 2px 0;font-size:14px;color:var(--gold)}
.msg.bad{color:var(--bad)}
.note{margin:22px 4px 0;color:var(--muted);font-size:13px;text-align:center}
/* DOC DETAIL */
.dhead{display:flex;align-items:center;gap:12px;margin:12px 0 10px}
.dhead .ic{flex:none;width:48px;display:flex;flex-direction:column;align-items:center}
.dhead .ic svg{width:34px;height:34px;color:#f1e7cf}
.dhead .ic em{font:800 10px Arial,sans-serif;font-style:normal;padding:1px 5px;border-radius:4px;background:#f1e7cf;color:#11110f;margin-top:-3px}
.dhead b{display:block;font:400 22px/1.1 "RM Head",Impact,sans-serif;letter-spacing:.02em}
.dhead small{color:var(--muted);font-size:14px}
.facts{padding:4px 12px;border:1px solid var(--line);border-radius:14px;background:var(--card)}
.facts div{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid rgba(224,189,106,.14);font-size:15px}
.facts div:last-child{border:0}
.facts span{flex:none;width:58px;color:var(--gold);font-weight:800}
.prev{position:relative;margin-top:12px;background:#fff;border-radius:10px;min-height:200px;display:grid;place-items:center;overflow:hidden}
.prev canvas,.prev img{display:block;width:100%;height:auto}
.prev .wait{color:#555;font-size:14px}
.pager{display:flex;align-items:center;justify-content:center;gap:16px;margin:8px 0 2px;color:var(--muted);font-size:14px}
.pager button{min-width:44px;height:40px;border:1px solid var(--line);border-radius:10px;background:none;color:var(--gold);font-size:20px;cursor:pointer}
.pager button:disabled{opacity:.3}
.pager b{padding:3px 12px;border-radius:999px;background:#2a2720;color:#f1e7cf;font:700 13px Arial,sans-serif}
.rmlink{display:block;margin:18px auto 0;background:none;border:0;color:var(--bad);font-size:14px;text-decoration:underline;cursor:pointer}
/* BOARD */
.board{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:6px}
.pp{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 6px 12px;border:1px solid var(--line);border-radius:16px;background:var(--card);text-align:center;text-decoration:none;color:inherit}
.pp .av{width:64px;height:64px;border-radius:50%;overflow:hidden;display:grid;place-items:center;background:#3a3427;border:2px solid var(--gold);font:400 24px "RM Head",Impact,sans-serif;color:#f1e7cf}
.pp .av img{width:100%;height:100%;object-fit:cover}
.pp b{font:700 14px/1.2 Arial,sans-serif}
.pp .role{font:500 12px "RM Rail",Oswald,sans-serif;letter-spacing:.14em;color:var(--gold);text-transform:uppercase}
.pp small{color:var(--muted);font-size:12px;overflow-wrap:anywhere}
/* SEARCH */
.sbar{display:flex;align-items:center;gap:10px;min-height:52px;padding:0 14px;border-radius:999px;background:#f1e7cf;color:#11110f}
.sbar svg{width:22px;height:22px;flex:none;color:#11110f}
.sbar input{flex:1;min-width:0;border:0;background:none;font-size:16px;color:#11110f;outline:none}
.sbar input::placeholder{color:#6b6250}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.chip{min-height:38px;padding:0 14px;border:1.5px solid var(--gold);border-radius:999px;background:none;color:#f1e7cf;font-size:14px;cursor:pointer}
.chip.on{background:var(--gold);color:#11110f}
/* TASKS */
.task{display:flex;align-items:center;gap:12px;min-height:60px;padding:8px 12px;border:1px solid var(--line);border-radius:14px;background:var(--card);text-align:left;cursor:pointer;width:100%}
.task .dot{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font:800 15px Arial,sans-serif}
.task .dot.red{background:var(--red);color:#fff}
.task .dot.cal{border:1.5px solid var(--gold);color:var(--gold)}
.task .dot.ok{background:#3a8f3a;color:#fff}
.task .tx{flex:1;min-width:0}
.task .tx b{display:block;font:700 15px/1.25 Arial,sans-serif}
.task .tx small{font-size:13px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.task .tx small.due{color:var(--bad);font-weight:700}
.task .arr{color:var(--gold);font-size:20px}
.pill{display:inline-block;padding:2px 10px;border-radius:999px;background:var(--gold);color:#11110f;font:800 12px Arial,sans-serif;margin-left:8px}
.pill.red{background:var(--red);color:#fff}
/* sheets */
.sheet{position:fixed;inset:0;z-index:20;display:none;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.6)}
.sheet.show{display:flex}
.sheet .sbox{width:100%;max-width:520px;max-height:92vh;overflow:auto;padding:18px 16px calc(18px + env(safe-area-inset-bottom));border-radius:22px 22px 0 0;background:#1b1a16;border-top:1px solid var(--line)}
.sheet h3{margin:0 0 4px;font:400 26px "RM Head",Impact,sans-serif;text-transform:uppercase}
.sheet p{margin:0 0 6px;color:var(--muted);font-size:14px}
.sheet p.body{color:#f1e7cf;font-size:15px}
label.f{display:block;margin:12px 0 4px;color:var(--muted);font-size:13px;font-weight:700;letter-spacing:.04em}
.in{width:100%;min-height:48px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:#11110f;font-size:16px}
textarea.in{min-height:80px;resize:vertical}
.menu{position:fixed;inset:0;z-index:20;display:none;align-items:flex-start;justify-content:flex-end;background:rgba(0,0,0,.5)}
.menu.show{display:flex}
.menu .mbox{margin:calc(60px + env(safe-area-inset-top)) 12px 0;min-width:230px;padding:8px;border-radius:16px;background:#1b1a16;border:1px solid var(--line)}
.menu a,.menu button{display:block;width:100%;padding:12px 14px;border:0;background:none;color:#f1e7cf;font-size:16px;text-align:left;text-decoration:none;border-radius:10px;cursor:pointer}
.menu a:active,.menu button:active{background:#2a2720}
/* the full-screen viewer */
#view{position:fixed;inset:0;z-index:30;display:none;flex-direction:column;background:#000}
#view.show{display:flex}
.vbar{flex:none;display:flex;align-items:center;gap:8px;padding:calc(8px + env(safe-area-inset-top)) 8px 8px;background:#11110f;border-bottom:1px solid var(--line)}
.vbar b{flex:1;min-width:0;font:700 15px/1.2 Arial,sans-serif;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vbar .ib{border-radius:12px}
#pages{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;padding:8px 0 calc(70px + env(safe-area-inset-bottom));text-align:center}
#pages canvas,#pages img{display:block;margin:0 auto 8px;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.6)}
#pages .wait{color:var(--muted);margin-top:40px}
.vfoot{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:10px;padding:10px 10px calc(10px + env(safe-area-inset-bottom));pointer-events:none}
.vfoot button{pointer-events:auto;min-width:52px;height:48px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:rgba(17,17,15,.92);color:var(--gold);font-weight:800;cursor:pointer}
.toast{position:fixed;left:12px;right:12px;bottom:calc(90px + env(safe-area-inset-bottom));z-index:40;margin:0 auto;max-width:496px;padding:14px;border-radius:14px;background:#1b1a16;border:1px solid var(--line);color:var(--gold);font-size:15px;text-align:center}
.toast.bad{color:var(--bad)}
/* bottom nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;display:flex;justify-content:space-around;padding:6px 6px calc(8px + env(safe-area-inset-bottom));background:#0b0b0a;border-top:1px solid var(--line)}
nav.tabs button{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:70px;padding:4px 6px;border:0;background:none;color:#cdbf9c;font:700 12px Arial,sans-serif;cursor:pointer}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button.on{color:var(--gold)}
nav.tabs button.on svg{stroke:var(--gold)}
</style>
</head>
<body>
<main>
  <div class="top">
    <div class="bar">
      <button type="button" class="ib" id="back" aria-label="Back"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
      <h1 id="title">Cornerstones</h1>
      <button type="button" class="ib" id="menubtn" aria-label="Menu"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    </div>
  </div>
  <span class="ver">v3</span>
  <div id="gate"></div>
  <section class="scr" id="s-home"></section>
  <section class="scr" id="s-bank"></section>
  <section class="scr" id="s-proof"></section>
  <section class="scr" id="s-who"></section>
  <section class="scr" id="s-search"></section>
  <section class="scr" id="s-tasks"></section>
  <section class="scr" id="s-docs"></section>
  <section class="scr" id="s-doc"></section>
  <section class="scr" id="s-admin"></section>
</main>

<nav class="tabs" id="tabs" hidden>
  <button type="button" data-go="home"><svg class="i" viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v9a2 2 0 0 1-2 2h-4v-7H9v7H5a2 2 0 0 1-2-2z"/></svg>Home</button>
  <button type="button" data-go="docs"><svg class="i" viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h6"/></svg>Documents</button>
  <button type="button" data-go="search"><svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>Search</button>
  <button type="button" data-go="admin"><svg class="i" viewBox="0 0 24 24"><circle cx="9" cy="8" r="4"/><path d="M2 20c0-4 3-6 7-6s7 2 7 6"/><path d="M17 11h5M19.5 8.5v5"/></svg>Admin</button>
</nav>

<!-- MENU -->
<div class="menu" id="menu"><div class="mbox">
  <a href="/feed/porch.html">Back to the Porch</a>
  <button type="button" data-go="admin">Add a paper</button>
  <button type="button" id="reload">Reload the folder</button>
  <a href="/account.html">Account</a>
</div></div>

<!-- ADD A PAPER -->
<div class="sheet" id="add" role="dialog" aria-modal="true" aria-label="Add a paper">
  <div class="sbox">
    <h3>Add a paper</h3>
    <p>A PDF, or a photo of a signed page. Only the board can see it. Name it with the date first, like the rest.</p>
    <label class="f" for="addfile">THE FILE</label>
    <input class="in" type="file" id="addfile" accept="application/pdf,image/*">
    <label class="f" for="adddate">DATE ON THE PAPER</label>
    <input class="in" type="date" id="adddate">
    <label class="f" for="addname">CALL IT</label>
    <input class="in" type="text" id="addname" maxlength="80" placeholder="Board Minutes, signed">
    <label class="f" for="addsec">PUT IT IN</label>
    <select class="in" id="addsec"></select>
    <div class="msg" id="addmsg"></div>
    <div class="two"><button type="button" class="big line" data-x="add">Close</button><button type="button" class="big" id="addgo">Save</button></div>
  </div>
</div>

<!-- A TASK -->
<div class="sheet" id="tsheet" role="dialog" aria-modal="true" aria-label="Task">
  <div class="sbox">
    <h3 id="tt"></h3>
    <p id="tdue"></p>
    <p class="body" id="tnote"></p>
    <p id="tlink"></p>
    <div class="msg" id="tmsg"></div>
    <div class="two"><button type="button" class="big line" data-x="tsheet">Close</button><button type="button" class="big" id="tdone">Mark done</button></div>
    <button type="button" class="rmlink" id="trm">Remove this task</button>
  </div>
</div>

<!-- ADD A TASK -->
<div class="sheet" id="tadd" role="dialog" aria-modal="true" aria-label="Add a task">
  <div class="sbox">
    <h3>Add a task</h3>
    <p>A deadline (has a date) or a to-do (no date). The whole board sees it.</p>
    <label class="f" for="tatitle">WHAT</label>
    <input class="in" type="text" id="tatitle" maxlength="120" placeholder="File the 990-N">
    <label class="f" for="tadate">DUE (leave blank for a to-do)</label>
    <input class="in" type="date" id="tadate">
    <label class="f" for="tanote">NOTES</label>
    <textarea class="in" id="tanote" maxlength="600" placeholder="Where, how, what to bring"></textarea>
    <label class="f" for="talink">WEB ADDRESS (optional)</label>
    <input class="in" type="url" id="talink" placeholder="https://">
    <div class="msg" id="tamsg"></div>
    <div class="two"><button type="button" class="big line" data-x="tadd">Close</button><button type="button" class="big" id="tago">Save</button></div>
  </div>
</div>

<!-- FULL-SCREEN VIEWER -->
<div id="view" role="dialog" aria-modal="true" aria-label="Paper">
  <div class="vbar">
    <button type="button" class="ib" id="vclose" aria-label="Close"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    <b id="vtitle"></b>
    <button type="button" class="ib" id="vshare" aria-label="Send this paper"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12"/><path d="M7.5 7.5L12 3l4.5 4.5"/><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/></svg></button>
  </div>
  <div id="pages"></div>
  <div class="vfoot"><button type="button" id="zout" aria-label="Smaller">&minus;</button><button type="button" id="zin" aria-label="Bigger">+</button></div>
</div>

  /* ---------------------------------------------------------------- TASKS & DEADLINES */
  function dueText(t) {
    if (!t.due) return "";
    var days = Math.round((new Date(t.due + "T12:00:00") - Date.now()) / 864e5);
    if (days < 0) return "Past due · was " + nice(t.due);
    if (days === 0) return "Due today";
    return "Due " + nice(t.due) + (days <= 60 ? " · " + days + " days" : "");
  }
  function taskRow(t, state) {
    var dot = state === "done" ? '<span class="dot ok">' + ICO.check + "</span>" : state === "hot" ? '<span class="dot red">!</span>' : '<span class="dot cal">' + ICO.cal + "</span>";
    var sub = state === "done" ? "Done " + nice(String(t.done_at).slice(0, 10)) : t.due ? dueText(t) : (t.note || "");
    var hot = state === "hot" && t.due && new Date(t.due + "T12:00:00") < Date.now();
    return '<button type="button" class="task" data-task="' + t.id + '">' + dot + '<span class="tx"><b>' + esc(t.title) + '</b><small class="' + (hot ? "due" : "") + '">' + esc(sub) + "</small></span><span class=\"arr\">›</span></button>";
  }
  function drawTasks() {
    if (!tasks) { $("s-tasks").innerHTML = brush("Tasks & deadlines", ICO.tasks) + '<p class="none">The task list isn\'t switched on yet. Run porch_77_cornerstones_hq.sql in the Recovery Misfits Supabase project.</p>'; return; }
    var soon = Date.now() + 60 * 864e5, open = tasks.filter(function (t) { return !t.done_at; });
    var hot = open.filter(function (t) { return t.kind === "todo" || (t.due && new Date(t.due + "T12:00:00").getTime() <= soon); }).sort(function (a, b) { return (a.due || "9") > (b.due || "9") ? 1 : -1; });
    var up = open.filter(function (t) { return hot.indexOf(t) < 0; }).sort(function (a, b) { return (a.due || "9") > (b.due || "9") ? 1 : -1; });
    var done = tasks.filter(function (t) { return t.done_at; }).sort(function (a, b) { return a.done_at < b.done_at ? 1 : -1; }).slice(0, 6);
    $("s-tasks").innerHTML = brush("Tasks & deadlines", ICO.tasks) + '<p class="lead">What needs attention and what\'s coming up.</p>' +
      '<div class="box red"><h2>Needs attention (' + hot.length + ")</h2>" + (hot.length ? '<div class="rows">' + hot.map(function (t) { return taskRow(t, "hot"); }).join("") + "</div>" : '<p class="none">Nothing pressing.</p>') + "</div>" +
      '<div class="box"><h2>Upcoming (' + up.length + ")</h2>" + (up.length ? '<div class="rows">' + up.map(function (t) { return taskRow(t, "up"); }).join("") + "</div>" : '<p class="none">No dates on the calendar yet.</p>') + "</div>" +
      '<div class="box"><h2>Completed (recent)</h2>' + (done.length ? '<div class="rows">' + done.map(function (t) { return taskRow(t, "done"); }).join("") + "</div>" : '<p class="none">Nothing ticked off yet.</p>') + "</div>" +
      '<button type="button" class="big line" id="taddbtn">' + ICO.plus + "Add a task</button>" +
      '<p class="note">"Needs attention" is anything due in the next 60 days, past due, or a to-do with no date.</p>';

  var prev = { d: null, pdf: null, page: 1, n: 1 };

      '<div class="facts"><div><span>Date:</span>' + esc(d.date ? nice(d.date) : "On the paper") + "</div><div><span>Type:</span>" + esc(kindOf(d)) + "</div><div><span>Use:</span>" + esc(useOf(d)) + "</div></div>" +
      '<div class="prev" id="prev"><span class="wait">Opening…</span></div>' +
      '<div class="pager" id="pager" hidden><button type="button" id="pprev">‹</button><b id="pnum">1 of 1</b><button type="button" id="pnext">›</button></div>' +

      '<div class="two"><button type="button" class="big line" data-save="' + i + '">' + ICO.save + "Save " + (d.pdf ? "PDF" : "image") + '</button><button type="button" class="big line" data-mail="' + i + '">' + ICO.mail + "Email</button></div>" +
      '<p class="note">Folder: ' + esc((FOLDERS.filter(function (f) { return f.key === d.folder; })[0] || {}).label || d.folder) + (d.size ? " · " + Math.round(d.size / 1024) + " KB" : "") + "</p>" +
      '<button type="button" class="rmlink" data-rm="' + i + '">Take this paper out of the folder</button>';

  async function preview(d) {
    prev = { d: d, pdf: null, page: 1, n: 1 }; var box = $("prev");
    try {
      var b = await getBlob(d); if (prev.d !== d) return;
      if (!/pdf/.test(b.type)) { box.innerHTML = '<img alt="" src="' + URL.createObjectURL(b) + '">'; return; }
      var lib = await pdfjs(); prev.pdf = await lib.getDocument({ data: new Uint8Array(await b.arrayBuffer()) }).promise; if (prev.d !== d) return;
      prev.n = prev.pdf.numPages; $("pager").hidden = prev.n < 2; await paintPrev();
    } catch (e) { box.innerHTML = '<span class="wait">Couldn\'t open it. Check your signal.</span>'; }
  }
  async function paintPrev() {
    var box = $("prev"), pg = await prev.pdf.getPage(prev.page), w = box.clientWidth || 360;
    var vp = pg.getViewport({ scale: w / pg.getViewport({ scale: 1 }).width }), dpr = Math.min(window.devicePixelRatio || 1, 2);
    var c = document.createElement("canvas"); c.width = Math.round(vp.width * dpr); c.height = Math.round(vp.height * dpr);
    await pg.render({ canvasContext: c.getContext("2d"), viewport: vp, transform: dpr !== 1 ? [dpr, 0, 0, dpr, 0, 0] : null }).promise;
    box.innerHTML = ""; box.appendChild(c);
    $("pnum").textContent = prev.page + " of " + prev.n; $("pprev").disabled = prev.page <= 1; $("pnext").disabled = prev.page >= prev.n;
  }

  /* ---------------------------------------------------------------- SAVE / EMAIL / SEND */
  function niceName(d) {
    var t = (d.title + (d.date ? " - " + d.date : "") + (d.sub ? " - " + d.sub : "")).replace(/[\\/:*?"<>|·]/g, "-");
    return "Cornerstones Recovery - " + t + (d.pdf ? ".pdf" : (d.name.match(/\.[a-z0-9]+$/i) || [".jpg"])[0]);
  }
  function download(blob, fname) {
    var u = URL.createObjectURL(blob), a = document.createElement("a");
    a.href = u; a.download = fname; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(u); }, 60000);
  }
  /* EMAIL. On a phone: the share sheet (pick Gmail, Messages, Drive). On a computer the file is saved and a
     new email opens with the subject filled in; attach the saved file. (A web page can't attach a file to an email by itself.) */
  async function emailFile(blob, fname, label) {
    var f = new File([blob], fname, { type: blob.type || "application/pdf" });
    if (navigator.canShare && navigator.canShare({ files: [f] })) {
      try { await navigator.share({ files: [f], title: label, text: label }); } catch (e) { if (e && e.name === "NotAllowedError") return "again"; }
      return "";
    }
    download(blob, fname);
    setTimeout(function () { location.href = "mailto:?subject=" + encodeURIComponent(label) + "&body=" + encodeURIComponent("Attached: " + fname + "\n\nCornerstones Recovery, Inc."); }, 600);
    toast("Saved to your downloads. Attach it to the email that opens.");
    return "";
  }
  async function saveDoc(d, btn) { if (btn) btn.disabled = true; try { download(await getBlob(d), niceName(d)); toast("Saved."); } catch (e) { toast("Couldn't get that paper. Check your signal.", true); } if (btn) btn.disabled = false; }
  async function mailDoc(d, btn) {
    if (btn) btn.disabled = true;
    try { if ((await emailFile(await getBlob(d), niceName(d), "Cornerstones Recovery - " + d.title)) === "again") toast("It's ready. Tap Email again."); }
    catch (e) { toast("Couldn't get that paper. Check your signal.", true); }
    if (btn) btn.disabled = false;
  }

  /* ---------------------------------------------------------------- THE VIEWER */
  var pdfjsReady = null;
  function loadScript(src) { return new Promise(function (ok, no) { var s = document.createElement("script"); s.src = src; s.onload = ok; s.onerror = no; document.head.appendChild(s); }); }
  function pdfjs() {
    if (!pdfjsReady) pdfjsReady = loadScript("/assets/vendor/pdfjs/pdf.min.js").then(function () {
      window.pdfjsLib.GlobalWorkerOptions.workerSrc = "/assets/vendor/pdfjs/pdf.worker.min.js"; return window.pdfjsLib;
    });
    return pdfjsReady;
  }
  async function openView(d, blob) {
    cur = { d: d, blob: blob }; zoom = 1;
    $("vtitle").textContent = d ? d.title : "Bank packet";
    $("view").classList.add("show");
    try { history.pushState({ v: 1 }, ""); } catch (e) {}
    try { var el = document.documentElement; if (el.requestFullscreen && !document.fullscreenElement) el.requestFullscreen().catch(function () {}); } catch (e) {}
    $("pages").innerHTML = '<p class="wait">Opening…</p>';
    try { if (!blob) cur.blob = await getBlob(d); await paint(); }
    catch (e) { $("pages").innerHTML = '<p class="wait">Couldn\'t open it. Check your signal.</p>'; }
  }
  var paintRun = 0;
  async function paint() {
    var run = ++paintRun, box = $("pages"), w = Math.min(box.clientWidth, 900) - 12, blob = cur.blob;
    if (!/pdf/.test(blob.type)) { box.innerHTML = '<img alt="" src="' + URL.createObjectURL(blob) + '" style="width:' + Math.round(w * zoom) + 'px">'; return; }
    var lib = await pdfjs();
    if (!cur.pdf) cur.pdf = await lib.getDocument({ data: new Uint8Array(await blob.arrayBuffer()) }).promise;
    if (run !== paintRun) return;
    box.innerHTML = "";
    var dpr = Math.min(window.devicePixelRatio || 1, 2.5);
    for (var i = 1; i <= cur.pdf.numPages; i++) {
      var pg = await cur.pdf.getPage(i); if (run !== paintRun) return;
      var cssW = Math.round(w * zoom), vp = pg.getViewport({ scale: cssW / pg.getViewport({ scale: 1 }).width });
      var c = document.createElement("canvas");
      c.width = Math.round(vp.width * dpr); c.height = Math.round(vp.height * dpr);
      c.style.width = cssW + "px"; c.style.height = Math.round(vp.height) + "px";
      box.appendChild(c);
      await pg.render({ canvasContext: c.getContext("2d"), viewport: vp, transform: dpr !== 1 ? [dpr, 0, 0, dpr, 0, 0] : null }).promise;
    }
  }
  function closeView(fromBack) {
    if (!$("view").classList.contains("show")) return;
    $("view").classList.remove("show"); $("pages").innerHTML = ""; paintRun++;
    if (cur && cur.pdf) { try { cur.pdf.destroy(); } catch (e) {} }
    cur = null;
    try { if (document.fullscreenElement) document.exitFullscreen(); } catch (e) {}
    if (!fromBack) { try { history.back(); } catch (e) {} }
  }
  window.addEventListener("popstate", function () { if ($("view").classList.contains("show")) closeView(true); });

  async function saveAdd() {
    var f = $("addfile").files[0], nm = $("addname").value.trim(), dt = $("adddate").value, sec = $("addsec").value, m = $("addmsg");
    m.className = "msg bad";
    if (!f) { m.textContent = "Pick the file first."; return; }

    if (!dt) { m.textContent = "Put the date that's on the paper."; return; }
    var ext = /pdf/.test(f.type) ? ".pdf" : f.type === "image/png" ? ".png" : f.type === "image/webp" ? ".webp" : f.type === "image/heic" ? ".heic" : ".jpg";
    /* "Board Minutes, signed" + 2026-11-02 -> "2026-11-02__Board_Minutes__signed": the comma turns into the small line under the title */
    var folder = sec === "statements" ? "bank/statements/" + dt.slice(0, 4) : sec;
    var key = folder + "/" + dt + "__" + nm.replace(/\s+-\s+|\s*[·,]\s*/g, "__").replace(/[^A-Za-z0-9()'&+._ -]/g, "").replace(/ /g, "_").slice(0, 90) + ext;
    if (docs.some(function (d) { return d.path === key; })) key = key.replace(/(\.[a-z]+)$/, "__" + Date.now().toString(36) + "$1");
    m.className = "msg"; m.textContent = "Saving…"; $("addgo").disabled = true;
    try {
      var r = await fetch(DB + "/storage/v1/object/" + BUCKET + "/" + enc(key), { method: "POST", headers: await hdr({ "Content-Type": f.type || "application/octet-stream", "x-upsert": "false" }), body: f });
      if (!r.ok) throw new Error("up " + r.status);
      $("add").classList.remove("show"); packet = null; await load(); go("doc/" + encodeURIComponent(key)); toast("Saved for the whole board.");
    } catch (e) { m.className = "msg bad"; m.textContent = "Couldn't save it. Check your signal and try again."; $("addgo").disabled = false; }
  }

    var t = e.target, b;
    if ((b = t.closest("[data-go]"))) { $("menu").classList.remove("show"); return go(b.dataset.go); }
    if ((b = t.closest("[data-doc]"))) return go("doc/" + encodeURIComponent(docs[+b.dataset.doc].path));
    if ((b = t.closest("[data-open]"))) return openView(docs[+b.dataset.open]);
    if ((b = t.closest("[data-save]"))) return saveDoc(docs[+b.dataset.save], b);
    if ((b = t.closest("[data-mail]"))) return mailDoc(docs[+b.dataset.mail], b);
    if ((b = t.closest("[data-rm]"))) return removeDoc(docs[+b.dataset.rm]);
    if ((b = t.closest("[data-task]"))) return openTask(+b.dataset.task);
    if ((b = t.closest("[data-q]"))) { $("q").value = b.dataset.q; search(b.dataset.q); return; }
    if ((b = t.closest("[data-x]"))) return $(b.dataset.x).classList.remove("show");
    if (t.closest("#pkgo")) return makePacket(false);
    if (t.closest("#pkmail")) return makePacket(true);
    if (t.closest("#pksave")) { if (packet) { download(packet, packetName()); toast("Saved."); } return; }
    if (t.closest("#pkview")) { if (packet) openView(null, packet); return; }
    if (t.closest("#addbtn")) return openAdd();
    if (t.closest("#taddbtn")) { if (!tasks) return toast("Run porch_77 first.", true); $("tatitle").value = ""; $("tadate").value = ""; $("tanote").value = ""; $("talink").value = ""; $("tamsg").textContent = ""; $("tadd").classList.add("show"); return; }
    if (t.closest("#pprev")) { if (prev.page > 1) { prev.page--; paintPrev(); } return; }
    if (t.closest("#pnext")) { if (prev.page < prev.n) { prev.page++; paintPrev(); } return; }
    if (t.classList.contains("sheet") || t.classList.contains("menu")) return t.classList.remove("show");
  });
  $("addgo").onclick = saveAdd;
  $("tdone").onclick = toggleTask;
  $("trm").onclick = removeTask;
  $("tago").onclick = saveTask;
  $("vclose").onclick = function () { closeView(false); };
  $("vshare").onclick = function () { if (!cur) return; if (cur.d) mailDoc(cur.d); else emailFile(cur.blob, packetName(), "Cornerstones Recovery - Bank packet"); };
  $("zin").onclick = function () { if (cur && zoom < 3) { zoom = Math.min(3, zoom + 0.5); paint(); } };
  $("zout").onclick = function () { if (cur && zoom > 1) { zoom = Math.max(1, zoom - 0.5); paint(); } };
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") { if ($("view").classList.contains("show")) closeView(false); else document.querySelectorAll(".sheet.show,.menu.show").forEach(function (s) { s.classList.remove("show"); }); } });

  load();
})();
</script>
</body>
</html>
