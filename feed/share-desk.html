<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Share desk · Recovery Misfits</title>
<meta name="theme-color" content="#11110f">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/icon-192.png">
<style>html{background:#11110f}body{background:#11110f;color:#f1e7cf;margin:0}</style>
<style>
/* THE SHARE DESK, v3: A LOG (7 Oct 2026, Mike: "this misfits share desk just needs to be a log file for me,
   easy to read, simple, like for a preschooler. let me know what was posted today, and what is scheduled for
   later today, thats it since we have this all automated").

   It used to be a share manager (get the video, tick "I did it"). Posting is automatic now, so all of that is gone.
   This page only READS. misfits-post, the poster on Mike's computer, writes one line to porch_post_log every time
   something goes out (supabase/porch_68_post_log.sql).

   WHO CAN SEE IT: moderators only (Mike). The database checks that. No password in this file: the repo is public.

   LATER TODAY comes from two places:
     1. THE DAY below: the three posts that happen every day. The two videos are picked when they post, so there
        is no name to show yet.
     2. "planned" lines in porch_post_log: extras that are lined up for a set time.
   Phone first, at 393. */
@font-face{font-family:"RM Head";src:url("/assets/fonts/anton-400.woff2") format("woff2");font-display:swap}
@font-face{font-family:"RM Rail";src:url("/assets/fonts/oswald-500.woff2") format("woff2");font-weight:500;font-display:swap}
*{box-sizing:border-box}
:root{--gold:#e0bd6a;--line:rgba(224,189,106,.28);--muted:#a99d82;--card:#191814;--ok:#9fd49f}
body{font:16px/1.4 Arial,sans-serif;-webkit-text-size-adjust:100%}
main{max-width:480px;margin:0 auto;padding:0 12px calc(40px + env(safe-area-inset-bottom))}
.top{position:sticky;top:0;z-index:5;background:#11110f;padding:calc(10px + env(safe-area-inset-top)) 0 8px}
.bar{display:flex;align-items:center;gap:10px}
.back{flex:none;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:none;color:var(--gold);display:grid;place-items:center;text-decoration:none}
.back svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
h1{flex:1;margin:0;font:400 30px/1 "RM Head",Impact,sans-serif;letter-spacing:.02em;text-transform:uppercase}
.ver{flex:none;padding:3px 10px;border-radius:999px;background:#fff;color:#000;font:800 12px Arial,sans-serif}
.date{margin:6px 0 0 54px;color:var(--muted);font-size:15px}
.say{margin:26px 8px;text-align:center;color:var(--muted);font-size:16px}
.say a{color:var(--gold);font-weight:800}
.say b{display:block;margin-bottom:6px;color:#f1e7cf;font:400 26px "RM Head",Impact,sans-serif;text-transform:uppercase}
h2{margin:22px 2px 8px;font:500 15px "RM Rail",Oswald,"Arial Narrow",sans-serif;letter-spacing:.16em;color:var(--gold)}
.none{margin:0;padding:14px;border:1px dashed var(--line);border-radius:14px;color:var(--muted);font-size:16px}
.ln{display:grid;grid-template-columns:104px 1fr;gap:12px;align-items:start;margin-top:8px;padding:14px 12px;border:1px solid var(--line);border-radius:14px;background:var(--card)}
.tm{white-space:nowrap;font:400 21px/1.1 "RM Head",Impact,sans-serif;letter-spacing:.02em;color:#f1e7cf}
.tm small{display:block;margin-top:6px;font:800 12px Arial,sans-serif;letter-spacing:.04em}
.done .tm small{color:var(--ok)}
.next .tm small{color:var(--gold)}
.wh{min-width:0}
.wh b{display:block;font:500 12px "RM Rail",Oswald,sans-serif;letter-spacing:.16em;color:var(--muted)}
.wh p{margin:3px 0 0;font:700 16px/1.3 Arial,sans-serif;overflow-wrap:anywhere}
.wh i{display:block;margin-top:6px;font-style:normal;color:var(--muted);font-size:13px}
.next{border-style:dashed;background:none}
</style>
</head>
<body>
<main>
  <div class="top">
    <div class="bar">
      <a class="back" href="/feed/porch.html" aria-label="Back to the Porch"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></a>
      <h1>Share desk</h1>
      <span class="ver">v3</span>
    </div>
    <p class="date" id="date"></p>
  </div>
  <div id="list"><p class="say">Loading…</p></div>
</main>
<script src="/assets/account.js"></script>
<script>
(function () {
  "use strict";
  var DB = "https://rlytvfehbglsjfvprtbp.supabase.co";
  var A = window.RMAccount, KEY = A && A.anonKey;
  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); };
  /* THE DAY (Mike, 6 Oct): 6:30 AM a video, 10 AM the meme of the day, 6:30 PM a video. Hours on a 24 hour clock. */
  var DAY = [[6.5, "video", "A video"], [10, "meme", "Meme of the day"], [18.5, "video", "A video"]];
  var KIND = { video: "VIDEO", picture: "PICTURE", meme: "MEME" };

  async function rest(path) {
    var t = await A.token();
    var r = await fetch(DB + "/rest/v1/" + path, { headers: { apikey: KEY, Authorization: "Bearer " + (t || KEY) } });
    if (!r.ok) { var e = new Error("rest " + r.status); e.status = r.status; throw e; }
    return r.json();
  }
  function say(big, small) { $("list").innerHTML = '<p class="say"><b>' + big + "</b>" + small + "</p>"; }
  var clock = function (d) { return d.toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit" }); };
  /* "Instagram Reel, YouTube Short, Instagram Story" -> "Instagram, YouTube, Story" */
  function places(s) {
    var seen = {}, out = [];
    String(s || "").split(",").forEach(function (p) {
      p = p.trim(); if (!p) return;
      p = /story/i.test(p) ? "Story" : p.replace(/\s+(reel|short|post)$/i, "");
      if (!seen[p]) { seen[p] = 1; out.push(p); }
    });
    return out.join(", ");
  }
  function line(cls, when, tag, kind, words, where) {
    return '<article class="ln ' + cls + '"><div class="tm">' + clock(when) + "<small>" + tag + "</small></div>" +
      '<div class="wh"><b>' + (KIND[kind] || "POST") + "</b><p>" + esc(words) + "</p>" + (where ? "<i>Went to " + esc(where) + "</i>" : "") + "</div></article>";
  }

  function draw(rows) {
    var now = new Date(), y = now.getFullYear(), m = now.getMonth(), d = now.getDate();
    var posted = rows.filter(function (r) { return r.state === "posted"; });
    var later = rows.filter(function (r) { return r.state === "planned" && new Date(r.at) > now; }).map(function (r) {
      return { at: new Date(r.at), kind: r.kind, words: r.caption || r.title };
    });
    DAY.forEach(function (s) {
      var at = new Date(y, m, d, Math.floor(s[0]), Math.round((s[0] % 1) * 60));
      if (at > now) later.push({ at: at, kind: s[1], words: s[2] });
    });
    later.sort(function (a, b) { return a.at - b.at; });
    $("list").innerHTML =
      "<h2>POSTED TODAY</h2>" +
      (posted.length ? posted.map(function (r) { return line("done", new Date(r.at), "&#10003; POSTED", r.kind, r.caption || r.title, places(r.places)); }).join("")
                     : '<p class="none">Nothing has posted yet today.</p>') +
      "<h2>LATER TODAY</h2>" +
      (later.length ? later.map(function (r) { return line("next", r.at, "COMING UP", r.kind, r.words, ""); }).join("")
                    : '<p class="none">Nothing else today.</p>');
  }

  async function start() {
    $("date").textContent = new Date().toLocaleDateString("en-US", { weekday: "long", month: "long", day: "numeric" });
    if (!A || !A.signedIn()) return say("Sign in first", 'This page is for the moderators. <a href="/account.html">Sign in</a>, then come back.');
    try {
      var mod = await rest("porch_moderators?user_id=eq." + A.uid() + "&select=user_id");
      if (!mod.length) return say("Not for this account", 'The share desk is for moderators. <a href="/feed/porch.html">Back to the Porch</a>');
    } catch (e) { return say("Couldn't load", "Check your signal and try again."); }
    try {
      var n = new Date(), a = new Date(n.getFullYear(), n.getMonth(), n.getDate()), b = new Date(a.getTime() + 864e5);
      draw(await rest("porch_post_log?at=gte." + encodeURIComponent(a.toISOString()) + "&at=lt." + encodeURIComponent(b.toISOString()) +
        "&select=at,state,kind,title,caption,places&order=at.asc&limit=200"));
    } catch (e) {
      say("Couldn't load", e && e.status === 404 ? "The log isn't switched on yet. Run porch_68_post_log.sql." : "Check your signal and try again.");
    }
  }
  /* coming back to the page later in the day shows the new lines without a pull-down */
  document.addEventListener("visibilitychange", function () { if (!document.hidden) start(); });
  start();
})();
</script>
</body>
</html>
