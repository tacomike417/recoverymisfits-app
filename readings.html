<!-- ===========================================================================
     READINGS MOVED TO THE FRONT DOOR. 22 Sep 2026.

     The readings page IS the home page now -- it is the first thing worth
     seeing when the app opens, and the Readings tab on the bottom bar was
     freed up for Meme of the Day. The whole page lives in /index.html.

     This file stays behind because things point at it that cannot be edited:
     bookmarks, whatever Google already has indexed, links out on Facebook,
     and any older build of the Play Store app. It sends all of them to "/".

     Three ways over, because no single one of them always works:
       - rel=canonical    tells a crawler which URL is the real one
       - meta refresh     works with JavaScript switched off
       - location.replace goes immediately AND leaves no entry in the back
                          stack, so the phone's back button does not bounce
                          somebody straight back into this page
     GitHub Pages cannot serve a real 301, which is the only reason this is
     a page at all.
     ======================================================================== -->
<link rel="canonical" href="https://recoverymisfits.org/">
<meta name="robots" content="noindex, follow">
