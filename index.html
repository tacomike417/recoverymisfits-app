<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Another Day Sober &mdash; Daily Recovery Reading | Recovery Misfits</title>
<meta name="theme-color" content="#0e0e0d">
<link rel="canonical" href="https://recoverymisfits.org/">
<meta name="description" content="Another Day Sober — a daily recovery reading for alcoholics, one for every day of the year. Free, no sign-up, one day at a time.">
<meta property="og:type" content="website">
<meta property="og:title" content="Another Day Sober — Daily Recovery Reading">
<meta property="og:description" content="Another Day Sober — a daily recovery reading for alcoholics, one for every day of the year. Free, no sign-up, one day at a time.">
<meta property="og:url" content="https://recoverymisfits.org/">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Recovery Misfits">
<link rel="apple-touch-icon" href="./icon-192.png">

<!-- THE READING'S LOOK AND ITS BEHAVIOR, SHARED WITH Another Day Sober.
     Both screens show the same reading and always did. Keeping two copies is
     how the Home screen ended up still wearing the old white card after the
     reading page had been rebuilt. One file each now. -->
<!-- PAINT SOMETHING IMMEDIATELY. An external stylesheet blocks the first
     paint, and an installed app that has not painted is an app still showing
     its splash screen -- on a weak signal that can be several seconds of
     staring at a logo wondering if it is broken. These four declarations are
     inline so the page is dark and readable the instant it arrives; the
     stylesheet then does everything else. -->
<style>html{background:#0e0e0d}body{background:#0e0e0d;color:#eee6d5;margin:0}</style>
<link rel="stylesheet" href="./assets/daily-reading.css">
</head>

<body>

<div id="rm-topbar"></div>
<script src="./topbar.js" defer></script>

<div class="sheet">
<img class="tape tl" src="assets/pages/d-tape-tl.webp" alt="" aria-hidden="true">
<img class="tape tr" src="assets/pages/d-tape-tr.webp" alt="" aria-hidden="true">
<img class="tape bl" src="assets/pages/d-tape-bl.webp" alt="" aria-hidden="true">
<img class="tape br" src="assets/pages/d-tape-br.webp" alt="" aria-hidden="true">

<main>

  <header class="pub">
    <img class="art" src="assets/pages/d-book.webp" alt="" aria-hidden="true" width="122" height="111">
    <div>
      <h1 class="name">Another Day Sober</h1>
      <p class="tag">one day at a time</p>
      <img class="rule" src="assets/pages/d-rule.webp" alt="" aria-hidden="true" width="297" height="17">
    </div>
  </header>

  <div class="controls">
    <button class="ctl" id="smaller" type="button" aria-label="Make the text smaller">A&minus;</button>
    <button class="ctl" id="bigger"  type="button" aria-label="Make the text bigger">A+</button>
    <button class="ctl" id="speak"   type="button" aria-pressed="false" aria-label="Read this aloud">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4zm12.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4zM14 2.2v2.1a7.8 7.8 0 0 1 0 15.4v2.1a9.9 9.9 0 0 0 0-19.6z"/></svg>
    </button>
  </div>

  <p class="dateline" id="dateline" hidden>
    <img src="assets/pages/d-swash.webp" alt="" aria-hidden="true">
    <span id="dateText"></span>
  </p>

  <h2 class="title" id="title">&nbsp;</h2>
  <!-- #title and #reading are filled in at build time by scripts/build_pages.py
       with whatever reading the build day landed on, so this page has real
       words in it for a crawler instead of "Opening today's reading...".
       data-for says which day was baked; the guard below throws it away if
       the reader's own date has moved on. -->
  <img class="titlerule" src="assets/pages/d-titlerule.webp" alt="" aria-hidden="true" width="471" height="20">

  <article class="reading" id="reading" data-for="">
    <p class="state">Opening today&rsquo;s reading&hellip;</p>
  </article>

  <!-- NOBODY IS EVER SHOWN THE WRONG DAY'S READING.

       The build bakes one day in and the site rebuilds each morning, so
       between midnight and the build the baked copy is yesterday's. This
       runs before daily-reading.js and clears it the instant the dates
       disagree -- a placeholder for half a second beats reading the wrong
       page on the wrong morning. Crawlers render the page, so they still
       see the correct reading either way. -->
  <script>
  (function () {
    var t = document.getElementById("title"),
        r = document.getElementById("reading");
    if (!t || !r) return;
    var baked = r.getAttribute("data-for");
    if (!baked) return;
    var d = new Date(),
        today = ("0" + (d.getMonth() + 1)).slice(-2) + "-" + ("0" + d.getDate()).slice(-2);
    if (baked === today) return;
    t.innerHTML = "&nbsp;";
    r.innerHTML = '<p class="state">Opening today\u2019s reading\u2026</p>';
    var dl = document.getElementById("dateline");
    if (dl) dl.hidden = true;
  })();
  </script>

  <div class="foot">
    <img class="rule" src="assets/pages/d-sharerule.webp" alt="" aria-hidden="true" width="676" height="8">
    <button class="share" id="share" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16V3m0 0L8 7m4-4 4 4M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Share this reading
    </button>
    <p class="say" id="say" role="status" aria-live="polite"></p>
  </div>

  <!-- ===================================================================
       THE CALENDAR IS WRITTEN IN HERE AT BUILD TIME.

       Same generated block as another-day-sober.html: twelve months of real
       <a href>, one per reading. It is on the front page because this is the
       page everything else points at, and a crawler that lands here should
       be one link from all 365 rather than none. Do not edit between the
       markers by hand -- the next deploy overwrites it.

       The plain archive link is what stands here if the build does not run,
       so the way through is never missing.
       ================================================================ -->
  <!-- CALENDAR:START -->
    <nav class="cal" aria-label="Every reading, by date">
      <a class="back" href="/another-day-sober/" style="margin-top:0">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10" stroke-linecap="round"/></svg>
        Every Reading
      </a>
    </nav>
  <!-- CALENDAR:END -->

</main>
</div>

<div class="tailroom"></div>

<div id="rm-bottom-nav"></div>
<script src="./nav.js" defer></script>

<script src="./assets/daily-reading.js" defer></script>
<script>
if ("serviceWorker" in navigator) { navigator.serviceWorker.register("./sw.js"); }
</script>

</body>
</html>
