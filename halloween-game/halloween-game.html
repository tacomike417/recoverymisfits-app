<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Recovery Misfits Halloween Game</title>

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
    }

    #game {
      width: 100%;
      height: 100%;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #game img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
  </style>
</head>

<body>

  <div id="game"></div>

  <script src="chapter0-intro.js"></script>

  <script src="level1-dialogue.js"></script>
  <script src="chapter1-gameplay.js"></script>

  <script src="chapter1-story.js"></script>

  <script>
    window.addEventListener("DOMContentLoaded", function () {
      if (
        window.HalloweenGame &&
        window.HalloweenGame.chapter0Intro
      ) {
        window.HalloweenGame.chapter0Intro.start();
      } else {
        console.error("chapter0-intro.js did not load.");
      }
    });
  </script>

</body>
</html>
