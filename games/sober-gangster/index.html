<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#120f0d">
<meta name="robots" content="noindex">
<title>Sober Gangster · Recovery Misfits</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat+Brush&family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#14110f;--cream:#f3e6c4;--gold:#e8b23a;--gold2:#f7cf5c;--red:#a8141a;--red2:#d0262b;--A:'assets/ui/'}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html{background:#0d0b0a}
body{color:var(--ink);font-family:'Barlow',system-ui,sans-serif;font-size:15px;line-height:1.3;min-height:100vh;
  background:#0d0b0a url(assets/ui/wall.webp) center top/cover fixed}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible{outline:3px solid var(--gold2);outline-offset:2px}
.mk{font-family:'Caveat Brush',cursive;font-weight:400;letter-spacing:.3px;line-height:1;-webkit-text-stroke:.7px currentColor;paint-order:stroke fill}
.lb{font-family:'Barlow Condensed',sans-serif;font-weight:700;letter-spacing:.2px;line-height:1.05}
.cn{font-family:'Barlow Condensed',sans-serif;font-weight:800;letter-spacing:.5px}
#app{max-width:430px;margin:auto;min-height:100vh;padding:0 12px calc(86px + env(safe-area-inset-bottom));position:relative}
#app.nonav{padding-bottom:24px}

/* top bar */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:calc(8px + env(safe-area-inset-top)) 2px 8px;margin:0 -12px 8px;padding-left:12px;padding-right:12px;
  background:linear-gradient(#0d0b0aee,#0d0b0acc 75%,#0d0b0a00)}
.xbtn{width:42px;height:42px;flex:none;display:grid;place-items:center;border-style:solid;border-width:8px;border-image:url(assets/ui/card-square.webp) 52 52 70 / 8px 8px 9px stretch;background:#f1e2bd;background-clip:padding-box;font-size:20px;font-weight:900;color:var(--ink)}
.top .ttl{flex:1;color:#fff6dc;font-size:34px;text-shadow:2px 3px 0 #000;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:2px 14px 6px 10px;margin-right:auto;flex:0 1 auto;background:url(assets/ui/banner-red.webp) center/100% 100% no-repeat}
.top .grow{flex:1}
.top .ttl b{color:var(--gold2);font-weight:400}
.pips{display:flex;gap:4px}.pips i{width:13px;height:13px;border-radius:50%;border:2px solid var(--gold);background:#000}.pips i.on{background:var(--gold2)}
.snd{width:36px;height:36px;flex:none;display:grid;place-items:center;color:var(--gold2);filter:drop-shadow(1px 2px 0 #000)}
.snd svg{width:26px;height:26px}
.vpill{background:#fff;color:#000;border-radius:20px;padding:3px 9px;font:800 12px 'Barlow Condensed';flex:none}
.cash-pill{background:var(--gold2);color:#000;border:2px solid #000;border-radius:20px;padding:2px 9px;font:800 15px 'Barlow Condensed'}

/* paper panels */
.paper{position:relative;border-style:solid;border-width:13px 13px 16px;border-image:url(assets/ui/card-square.webp) 52 52 70 / 13px 13px 16px / 0 0 6px stretch;background:#f1e2bd url(assets/ui/tex-cream.webp) center/230px;background-clip:padding-box;filter:drop-shadow(2px 4px 0 #000a)}
.paper.red{border-width:14px 20px 20px;border-image:url(assets/ui/btn-red.webp) 58 90 92 fill / 14px 20px 20px / 0 0 8px stretch;background:none;color:#fff6dc}
.drip.off::after{content:"";position:absolute;left:12%;right:12%;bottom:-11px;height:12px;pointer-events:none;
  background:radial-gradient(circle at 8% 0,var(--gold) 3px,transparent 4px),radial-gradient(circle at 37% 0,#111 3px,transparent 4px),radial-gradient(circle at 71% 0,var(--gold) 2.5px,transparent 3.5px),radial-gradient(circle at 93% 0,#111 2px,transparent 3px);
  background-size:100% 100%}

/* buttons */
.big{display:block;width:100%;padding:4px 6px;text-align:center;font-size:34px;color:#fff6dc;text-shadow:2px 3px 0 #000;margin:12px 0 6px}
.big.cream{color:var(--ink);text-shadow:none;font-size:26px;padding:2px}
.big .crown{width:34px;vertical-align:-4px;margin-left:8px}
.ghost{display:block;width:100%;text-align:center;color:#f3e6c4;font:700 15px 'Barlow';padding:12px;text-decoration:underline}

/* room */
.room{position:relative;aspect-ratio:1.32/1;overflow:hidden;border-radius:3px;background:#000 center/cover;border:2px solid #000}
.room .fig{position:absolute;left:50%;bottom:2%;height:88%;transform:translateX(-50%);filter:drop-shadow(0 10px 8px #000a)}
.room .pet{position:absolute;left:66%;bottom:4%;height:34%;filter:drop-shadow(0 6px 5px #000a)}
.lvltag{position:absolute;left:6px;top:6px;padding:0 6px;font-size:22px;color:var(--ink);border-style:solid;border-width:8px 10px 10px;border-image:url(assets/ui/panel-wide.webp) 40 60 60 / 8px 10px 10px stretch;background:#f1e2bd url(assets/ui/tex-cream.webp) center/200px;background-clip:padding-box}
.lvltag b{font-weight:400;font-size:26px}
.room .where{position:absolute;right:8px;bottom:8px;color:#fff;font:800 13px 'Barlow Condensed';letter-spacing:1px;background:#000b;padding:3px 7px;border-radius:3px}
.roomwrap{padding:0;border-width:9px 9px 12px}
.nextline{display:flex;align-items:center;gap:6px;padding:5px 4px 2px;font:700 13px 'Barlow Condensed';color:var(--ink);width:100%;text-align:left}
.nextline b{font:400 17px 'Caveat Brush';white-space:nowrap}
.stuff{display:flex;gap:6px;overflow-x:auto;padding:8px 2px 2px;scrollbar-width:none}
.stuff img{height:42px;flex:none;filter:drop-shadow(0 2px 2px #000)}

/* stats */
.stats{display:grid;grid-template-columns:1fr 1fr 1.12fr;gap:4px;margin:8px 0 0}
.stat{min-width:0}
.stat{padding:0 2px 2px}
.stat .lab{display:flex;align-items:center;gap:3px;font:800 15px 'Barlow Condensed';white-space:nowrap;letter-spacing:.3px}
.stat .lab img{width:24px}
.stat strong{display:block;font-size:34px;line-height:.95;margin:1px 0 0 2px}
.bar{height:10px;border:2px solid var(--ink);background:#fff6dc;border-radius:2px;margin-top:5px;overflow:hidden}
.bar span{display:block;height:100%;background:var(--red2)}
.bar.gold span{background:var(--gold)}
.heat{margin-top:6px;padding:0 4px 2px}
.heat .row{display:flex;align-items:center;gap:6px}
.heat .row img{width:34px;margin:-6px 0}
.heat .row .mk{font-size:32px}
.heat .tag{margin-left:auto;background:#111;color:var(--gold2);padding:2px 12px 4px;font-size:22px;border-radius:2px;transform:rotate(-2deg);clip-path:polygon(2% 8%,100% 0,97% 92%,0 100%)}
.heat .bar{height:16px}
.heat .odds{display:none}
.heat.hot .tag{background:var(--red2);color:#fff}
.heat.burning{animation:burn 1.2s ease-in-out infinite alternate}
@keyframes burn{to{box-shadow:0 0 0 2px var(--red2),0 0 18px 4px #ff3b1f99}}
.next{margin-top:12px;padding:8px 10px;font:600 14px 'Barlow'}
.next .mk{font-size:17px}

/* section banner */
.banner{display:flex;align-items:center;justify-content:space-between;margin:10px 0 4px}
.banner .mk{color:#fff6dc;font-size:34px;padding:2px 22px 6px 14px;background:url(assets/ui/banner-red.webp) center/100% 100%;text-shadow:2px 2px 0 #000;transform:rotate(-2deg)}
.banner .left{background:var(--red);color:#fff;font-size:18px;padding:3px 12px;border-radius:14px;border:2px solid #000}

/* moves */
.moves{display:grid;grid-template-columns:1fr 1fr;gap:2px 4px}
.mv{min-width:0;overflow:hidden;display:flex;align-items:center;gap:5px;padding:0 1px;text-align:left;min-height:56px}
.mv img{width:34px;flex:none}
.mv .lb{font-size:16.5px;display:block;color:var(--ink);line-height:1}
.mv small{display:block;font:600 14px 'Barlow Condensed';color:#3a2e22}
.mv .box{width:21px;height:21px;flex:none;border:3px solid var(--ink);border-radius:2px;background:#fff8e6;position:relative}
.mv .box.on::after{content:'✓';position:absolute;left:1px;top:-9px;font:400 30px 'Caveat Brush';color:var(--red2)}
.call{display:flex;align-items:center;gap:10px;width:100%;padding:0 6px;margin-top:4px;text-align:left}
.call .lb{font-size:19px}.call small{display:block;font:600 14px 'Barlow Condensed'}
.call .free{margin-left:auto;background:#111;color:var(--gold2);padding:4px 9px;border-radius:3px;font-size:15px}

/* life card */
.event{margin-top:14px;padding:12px}
.event .kicker{display:inline-block;background:#111;color:var(--gold2);font:800 12px 'Barlow Condensed';letter-spacing:1px;padding:3px 8px;border-radius:3px}
.event h2{font-size:24px;margin:8px 0 4px}
.event p{font-weight:600}
.choice{display:block;width:100%;text-align:left;margin-top:9px;padding:10px 12px;background:#fff8e6;border:2px solid var(--ink);border-radius:5px;box-shadow:2px 3px 0 #000}
.choice .mk{font-size:17px;display:block}
.choice small{display:block;font:600 13px 'Barlow';color:#4a3b2c;margin-top:2px}
.note{font:600 12px 'Barlow';color:#5a4836;margin-top:8px}
.onwall{color:#e9dcc0;text-shadow:1px 1px 0 #000}

/* nav */
nav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:center;background:#0b0908 url(assets/ui/wall.webp) center 85%/cover;box-shadow:inset 0 0 0 999px #000a;border-top:3px solid var(--gold);padding-bottom:env(safe-area-inset-bottom)}
nav[hidden]{display:none!important}
nav .in{display:grid;grid-template-columns:repeat(4,1fr);width:100%;max-width:430px}
nav button{display:flex;flex-direction:column;align-items:center;gap:0;padding:6px 0 5px;color:#e9dcc0;font-family:'Caveat Brush';font-size:19px;-webkit-text-stroke:.5px currentColor;border-right:2px solid #0008}
nav img{width:36px;height:36px;object-fit:contain;opacity:.75}
nav .on{color:var(--gold2);background:radial-gradient(ellipse at 50% 60%,#e8b23a33,transparent 70%)}
nav .on img{opacity:1}

/* title */
.title{text-align:center;padding-top:6px}
.title .logo{width:100%;border-radius:8px;border:3px solid #000;box-shadow:0 0 0 2px var(--gold),0 8px 20px #000}
.title .tag{display:inline-block;margin:14px 0 12px;padding:8px 14px;font-size:17px}
.crew{position:relative;height:250px;margin:4px 0 4px;border-radius:7px;overflow:hidden;background:url(assets/room/1.webp) center/cover}
.crew::before{content:"";position:absolute;inset:0;background:linear-gradient(#0006,#0000 40%,#000a)}
.crew img{position:absolute;bottom:4px;height:72%;filter:drop-shadow(0 6px 5px #000)}
.crew .say{position:absolute;left:10px;top:8px;color:#fff;font-size:20px;text-align:left;transform:rotate(-4deg);text-shadow:2px 2px 0 #000;line-height:1}
.crew .say2{left:auto;right:10px;top:10px;color:var(--gold2);transform:rotate(3deg)}

/* pick */
.pickgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pk{padding:6px 6px 8px;text-align:center}
.pk .ph{height:170px;border-radius:4px;background:#1a1512 url(assets/ui/wall.webp) center 30%/cover;display:flex;align-items:flex-end;justify-content:center;overflow:hidden}
.pk .ph img{height:94%;filter:drop-shadow(0 5px 4px #000)}
.pk .mk{display:block;font-size:19px;margin-top:6px}
.pk small{display:block;font:600 12px 'Barlow';color:#4a3b2c;min-height:30px}
.pk.sel{box-shadow:0 0 0 4px var(--gold2),0 0 22px 6px #f7cf5c88,3px 5px 0 2px #000}
.pk.sel::before{content:"";position:absolute;top:-16px;left:-10px;width:40px;height:36px;background:url(assets/ui/crown.webp) center/contain no-repeat;transform:rotate(-18deg);z-index:2}
.stick{position:sticky;bottom:10px;z-index:5}

/* shop */
.tabs{display:flex;gap:8px;margin-bottom:12px}
.tabs button{flex:1;padding:0 2px;font-family:'Barlow Condensed';font-weight:800;font-size:18px;letter-spacing:.5px}
.tabs .on{border-image:url(assets/ui/btn-red.webp) 58 90 92 fill / 14px 20px 20px stretch;background:none;color:#fff6dc;text-shadow:1px 1px 0 #000}
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.it{padding:0;text-align:center;border-width:9px 9px 13px;border-image:url(assets/ui/card-square.webp) 52 52 70 / 9px 9px 13px stretch}
.it .ph{height:104px;display:flex;align-items:center;justify-content:center;background:#140f0d url(assets/ui/wall.webp) center 40%/240px;margin:-2px -2px 0;border-radius:2px}
.it .ph img{max-height:88px;max-width:88%;filter:drop-shadow(0 4px 3px #000c)}
.it .lb{display:flex;align-items:center;justify-content:center;font-size:16px;margin-top:3px;min-height:20px}
.it .pr{font:800 19px 'Barlow Condensed';display:block;line-height:1.1}
.it.own .ph img,.it.lock .ph img{opacity:.35}
.stamp{position:absolute;top:30px;left:50%;transform:translateX(-50%) rotate(-12deg);border:3px solid var(--red2);color:var(--red2);font:400 19px 'Caveat Brush';padding:0 6px;background:#fff8;border-radius:3px}
.it.lock .stamp{color:#111;border-color:#111;display:flex;align-items:center;gap:3px}
.it.lock .stamp img{width:18px}
.shopnote{margin-top:14px;text-align:center}

/* progress */
.badge{padding:8px 10px;margin-top:8px;font-weight:700}
.log{color:#e9dcc0;border-bottom:1px solid #fff2;padding:7px 2px;font-size:14px}
.ladder{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.ladder .rung{text-align:center;padding:4px 2px 6px;font-size:12px}
.ladder .rung img{height:84px;display:block;margin:0 auto 2px}
.ladder .rung.no img{filter:grayscale(1) brightness(.5)}
.ladder .rung .mk{font-size:13px}
.ladder .rung.cur{box-shadow:0 0 0 3px var(--gold2),3px 5px 0 2px #000}
.set{display:block;width:100%;text-align:left;padding:11px 12px;margin-top:10px}
.set .mk{font-size:18px}.set small{display:block;font:600 13px 'Barlow';color:#4a3b2c}
footer{color:#b9ab90;font-size:12px;margin-top:18px;text-align:center}

/* overlays */
#modal:empty{display:none}
.ov{position:fixed;inset:0;z-index:50;background:#000c;display:flex;align-items:center;justify-content:center;padding:18px;overflow:auto}
.ov>.paper{width:100%;max-width:390px;padding:16px 14px 12px;max-height:calc(100vh - 36px);overflow:auto}
.ov .x{position:absolute;right:6px;top:6px;width:38px;height:38px;font-size:24px;font-weight:800}
.ov h2{font-size:28px;margin:2px 36px 8px 0}
.ov p{font-weight:600;margin-bottom:8px}
.ov .big{font-size:24px;padding:11px}
.lvup{text-align:center;overflow:visible!important}
.lvup h1{font-size:52px;color:var(--gold2);-webkit-text-stroke:2px #000;text-shadow:3px 4px 0 #000;transform:rotate(-4deg);margin:-34px 0 6px}
.lvup .row{display:flex;align-items:flex-end;justify-content:center;gap:4px;margin:4px 0 8px}
.lvup .row img{height:190px;filter:drop-shadow(0 6px 5px #0008)}
.lvup .row img.was{height:120px;opacity:.55}
.lvup .arrow{font-size:40px;color:var(--gold);padding-bottom:40px}
.lvup .lname{font-size:24px}
.lvup .burst{position:absolute;inset:-30px -10px auto;height:200px;background:radial-gradient(circle,#f7cf5c66,transparent 65%);pointer-events:none}
.lvup ul{list-style:none;font:700 14px 'Barlow';margin:4px 0}
.locked h1{font-size:50px;color:#fff;-webkit-text-stroke:2px #000;text-shadow:3px 4px 0 #000;text-align:center;margin:-6px 0 8px}
.locked h1 b{color:var(--red2);font-weight:400}
.cell{position:relative;aspect-ratio:3/2;border-radius:5px;overflow:hidden;background:url(assets/room/jail.webp) center/cover;margin-bottom:10px}
.cell img{position:absolute;left:50%;bottom:4%;height:74%;transform:translateX(-50%);filter:brightness(.8) saturate(.7) drop-shadow(0 6px 5px #000)}
.cell::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 30px,#1b1d22 30px 38px,#5b616b 38px 40px,transparent 40px 70px)}
.locked{box-shadow:0 0 0 2px var(--gold),0 0 30px 8px #2a5cff66,0 0 60px 10px #ff1e1e44!important}
.night{position:fixed;inset:0;z-index:60;background:#05060c;color:#fff;display:flex;align-items:center;justify-content:center;text-align:center}
.night h1{font-size:56px;color:var(--gold2);text-shadow:3px 3px 0 #000}
.night p{font:600 16px 'Barlow';margin-top:8px}
.night .made{font-size:30px;margin-top:10px}
.night small{display:block;margin-top:16px;opacity:.6}
.dots{font-size:22px;letter-spacing:6px;margin-top:12px;animation:dots 1s infinite alternate}
@keyframes dots{to{opacity:.2}}
.notices{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top) + min(100vw,430px) / 853 * 112);width:min(400px,calc(100% - 24px));z-index:40;display:flex;flex-direction:column;gap:6px}
.notice{background:#111;color:#f3e6c4;border:2px solid var(--gold);border-radius:6px;padding:9px 12px;font:600 14px 'Barlow';box-shadow:0 4px 12px #000;transition:opacity .3s,transform .3s}
.notice.warn{border-color:var(--red2)}.notice.good{border-color:#58b26a}
.notice.out{opacity:0;transform:translateY(8px)}
@media (prefers-reduced-motion:reduce){.heat.burning,.dots{animation:none}}

/* ===== the ChatGPT skin ===== */
:root{--W:min(100vw,430px);--u:calc(var(--W) / 853)}
#app.pg-life,#app.pg-title,#app.pg-pick,#app.pg-shop{padding-left:0;padding-right:0;max-width:430px}
#app.pg-life{padding-bottom:calc(var(--u) * 154 + env(safe-area-inset-bottom))}
#app.pg-shop{padding-bottom:calc(var(--u) * 187 + env(safe-area-inset-bottom) + 10px)}
#app.pg-progress,#app.pg-settings{padding-bottom:calc(var(--u) * 154 + env(safe-area-inset-bottom) + 14px)}
.stage{position:relative;width:var(--W);margin:0 auto;overflow:hidden}
.stage .skin{position:absolute;left:0;top:0;width:100%;height:auto;display:block;pointer-events:none;z-index:1}
.stage>*:not(.skin):not(.room2){z-index:2}
.hot{position:absolute;display:block;background:transparent;border:0;padding:0;cursor:pointer;z-index:3;-webkit-tap-highlight-color:rgba(255,215,90,.25)}
.hot:active{background:rgba(255,215,90,.12)}
.hot:focus-visible{outline:3px solid var(--gold2)}
.tr{position:absolute;display:flex;align-items:center;justify-content:flex-end;gap:calc(var(--u)*12)}
.tr .vpill{font-size:calc(var(--u)*26);padding:calc(var(--u)*4) calc(var(--u)*16)}
.tr .snd{width:calc(var(--u)*64);height:calc(var(--u)*64)}.tr .snd svg{width:calc(var(--u)*44);height:calc(var(--u)*44)}
.tr .pips{gap:calc(var(--u)*8)}.tr .pips i{width:calc(var(--u)*22);height:calc(var(--u)*22)}
.tr .cash-pill{font-size:calc(var(--u)*32);padding:calc(var(--u)*2) calc(var(--u)*16)}
.keep{position:absolute;text-align:center;color:var(--gold2);font-size:calc(var(--u)*30);text-shadow:2px 2px 0 #000;pointer-events:none}
.newrun{position:absolute;color:#f3e6c4;font-size:calc(var(--u)*40);text-shadow:2px 3px 0 #000;text-decoration:underline;text-underline-offset:4px}
/* today */
.room2{position:absolute;background:#000 center/cover;overflow:hidden;z-index:0}
.room2 .fig{position:absolute;left:50%;bottom:3%;height:84%;transform:translateX(-50%);filter:drop-shadow(0 10px 8px #000a)}
.room2 .pet{position:absolute;left:67%;bottom:4%;height:32%;filter:drop-shadow(0 6px 5px #000a)}
.stuff2{position:absolute;right:2%;top:24%;display:flex;flex-direction:column;gap:calc(var(--u)*6);align-items:flex-end}
.stuff2 img{height:calc(var(--u)*46);filter:drop-shadow(0 2px 2px #000)}
.dnum,.dtot{position:absolute;font-size:calc(var(--u)*72);line-height:1;text-shadow:3px 4px 0 #000;-webkit-text-stroke:calc(var(--u)*2) #000;paint-order:stroke fill}
.dnum{color:var(--gold2);text-align:right}.dtot{color:#fff6dc}
.lvl{position:absolute;text-align:left;color:var(--ink);font-size:calc(var(--u)*40);white-space:nowrap;overflow:hidden;padding-left:calc(var(--u)*8);-webkit-text-stroke:calc(var(--u)*1.2) currentColor}
.lvl b{font-weight:400;font-size:calc(var(--u)*50)}
.nexttxt{position:absolute;text-align:left;color:#fff;font:700 calc(var(--u)*24)/1.15 'Barlow Condensed';text-shadow:1px 2px 0 #000,0 0 6px #000}
.nexttxt b{color:var(--gold2);font-weight:400;font-size:calc(var(--u)*30)}
.cardflag{position:absolute;background:var(--red2);color:#fff;font-size:calc(var(--u)*34);border:3px solid #000;border-radius:4px;box-shadow:0 0 0 2px var(--gold2),0 0 16px #ff3b1f;transform:rotate(3deg);animation:pulse 1s ease-in-out infinite alternate}
@keyframes pulse{to{transform:rotate(3deg) scale(1.07)}}
.callst{position:absolute;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;padding:0 calc(var(--u)*16);background:#f1e2bd url(assets/ui/tex-cream.webp) center/200px;border:calc(var(--u)*5) solid #111;border-radius:calc(var(--u)*6);box-shadow:0 0 0 calc(var(--u)*3) var(--gold),2px 4px 0 #000;color:var(--ink);text-align:left}
.callst .mk{font-size:calc(var(--u)*32);line-height:1}.callst small{font:700 calc(var(--u)*20) 'Barlow Condensed';color:#4a3b2c}
.callst.done{opacity:.6}
.where2{position:absolute;display:flex;align-items:center;justify-content:center;color:#fff;font:800 calc(var(--u)*22) 'Barlow Condensed';letter-spacing:1px;background:#000c;border-radius:3px}
.val{position:absolute;color:var(--ink);font-size:calc(var(--u)*62);line-height:1;padding-left:calc(var(--u)*14);-webkit-text-stroke:calc(var(--u)*1.6) currentColor}
.val.c{text-align:center;padding:0}
.bar2{position:absolute;overflow:hidden;border-radius:2px}
.bar2 i{display:block;height:100%;background:linear-gradient(#e0262b,#9d1018)}
.bar2.gold i{background:linear-gradient(#f7cf5c,#c98d12)}
.bar2.heat2 b{position:absolute;top:-2px;bottom:-2px;width:2px;background:#111}
.htag{position:absolute;display:flex;align-items:center;justify-content:center;background:#111;color:var(--gold2);font-size:calc(var(--u)*36);clip-path:polygon(2% 10%,100% 0,97% 92%,0 100%);transform:rotate(-2deg)}
.htag.hot{background:var(--red2);color:#fff}
.left2{position:absolute;display:flex;align-items:center;justify-content:center;color:#fff;font-size:calc(var(--u)*38);text-shadow:2px 2px 0 #000}
.sub2{position:absolute;color:#4a3b2c;font:600 calc(var(--u)*27)/1.2 'Barlow Condensed';white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
.tick{position:absolute;color:var(--red2);font-size:calc(var(--u)*80);line-height:1;pointer-events:none;text-shadow:1px 1px 0 #000}
.mvhot.off{background:rgba(20,15,10,.32)}
/* tiles (pick + shop) */
.tiles{display:grid;width:var(--W);margin:0 auto;padding:0 calc(var(--u)*18)}
.tiles.two{grid-template-columns:1fr 1fr;gap:calc(var(--u)*10)}
.tiles.three{grid-template-columns:1fr 1fr 1fr;gap:calc(var(--u)*8)}
.tile{position:relative;background:center/100% 100% no-repeat;border:0;padding:0;cursor:pointer}
.tfig{position:absolute;left:50%;bottom:22%;height:70%;transform:translateX(-50%);filter:drop-shadow(0 6px 4px #000)}
.tname{position:absolute;left:8%;right:8%;bottom:6.5%;height:12%;display:flex;align-items:center;justify-content:center;color:var(--ink);font-size:calc(var(--u)*36);-webkit-text-stroke:calc(var(--u)*1) currentColor}
.pk2.sel{filter:drop-shadow(0 0 calc(var(--u)*10) #f7cf5c) drop-shadow(0 0 calc(var(--u)*4) #f7cf5c)}
.pk2.sel::before{content:"";position:absolute;top:-6%;left:-4%;width:24%;height:18%;background:url(assets/ui/crown.webp) center/contain no-repeat;transform:rotate(-18deg);z-index:2}
.pickline{color:#e9dcc0;font:600 14px 'Barlow';text-align:center;margin:6px 16px 10px;text-shadow:1px 1px 0 #000}
.pickwho{color:var(--gold2);font:700 15px 'Barlow Condensed';text-align:center;margin:12px 16px 4px;text-shadow:1px 1px 0 #000;min-height:20px}
.imgbtn{display:block;width:calc(var(--u)*795);margin:0 auto;padding:0;border:0;background:none}
.imgbtn img{width:100%;display:block;filter:drop-shadow(0 4px 6px #000)}
.titem{position:absolute;left:50%;top:9%;height:52%;max-width:80%;object-fit:contain;transform:translateX(-50%);filter:drop-shadow(0 5px 4px #000c)}
.tlab{position:absolute;left:10%;right:10%;bottom:7%;height:20%;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05;color:var(--ink)}
.tlab .lb{font-size:calc(var(--u)*30)}.tlab .pr{font:800 calc(var(--u)*34) 'Barlow Condensed'}
.it2.own .titem,.it2.lock .titem{opacity:.4}
.stamp2{position:absolute;top:28%;left:50%;transform:translateX(-50%) rotate(-12deg);border:calc(var(--u)*5) solid var(--red2);color:var(--red2);font-size:calc(var(--u)*36);padding:0 calc(var(--u)*8);background:#fff8;border-radius:3px}
.tab2{position:absolute;border:0;background:none;padding:0;z-index:3}
.tab2.on{border-style:solid;border-width:calc(var(--u)*12) calc(var(--u)*18) calc(var(--u)*16);border-image:url(assets/ui/btn-red.webp) 58 90 92 fill / calc(var(--u)*12) calc(var(--u)*18) calc(var(--u)*16) stretch;color:#fff6dc;font-size:calc(var(--u)*36);text-shadow:1px 2px 0 #000;display:flex;align-items:center;justify-content:center}
.noteimg{display:block;width:var(--W);margin:calc(var(--u)*10) auto 0}
/* nav */
nav{background:none!important;border:0!important;box-shadow:none!important}
nav .navin{position:relative;width:var(--W);margin:0 auto}
nav .navin img{width:100%;height:100%;display:block}
nav .navin .hot{position:absolute;top:0}
nav .navon{background:radial-gradient(ellipse at 50% 60%,rgba(247,207,92,.45),transparent 70%);box-shadow:inset 0 calc(var(--u)*-6) 0 var(--gold2)}
/* pop-ups */
.skinov{padding:12px}
.pop{position:relative;width:min(94vw,400px);--p:calc(min(94vw,400px) / 817)}
.pop .skin{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.pfig{position:absolute;object-fit:contain;object-position:bottom;filter:drop-shadow(0 6px 5px #0008)}
.pfig.was{opacity:.6}
.pfig.jail{filter:brightness(.8) saturate(.7) hue-rotate(-10deg) drop-shadow(0 6px 5px #000)}
.pbars{position:absolute;pointer-events:none}
.pbars i{position:absolute;top:0;bottom:0;width:calc(var(--p)*20);background:linear-gradient(90deg,#2a2c31,#8a909a 45%,#3a3d44)}
.ptext{position:absolute;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:var(--ink);font:600 calc(var(--p)*26)/1.2 'Barlow Condensed'}
.ptext b{font-weight:400;font-size:calc(var(--p)*44);line-height:1}
.pop .hot{z-index:3}
.ov>.paper.card{padding-top:10px}
.lolt{display:inline-block;color:#fff6dc;font-size:22px;padding:2px 16px 6px 10px;background:url(assets/ui/banner-red.webp) center/100% 100% no-repeat;text-shadow:1px 2px 0 #000;transform:rotate(-2deg);margin:0 0 6px}
.ov .say{font:600 16px/1.35 'Barlow';color:#2a2118}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 8px}
.chip2{background:#111;color:var(--gold2);font:800 13px 'Barlow Condensed';letter-spacing:.5px;padding:4px 9px;border-radius:3px}
.chip2.bad{background:var(--red2);color:#fff}.chip2.good{background:#2f6b3a;color:#fff}
.fxline{font:800 16px 'Barlow Condensed';color:var(--red);letter-spacing:.3px}
.gl{font:600 14px 'Barlow';margin:2px 0}
.cardflag small{display:block;font:700 calc(var(--u)*20) 'Barlow Condensed';letter-spacing:.5px}
.cardflag{line-height:1;font-size:calc(var(--u)*28)!important;white-space:normal;padding:calc(var(--u)*4) calc(var(--u)*8)}
.howh{font-size:24px;margin:12px 0 2px;color:var(--ink)}
.howh.big2{color:var(--red2);font-size:26px}

/* ---------- v4: heat meter (flames instead of numbers) ---------- */
.hm{position:relative;height:14px;border:2px solid #111;border-radius:3px;background:#2a211b;overflow:visible;margin:22px 4px 4px}
.hm .fill{position:absolute;left:0;top:0;bottom:0;border-radius:1px;background:linear-gradient(90deg,#f7cf5c,#f08a24 45%,#d0262b 75%,#8a0d12);transition:width .6s}
.hm .was{position:absolute;left:0;top:0;bottom:0;background:repeating-linear-gradient(135deg,#fff3 0 4px,#0000 4px 8px);border-right:2px dashed #fff8}
.hm .hl{position:absolute;top:-5px;bottom:-5px;width:3px;background:#fff6dc;box-shadow:0 0 0 1px #000;z-index:2}
.hm .flames{position:absolute;right:-12px;bottom:2px;display:flex;align-items:flex-end;gap:0;pointer-events:none}
.hm .flames svg{display:block;transform-origin:50% 100%;animation:flick .5s ease-in-out infinite alternate;filter:drop-shadow(0 0 4px #ff5a1f)}
.hm .flames svg:nth-child(2){animation-delay:.15s}.hm .flames svg:nth-child(3){animation-delay:.3s}.hm .flames svg:nth-child(4){animation-delay:.08s}
.hm.hot{box-shadow:0 0 12px 3px #ff3b1f88;animation:burn .9s ease-in-out infinite alternate}
@keyframes flick{from{transform:scaleY(.86) skewX(-4deg)}to{transform:scaleY(1.08) skewX(4deg)}}
.hmw{display:flex;justify-content:space-between;font:800 13px 'Barlow Condensed';letter-spacing:.4px;color:#5a4636;margin:0 4px 6px}
.hmw b{color:var(--red2)}
.hm.big{height:18px}
/* the heat bar on the Today skin */
.heatslot{position:absolute;z-index:3}
.heatslot .hm{margin:0;height:100%;border-width:1px}
.heatslot .hm .flames{transform:scale(.55);transform-origin:100% 100%;right:-6px}
.hword{position:absolute;display:flex;align-items:center;color:var(--ink);font:800 calc(var(--u)*34) 'Barlow Condensed';letter-spacing:.5px;white-space:nowrap}
.hword.hot{color:var(--red2)}

/* ---------- v4: the envelope on the trouble notice ---------- */
.cardflag.env{display:flex;align-items:center;gap:calc(var(--u)*10);text-align:left;transform:rotate(2deg)}
.cardflag.env svg{flex:none;width:calc(var(--u)*78);height:calc(var(--u)*56);filter:drop-shadow(1px 2px 0 #000)}
.cardflag.env span{display:block;min-width:0}
.cardflag.env span b{display:block;font-weight:400;font-size:calc(var(--u)*30);line-height:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.envtop{display:flex;align-items:center;gap:10px;margin:-2px 0 6px}
.envtop svg{width:58px;height:42px;flex:none;filter:drop-shadow(1px 2px 0 #0008)}
.envtop .lolt{margin:0}

/* ---------- v4: the move board ---------- */
.board{width:var(--W);margin:0 auto;padding:4px 10px 6px;background:#16120f url(assets/ui/wall.webp) center top/100% auto}
.mrow{margin:0 0 8px}
.mhead{display:flex;align-items:baseline;gap:8px;margin:2px 2px 4px}
.mhead b{font-size:21px;color:#fff6dc;text-shadow:2px 2px 0 #000;padding:0 10px 2px 6px;transform:rotate(-1.5deg)}
.mhead span{font:700 12px/1.15 'Barlow Condensed';color:#e9dcc0;text-shadow:1px 1px 0 #000}
.mrow.spiritual .mhead b{background:#2f6b3a;box-shadow:2px 2px 0 #000}
.mrow.work .mhead b{background:#b07a12;box-shadow:2px 2px 0 #000}
.mrow.life .mhead b{background:var(--red2);box-shadow:2px 2px 0 #000}
.mgrid{display:grid;gap:7px}
.mgrid.c2{grid-template-columns:1fr 1fr}.mgrid.c3{grid-template-columns:1fr 1fr 1fr}
.mgrid.c2>.mb:last-child:nth-child(odd){grid-column:span 2}
.mb{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:78px;padding:6px 4px 7px;text-align:center;color:var(--ink);
  background:#f1e2bd url(assets/ui/tex-cream.webp) center/220px;border:3px solid #111;border-radius:6px;box-shadow:0 5px 0 #111,0 7px 8px #0007;transition:transform .08s,box-shadow .08s;cursor:pointer}
.mb:active{transform:translateY(4px);box-shadow:0 1px 0 #111,0 2px 3px #0007}
.mb .mi{width:38px;height:38px;object-fit:contain;display:block}
.mb svg.mi{color:#14110f}
.mb .ml{font:800 15px/1.02 'Barlow Condensed';letter-spacing:.2px;text-transform:uppercase}
.mb .mf{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:3px;font:800 12px 'Barlow Condensed';color:#4a3b2c;min-height:16px}
.mf .hp{display:inline-flex;align-items:center;gap:0;padding:0 4px;border-radius:9px;color:#fff;line-height:15px}
.mf .hp.up{background:var(--red2)}.mf .hp.dn{background:#2f6b3a}.mf .hp.zero{background:#555}
.mf .hp svg{width:9px;height:12px}
.mf .ok{color:#fff;background:#111;border-radius:9px;padding:0 5px;line-height:15px}
.mb.life{background:#7d1015 url(assets/ui/tex-red.webp) center/220px;color:#fff6dc}
.mb.life .mf{color:#ffd9b0}.mb.life svg.mi{color:#fff6dc}
.mb.done::after{content:'✓';position:absolute;right:5px;top:-4px;font:400 34px 'Caveat Brush';color:var(--red2);text-shadow:1px 1px 0 #000}
.mb.life.done::after{color:var(--gold2)}
.mb.off{filter:grayscale(.85);opacity:.55;box-shadow:0 2px 0 #111}
.mb.off .mf{color:#3a2a1a}
.mb .why{font:800 12px 'Barlow Condensed';background:#111;color:var(--gold2);border-radius:9px;padding:0 6px;line-height:15px}
.mb.ends{outline:3px solid var(--gold2);outline-offset:-6px}
.boardnote{font:700 12.5px/1.25 'Barlow Condensed';color:#e9dcc0;text-shadow:1px 1px 0 #000;margin:0 2px 8px}
.boardnote b{color:var(--gold2)}
/* wiggle: the thing to tap next, for the first couple of days */
.wig{animation:wig 1.3s ease-in-out infinite}
@keyframes wig{0%,55%,100%{transform:rotate(0)}62%{transform:rotate(-3deg) scale(1.04)}70%{transform:rotate(3deg) scale(1.04)}78%{transform:rotate(-2deg)}86%{transform:rotate(1.5deg)}}
.cardflag.wig{animation:wig 1.3s ease-in-out infinite}
.hot.wig,.endbtn.wig{animation:wig 1.3s ease-in-out infinite}
.tapme{position:absolute;z-index:5;pointer-events:none;font:400 18px 'Caveat Brush';color:var(--gold2);text-shadow:2px 2px 0 #000;white-space:nowrap}
.endstage{position:relative;width:var(--W);margin:0 auto}
.endstage img{display:block;width:100%}
.endstage button{position:absolute;inset:6% 4% 14% 4%}

/* ---------- v4: popups ---------- */
.trust{display:flex;flex-wrap:wrap;gap:5px;margin:6px 0}
.trust span{font:800 13px 'Barlow Condensed';padding:3px 8px;border-radius:3px;border:2px solid #111;background:#fff8e6}
.trust span.up{background:#d9efd5}.trust span.dn{background:#f6d0cc}
.trust span.t-ghost.up{background:#f6d0cc}.trust span.t-ghost.dn{background:#d9efd5}
.mline{font:400 22px 'Caveat Brush';color:var(--red);margin:-4px 0 4px}
.zero{font:700 14px 'Barlow Condensed';color:#2f6b3a}
/* people on the story page */
.ppl{display:grid;gap:8px}
.pp{display:flex;gap:10px;align-items:center;padding:8px}
.pp .pi{width:44px;height:44px;flex:none;border-radius:50%;background:#111;color:var(--gold2);display:grid;place-items:center;font-size:24px;border:2px solid var(--gold)}
.pp .pt{flex:1;min-width:0}
.pp .pt b{font-size:20px}
.pp .pt small{display:block;font:600 12.5px/1.2 'Barlow';color:#4a3b2c}
.tb{display:flex;gap:2px;margin-top:4px}.tb i{flex:1;height:8px;border:1px solid #111;background:#fff8e6;border-radius:1px}
.tb i.on{background:#2f6b3a}.pp.t-ghost .tb i.on{background:var(--red2)}
.gotlist .badge{margin:6px 0}
.win h1{font-size:46px;color:var(--red2);text-align:center;margin:4px 0}
</style>

<body>
<div id="app"></div>
<nav id="nav" hidden></nav>
<div id="modal"></div>
<script src="cards.js?v=4.0"></script><script src="situations.js?v=4.0"></script><script src="engine.js?v=4.0"></script><!-- bump ?v= with every VERSION change -->
<script>
const A = 'assets/';
let s, page = 'title', pickSel = null, storageOK = true, shopTab = 'feel';
try { s = migrate(JSON.parse(localStorage.getItem(SAVE_KEY))) || fresh(); } catch { s = fresh(); }

function esc(v){ return String(v).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function save(){ try { localStorage.setItem(SAVE_KEY, JSON.stringify(s)); } catch { storageOK = false; } }
function pct(x){ return Math.round(x * 100); }
const ic = n => A + 'ui/' + n + '.webp';
const figImg = (id, lvl) => A + 'fig/' + id + '-' + lvl + '.webp';
const myFig = (lvl = s.level) => figImg(s.look.fig, lvl);
const fig = () => FIGURES.find(f => f.id === s.look.fig) || FIGURES[0];

/* ---------- moving around: every screen has a way out, and the phone's back button works ---------- */
function go(p, push = true){
  page = p; if (push) history.pushState({ p }, '');
  render(); window.scrollTo(0, 0);
}
function leaveGame(){
  // back where they came from if that was this site, otherwise the Recovery Misfits home page
  let to = '/';
  try { const r = new URL(document.referrer); if (r.origin === location.origin && r.pathname !== location.pathname) to = r.pathname + r.search; } catch {}
  location.href = to;
}
function topX(){ return page === 'title' ? leaveGame() : go('title'); }
let skipPop = false;
addEventListener('popstate', e => {
  if (skipPop) { skipPop = false; return; }
  if (document.querySelector('#modal .ov')) { closeModal(true); return; }
  const p = e.state && e.state.p;
  if (!p) { leaveGame(); return; }
  page = p; render(); window.scrollTo(0, 0);
});

function topbar(title){
  const pill = `<span class="vpill">${VERSION}</span>`;
  return `<header class="top"><button class="xbtn" onclick="topX()" aria-label="${page === 'title' ? 'Leave the game' : 'Back to the start screen'}">✕</button>${title ? `<span class="ttl mk">${title}</span>` : ''}<span class="grow"></span><button class="snd" onclick="toggleSound()" aria-label="${s.settings.mute ? 'Turn sound on' : 'Turn sound off'}"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 4V5L7 9H3z"/>${s.settings.mute ? '<path d="M16 9l5 6M21 9l-5 6" stroke="currentColor" stroke-width="2.4" fill="none" stroke-linecap="round"/>' : '<path d="M15.5 8.5a5 5 0 010 7M18 6a8.5 8.5 0 010 12" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round"/>'}</svg></button>${page === 'shop' ? `<span class="cash-pill">$${s.cash}</span>` : ''}${page === 'life' && !s.result ? `<span class="pips">${[0,1,2].map(i => `<i class="${i < s.actions ? 'on' : ''}"></i>`).join('')}</span>` : ''}${pill}</header>`;
}

function play(){ go(s.look.done ? 'life' : 'pick'); if (s.look.done && !s.settings.introSeen) intro(); }

function choose_fig(){
  const f = FIGURES.find(x => x.id === (pickSel || s.look.fig)); if (!f) return;
  const changing = s.look.done;
  s.look = { fig: f.id, sex: f.sex, done: true }; pickSel = null;
  if (!s.scen && s.day === 1 && !s.show.length) startDay(s, true);
  save(); go('life'); if (!changing && !s.settings.introSeen) intro();
}

/* ---------- moves done today (just for the check boxes) ---------- */
function doneToday(id){ return s.ui && s.ui.day === s.day && s.ui.done.includes(id); }
function markDone(id){ if (!s.ui || s.ui.day !== s.day) s.ui = { day: s.day, done: [] }; if (!s.ui.done.includes(id)) s.ui.done.push(id); }

/* ---------- sound: music + 5 effects. Phones only allow sound after the first tap. ---------- */
const SFX = {}; let music = null, soundReady = false;
function sfx(n){ if (s.settings.mute) return; try { const a = (SFX[n] ||= new Audio(A + 'sfx/' + n + '.mp3')); a.currentTime = 0; a.volume = n === 'locked' ? .6 : .8; a.play().catch(() => {}); } catch {} }
function startMusic(){
  if (s.settings.mute) return;
  if (!music) { music = new Audio(A + 'sfx/music.mp3'); music.loop = true; music.volume = .32; }
  music.play().catch(() => {});
}
function toggleSound(){ s.settings.mute = !s.settings.mute; save(); if (s.settings.mute) { if (music) music.pause(); } else startMusic(); render(); }
addEventListener('pointerdown', () => { if (!soundReady) { soundReady = true; startMusic(); } }, { capture: true });
document.addEventListener('visibilitychange', () => { if (!music) return; if (document.hidden) music.pause(); else if (!s.settings.mute && soundReady) music.play().catch(() => {}); });

/* ---------- shop ---------- */
function purchase(id){
  const p = item(id), why = cantBuy(s, id);
  const btn = why ? `<button class="paper big cream mk" disabled>${why === 'owned' ? 'YOU GOT IT' : /^level /.test(why) ? 'UNLOCKS AT ' + why.toUpperCase() : esc(why.toUpperCase())}</button>` : `<button class="paper red big mk" onclick="if(buy(s,'${id}'))sfx('buy');closeModal();render()">BUY IT · $${p.price}</button>`;
  show(`<div style="text-align:center"><img src="${A}item/${id}.webp" alt="" style="max-height:120px;max-width:70%;filter:drop-shadow(0 4px 3px #0006)"></div><h2 class="mk">${esc(p.name)}</h2><p>$${p.price} · 1 move<br>${esc(p.desc)}${p.feel ? '<br>Feels good: −' + p.feel + ' stress.' : ''}</p>${btn}<button class="ghost" style="color:var(--ink)" onclick="closeModal()">Keep saving</button>`);
}

function settings(){
  return `${topbar('<b>SETTINGS</b>')}
  <button class="paper set" onclick="go('pick')"><span class="mk">Change my homie</span><small>Same run, different figure. Now: ${esc(fig().name)}.</small></button>
  <button class="paper set" onclick="toggleSound()"><span class="mk">Sound: ${s.settings.mute ? 'OFF' : 'ON'}</span><small>The music and the sound effects. Same as the speaker up top.</small></button>
  <button class="paper set" onclick="intro()"><span class="mk">How to play</span><small>The short version.</small></button>
  <button class="paper set" onclick="rules()"><span class="mk">How it works</span><small>Heat, people, money, chapters.</small></button>

function trustLine(t){
  const e = Object.entries(t || {}).filter(([k, v]) => v && person(k));
  return e.length ? `<div class="trust">${e.map(([k, v]) => `<span class="t-${k} ${v > 0 ? 'up' : 'dn'}">${esc(person(k).name)} ${v > 0 ? '▲' : '▼'}</span>`).join('')}</div>` : '';
}
function morning(){
  if (page !== 'life' || s.lockedUp || s.levelUp || document.querySelector('#modal .ov')) return;
  if (s.cards && s.cards.length) return cardPop(s.cards[0]);
  const next = s.show && s.show[0]; if (!next) return;
  if (next === 'night') { const n = nightCard(s.night); if (!n) { s.show.shift(); return morning(); }
    return show(`<div class="lolt mk">LIFE ON LIFE’S TERMS</div><p class="note" style="margin:0">Last night</p><h2 class="mk">${esc(n.title)}</h2><p class="say">${esc(n.text)}</p>${heatMeter(s.heat, s.heat - n.heat)}${n.stress ? `<div class="chips"><span class="chip2 ${n.stress > 0 ? 'bad' : 'good'}">${n.stress > 0 ? '+' : '−'}${Math.abs(n.stress)} STRESS</span></div>` : ''}<button class="paper red big mk" onclick="s.show.shift();save();closeModal();render()">GOT IT</button>`, 'card'); }
  if (next === 'scen') return scenPopup(true);
}
function scenPopup(fromMorning){
  if (!s.scen) return;
  if (!s.ui || s.ui.day !== s.day) s.ui = { day: s.day, done: [] }; s.ui.read = true;
  const c = scenFor(s, s.scen.id), fresh = s.scen.fresh && fromMorning, who = person(c.who);
  show(`<div class="envtop">${ENVELOPE}<div class="lolt mk red">YOU GOT A MESSAGE</div></div>${who ? `<p class="note" style="margin:0">${esc(who.name)}</p>` : ''}<h2 class="mk">${esc(c.title)}</h2><p class="say">${esc(forSex(s, c.setup))}</p>
  ${heatMeter(s.heat, fresh ? s.heat - c.now : null)}
  <p class="note"><b>Every night you leave it, the heat climbs.</b> ${s.scen.left} day${s.scen.left === 1 ? '' : 's'} to deal with it. Moves marked <b>✔ ENDS IT</b> handle it. Every choice costs something.</p>
  <button class="paper red big mk" onclick="${fromMorning ? 's.show=[];' : ''}save();closeModal();render()">GOT IT</button>`, 'card');
}

function confirmAction(id){
  const p = preview(s, id), why = whyNot(s, id), row = ROW_OF[id], sc = p.scen;
  const after = Math.max(0, Math.min(100, s.heat + p.e.h));
  const chips = [p.e.c ? `<span class="chip2 ${p.e.c > 0 ? 'good' : 'bad'}">${p.e.c > 0 ? '+$' : '−$'}${Math.abs(p.e.c)}</span>` : '', p.e.s ? `<span class="chip2 ${p.e.s > 0 ? 'bad' : 'good'}">${p.e.s > 0 ? '+' : '−'}${Math.abs(p.e.s)} STRESS</span>` : '', p.e.n ? `<span class="chip2 ${p.e.n > 0 ? 'good' : 'bad'}">${p.e.n > 0 ? '+' : '−'}${Math.abs(p.e.n)} CONNECTION</span>` : ''].join('');
  const rowWord = { spiritual: 'SPIRITUAL MOVE', work: 'WORK MOVE', life: 'LIFE MOVE' }[row];
  show(`<div style="text-align:center;color:var(--ink)">${moveIcon(id).replace('class="mi"', 'class="mi" style="width:70px;height:70px"')}</div><div class="lolt mk ${row === 'life' ? 'red' : ''}">${rowWord}</div><h2 class="mk">${esc(MOVES[id].label)}</h2><p class="mline">“${esc(MOVES[id].line)}”</p>
  ${sc ? `<p class="note" style="margin:0 0 4px">vs. <b>${esc(sc.title)}</b> · ${p.end ? '<b>this ends it</b>' : 'it’s still on you after this'}</p>` : ''}
  ${heatMeter(after, s.heat)}
  ${p.zeroed ? '<p class="zero">You did a spiritual move first, so this adds no heat.</p>' : row === 'work' && p.e.h > 0 ? '<p class="note">Do a spiritual move first and this adds no heat.</p>' : ''}
  ${row === 'life' ? '<p class="note"><b>Feels good now.</b> It leaves a receipt, and it comes back in a few days.</p>' : ''}
  ${chips ? `<div class="chips">${chips}</div>` : ''}${trustLine(p.t)}${p.note ? `<p class="note">${esc(p.note)}</p>` : ''}
  <button class="paper red big mk" ${why ? 'disabled' : ''} onclick="doMove('${id}')">${why ? esc(why.toUpperCase()) : 'DO IT'}</button><button class="ghost" style="color:var(--ink)" onclick="closeModal()">Keep thinking</button>`);
}
function doMove(id){
  closeModal();
  const was = s.heat, r = action(s, id); if (!r) return render();
  markDone(id); sfx('move'); save(); render();
  setTimeout(() => show(`<span class="kicker">${esc(r.title)}</span><h2 class="mk">${r.end ? (ROW_OF[id] === 'life' ? 'THAT’S ONE WAY TO END IT.' : 'HANDLED.') : esc(MOVES[id].label.toUpperCase()) + '.'}</h2><p class="say">${esc(r.say)}</p>${heatMeter(s.heat, was)}${trustLine(r.trust)}${r.still ? '<p class="note">It’s still on you.</p>' : ''}<button class="paper red big mk" onclick="closeModal();render()">GOT IT</button>`), 120);
}
function night(){
  const odds = lockOdds(s);
  if (s.actions) show(`<h2 class="mk">CALL IT A DAY?</h2><p>${s.actions} move${s.actions === 1 ? '' : 's'} left. They don’t carry over. Food, rent when it’s due, and the night still happen. Life on life’s terms adds heat every night.</p>${heatMeter(s.heat)}<button class="paper red big mk" onclick="closeModal();sleep()">FINISH TODAY</button><button class="ghost" style="color:var(--ink)" onclick="closeModal()">Use my time</button>`);
  else sleep();
}
function sleep(){
  sfx('night');
  const day = s.day, odds = pct(lockOdds(s));
  const m = document.getElementById('modal');
  m.innerHTML = `<div class="night"><div><h1 class="mk">NIGHT ${day}</h1><p>${odds ? odds + '% chance the lights show up.' : 'Nobody’s looking for you.'}</p><div class="dots">● ● ●</div></div></div>`;
  window.scrollTo(0, 0);
  setTimeout(() => {
    endDay(s); save();
    if (s.lockedUp || s.result) { m.innerHTML = ''; render(); return; }
    const box = m.querySelector('.night > div');
    if (box) { box.innerHTML = `<h1 class="mk">NIGHT ${day}</h1><div class="made mk">${odds ? 'You made it.' : 'Slept fine.'}</div><p>Morning. Life on life’s terms.</p><small>Tap anywhere</small>`; m.querySelector('.night').onclick = () => { m.innerHTML = ''; render(); }; }
    setTimeout(() => { if (m.querySelector('.night')) { m.innerHTML = ''; render(); } }, 1400);
  }, odds ? 1600 : 900);
}
function restart(){ show(`<h2 class="mk">NEW RUN?</h2><p>Back to day 1, chapter 1, $${CFG.startCash}. This run gets wiped.</p><button class="paper red big mk" onclick="newRun(true)">PICK A NEW HOMIE</button><button class="paper big cream mk" onclick="newRun(false)">SAME HOMIE</button><button class="ghost" style="color:var(--ink)" onclick="closeModal()">Keep this run</button>`); }
function rules(){
  const H = CFG.heat;
  show('<h2 class="mk">HOW IT WORKS.</h2>'
  + '<p><b>Heat</b> is the meter with the flames. Life on life’s terms adds heat every night, more if you skipped the spiritual stuff, and every night a situation sits there. Past the white line the cops might come, up to ' + pct(H.maxOdds) + '% a night. Fill it all the way and they come for sure. Locked up = back to chapter 1.</p>'
  + '<p><b>Spiritual moves</b> always help. Do one first and work adds no heat that day. <b>Life moves</b> feel good, cost a lot of heat, and leave a receipt that comes back.</p>'
  + '<p><b>People remember.</b> Pops, Big Ray, Darlene, Mom and Shorty like you more or less with every move. Ghost too, and that’s the problem.</p>'
  + '<p><b>Money:</b> food is $' + CFG.food + ' a night. Rent every ' + CFG.rentDays + ' days: $' + CFG.rent.slice(1).join(', $') + ' as you move up. Owe two weeks and you lose the bed.</p>'
  + '<p><b>Chapters:</b> 1 get hired, 3 meetings, survive rent day. 2 a week employed, the raise, 2 rents on time, $400. 3 Pops as sponsor, a car, connection 60, $750 (moving out costs $' + CFG.moveIn + '). 4 ' + WIN.rents + ' rents on time, ' + WIN.cool + ' days under the line, day ' + WIN.standing + ' standing: SOBERED UP.</p>'
  + '<button class="paper red big mk" onclick="closeModal()">LET’S GO</button>');
}
function warnings(){
  const a = [];
  if (s.heat >= 70) a.push(['warn', 'The heat is real. Spiritual moves bring it down.']);
  else if (s.heat > CFG.heat.safe) a.push(['warn', 'You’re past the line. Hit a meeting or make a call.']);
  if (s.stress >= CFG.heat.maxedStress) a.push(['warn', 'Stress ' + s.stress + '. Rest.']);
  if (s.connection < CFG.heat.aloneBelow) a.push(['warn', 'Connection ' + s.connection + '. Nobody’s in your corner.']);
  if (s.day % CFG.rentDays === 0) a.push(['', 'Rent’s due tonight: $' + rentDue(s) + '.']);
  else if (s.day % CFG.rentDays === CFG.rentDays - 1) a.push(['', 'Rent’s tomorrow night: $' + rentDue(s) + '.']);
  if (s.arrears) a.push(['warn', 'You owe $' + s.arrears + '. Owe two weeks and you lose the bed.']);
  if (!s.job && s.day > 1) a.push(['warn', 'No job. Look for a better job to find one.']);
  return a;
}
function progress(){
  return `${topbar('YOUR <b>STORY</b>')}${s.lockedUp ? '<button class="paper red big mk" onclick="startOver()">START OVER</button>' : ''}<div class="paper" style="padding:10px"><div class="ladder">${LEVELS.map(L => `<div class="rung ${L.n > s.level ? 'no' : ''} ${L.n === s.level ? 'cur paper' : ''}"><img src="${myFig(L.n)}" alt=""><span class="mk">CH ${L.n}</span><br>${esc(L.name)}</div>`).join('')}</div>
  <p class="note">${s.result ? 'SOBERED UP on day ' + s.result.day + '.' : (s.level < 4 ? 'Next chapter needs: ' : 'SOBERED UP needs: ') + esc(nextNeeds(s).join(', ') || 'one more good night') + '.'} Get locked up and it’s back to chapter 1.</p></div>
  <div class="banner"><span class="mk">YOUR PEOPLE</span></div><div class="ppl">${PEOPLE.filter(p => p.id !== 'darlene' || s.job || s.flags.includes('darlene_introduced')).map(p => `<div class="paper pp t-${p.id}"><div class="pi mk">${p.name[0]}</div><div class="pt"><b class="mk">${esc(p.name)}</b>${p.id === 'pops' && s.sponsor ? ' · <b>YOUR SPONSOR</b>' : ''}<small>${esc(p.role)}</small><div class="tb">${Array.from({ length: 10 }, (_, i) => `<i class="${i < s.trust[p.id] ? 'on' : ''}"></i>`).join('')}</div><small><i>“${esc(p.say)}”</i></small></div></div>`).join('')}</div>
  <div class="banner"><span class="mk">LITTLE BIG WINS</span></div>${s.milestones.length ? s.milestones.map(x => `<div class="paper badge">★ ${esc(x)}</div>`).join('') : '<p class="onwall">The first one’s waiting. Getting hired counts.</p>'}
  <div class="banner"><span class="mk">WHAT HAPPENED</span></div>${s.log.map(x => `<div class="log">${esc(x)}</div>`).join('')}`;
}

/* ---------- render ---------- */
function render(){
  save();
  const app = document.getElementById('app'), nav = document.getElementById('nav');
  if (!s.look.done && page !== 'title' && page !== 'pick') page = 'pick';
  const inGame = ['life', 'shop', 'progress', 'settings'].includes(page);
  app.className = (inGame ? 'ingame ' : 'nonav ') + 'pg-' + page;
  app.innerHTML = page === 'title' ? title() : page === 'pick' ? pick() : page === 'shop' ? shopUI() : page === 'progress' ? progress() : page === 'settings' ? settings() : life();
  nav.hidden = !inGame;
  if (inGame) nav.innerHTML = navBar();
  if (inGame && s.lockedUp && page !== 'progress' && !document.querySelector('#modal .pop')) lockupUI();
  else if (inGame && s.levelUp && !document.querySelector('#modal .ov')) levelUpUI();
  else if (page === 'life' && ((s.cards && s.cards.length) || (s.show && s.show.length))) setTimeout(morning, 350);
  setTimeout(flushNotices, 60);
}

/* ---------- overlays ---------- */
function show(html, cls = ''){
  document.getElementById('modal').innerHTML = `<div class="ov" onclick="if(event.target===this)closeModal()"><div class="paper ${cls}"><button class="x xbtn" onclick="closeModal()" aria-label="Close">✕</button>${html}</div></div>`;
  history.pushState({ p: page, m: 1 }, '');
}
function closeModal(fromBack){
  const m = document.getElementById('modal'); if (!m.innerHTML) return;
  m.innerHTML = '';
  if (!fromBack && history.state && history.state.m) { skipPop = true; history.back(); }
}
function chime(){ if (!s.settings.sound) return; try { const a = new (window.AudioContext||window.webkitAudioContext)(), o = a.createOscillator(), g = a.createGain(); o.connect(g); g.connect(a.destination); g.gain.value = .025; o.frequency.value = 440; o.start(); o.stop(a.currentTime + .1); o.onended = () => a.close(); } catch {} }
function startOver(){ startMusic(); s = restartKeepFigure(s); document.getElementById('modal').innerHTML = ''; save(); go('life'); }
function intro(){
  // Mike's words (15 Oct 2026). Girl homies get "her" instead of "him".
  const g = s.look.done && fig().sex === 'girl';
  const w = txt => !g ? txt : txt.replace(/\bYOUR GUY\b/g, 'YOUR GIRL').replace(/\bHIM\b/g, 'HER').replace(/\bHe's\b/g, "She's").replace(/\bHis\b/g, 'Her').replace(/\bhis\b/g, 'her').replace(/\bhim\b/g, 'her').replace(/\bhe\b/g, 'she').replace(/\bHe\b/g, 'She').replace(/\bguy\b/g, 'girl');
  const H = (h, p) => `<h3 class="mk howh">${w(h)}</h3><p>${w(p)}</p>`;
  show('<div class="lolt mk">HOW TO PLAY</div>'
  + H('MEET YOUR GUY.', 'He\'s broke. His life\'s a mess. He\'s trying to get sober and start over.<br>And lucky for him, he\'s got you.')
  + H('CHECK ON THE LITTLE BASTARD.', 'Show up every day. See how he\'s doing. Life\'s gonna throw some shit at him, and you\'re the one helping him deal with it.')
  + H('YOU GET 3 MOVES A DAY.', 'Get him to work. Call somebody. Handle some business. Make a bad decision. It\'s your call.<br><b>But every move has consequences.</b>')
  + H('THEN LIFE HAPPENS.', 'See how he makes out over the next 24 hours. Maybe he gets ahead. Maybe he gets knocked on his ass.<br>Tomorrow? New day. New problems.')
  + H('KEEP HIM OUT OF TROUBLE.', 'Watch his money, stress, connections, and HEAT. Too much heat and the cops might come knocking.')
  + H('BUILD HIM A LIFE.', 'Get him working. Get him connected. Get him his own place. Give the little bastard something worth staying sober for.<br>And somewhere along the way, you might actually start giving a shit about him.')
  + '<h3 class="mk howh big2">LOCKED UP. COVERED UP. OR SOBERED UP.</h3><p>' + w('Choose wisely. He\'s counting on you.') + '</p>'
  + '<button class="paper red big mk" onclick="s.settings.introSeen=true;save();closeModal();render()">GOT IT</button>', 'card');
}
function newRun(pickNew){ const was = s.look.fig; s = restartKeepFigure(s); if (pickNew) { s.look.done = false; pickSel = was; } closeModal(); save(); go(pickNew ? 'pick' : 'life'); }
const noticed = new Set();
function notify(text, kind = '', ms = 4500){
  let box = document.getElementById('notices');
  if (!box) { box = document.createElement('div'); box.id = 'notices'; box.className = 'notices'; document.body.appendChild(box); }
  const n = document.createElement('div'); n.className = 'notice ' + kind; n.textContent = text;
  const gone = () => { if (!n.classList.contains('out')) { n.classList.add('out'); setTimeout(() => n.remove(), 300); } };
  n.onclick = gone; box.appendChild(n); setTimeout(gone, ms);
}
function flushNotices(){
  if (page !== 'life' || s.lockedUp || s.result || (s.cards && s.cards.length) || (s.show && s.show.length) || document.querySelector('#modal .ov')) return;
  let i = 0;
  for (const [kind, text] of warnings()) { const k = s.day + ':' + text; if (!noticed.has(k)) { noticed.add(k); setTimeout(() => notify(text, kind), 700 * i++); } }
}

history.replaceState({ p: 'title' }, '');
render();
</script>
</body>
</html>
