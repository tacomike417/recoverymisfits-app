<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Sober House</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Poppins:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#120d09;--panel:#1f1711;--line:#3a2b1f;--cream:#f4e6c4;--gold:#e7b63c;--red:#d8352b;--green:#2f9a4a;--pink:#ff3fa4;--dim:#a8977a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--cream);font-family:Poppins,system-ui,sans-serif;overscroll-behavior:none}
body{background:radial-gradient(ellipse at top,#2a1d12 0%,var(--bg) 70%);min-height:100dvh}
.app{max-width:480px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.bang{font-family:Bangers,Poppins,sans-serif;letter-spacing:.04em;font-weight:400}
button{font-family:Poppins,sans-serif;font-weight:800;border:0;border-radius:14px;cursor:pointer}
.btn{background:var(--gold);color:#1b120a;padding:15px 18px;font-size:17px;width:100%;box-shadow:0 4px 0 #8c6516}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 #8c6516}
.btn.ghost{background:transparent;color:var(--cream);border:2px solid var(--line);box-shadow:none}
.btn.red{background:var(--red);color:#fff;box-shadow:0 4px 0 #7a1712}
.topbar{display:flex;align-items:center;gap:8px;padding:10px 14px}
.back{width:34px;height:34px;border-radius:50%;background:transparent;color:var(--cream);font-size:22px;display:grid;place-items:center;text-decoration:none}
.pill{background:#fff;color:#000;font-weight:800;font-size:11px;padding:4px 9px;border-radius:999px;margin-left:auto}
.clock{flex:1;text-align:center;line-height:1.05}
.clock .n{font-size:30px}
.clock .d{font-size:12px;color:var(--dim);font-weight:700;letter-spacing:.08em}
.clock.low .n{color:var(--red);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.45}}
.house{margin:6px 12px;background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:10px 12px;display:flex;align-items:center;gap:12px}
.house.me{border-color:var(--gold)}
.house .who{flex:1;min-width:0}
.house .nm{font-size:22px;line-height:1}
.house .money{font-size:28px;line-height:1}
.house .money.neg{color:var(--red)}
.beds{display:flex;gap:4px;margin-top:6px}
.bed{width:18px;height:18px;border-radius:5px;background:#3a2b1f}
.bed.on{background:var(--gold)}
.tags{font-size:11px;color:var(--pink);font-weight:700;margin-top:4px;min-height:14px}
.log{margin:6px 12px;padding:10px 12px;border-radius:12px;background:#0b0805;border:1px dashed var(--line);font-size:14px;min-height:46px;color:var(--cream)}
.handwrap{margin-top:auto;padding:6px 0 14px}
.handlabel{padding:0 14px 6px;font-size:12px;color:var(--dim);font-weight:700;letter-spacing:.06em}
.hand{display:flex;gap:10px;overflow-x:auto;padding:4px 14px 10px;scroll-snap-type:x mandatory}
.hand img{width:31vw;max-width:150px;border-radius:10px;scroll-snap-align:start;box-shadow:0 6px 14px #0009;transition:transform .15s}
.hand img.no{filter:grayscale(.7) brightness(.6)}
.hand img:active{transform:scale(.96)}
.sheet{position:fixed;inset:0;background:#000c;display:none;align-items:center;justify-content:center;z-index:20;padding:18px}
.sheet.on{display:flex}
.box{width:100%;max-width:420px;max-height:94dvh;overflow:auto;background:var(--panel);border:2px solid var(--gold);border-radius:20px;padding:16px;text-align:center}
.box h2{margin:2px 0 8px;font-size:34px;line-height:1}
.box p{margin:6px 0 14px;font-size:16px}
.box .big{width:72%;max-width:280px;border-radius:14px;box-shadow:0 10px 24px #000a}
.box .row{display:flex;gap:10px;margin-top:12px}
.x{float:right;background:transparent;color:var(--cream);font-size:24px;padding:0 4px}
.start{flex:1;display:flex;flex-direction:column;align-items:center;padding:10px 20px 24px;gap:12px;text-align:center}
.start img.logo{width:78%;max-width:320px;margin-top:6px}
.start .time{color:var(--dim);font-weight:700;font-size:13px}
.start input{width:100%;padding:14px;border-radius:12px;border:2px solid var(--line);background:#0b0805;color:var(--cream);font:700 17px Poppins;text-align:center}
.peek{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.peek img{width:30%;border-radius:8px}
.banner{position:fixed;left:50%;top:38%;width:92vw;max-width:440px;text-align:center;line-height:1;transform:translate(-50%,-50%) scale(.6);opacity:0;font-size:clamp(38px,12vw,56px);z-index:30;pointer-events:none;text-shadow:0 4px 0 #000,0 0 30px #000;transition:all .35s;}
.banner.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
.hidden{display:none!important}
</style>
</head>
<body>
<div class="app">

<div id="startScreen" class="start">
  <div class="topbar" style="width:100%;padding:0"><a class="back" href="/" aria-label="Back to Recovery Misfits">&#8592;</a><span class="pill">v2 TEST</span></div>
  <img class="logo" src="cards/logo.webp" alt="Sober House">
  <div class="bang" style="font-size:26px">Run the house. Most money when the clock runs out wins.</div>
  <div class="time">Takes about 15&ndash;20 minutes</div>
  <input id="n0" maxlength="14" placeholder="Your name" autocomplete="off">
  <button class="btn" id="goBot">Play Big Ray</button>
  <div class="time" style="margin-top:-6px">Big Ray runs the house across the street. He plays dirty.</div>
  <input id="n1" maxlength="14" placeholder="Friend's name" autocomplete="off" class="hidden">
  <button class="btn ghost" id="go">2 players, pass the phone</button>
  <button class="btn ghost" id="howBtn">How to play</button>
</div>

<div id="gameScreen" class="hidden" style="display:flex;flex-direction:column;flex:1">
  <div class="topbar">
    <button class="back" id="quitBtn" aria-label="Leave game">&#8592;</button>
    <div class="clock" id="clock"><div class="n bang" id="left">18</div><div class="d" id="day">YOUR TURNS LEFT</div></div>
    <span class="pill" style="margin-left:0">v2 TEST</span>
  </div>
  <div class="house" id="oppHouse"></div>
  <div class="log" id="log">Tap a card to play it.</div>
  <div class="house me" id="myHouse"></div>
  <div class="handwrap">
    <div class="handlabel" id="handLabel">YOUR HAND</div>
    <div class="hand" id="hand"></div>
  </div>
</div>

</div>

<div class="sheet" id="sheet"><div class="box" id="box"></div></div>
<div class="banner bang" id="banner"></div>

t.", "img": "sh-084", "self": "dblrent"}, {"id": 106, "kind": "gold", "title": "Peeked at Their Hand", "words": "Play this on the other player. You get to see every card they're holding.", "img": "sh-085", "hit": "peek"}];
const BOT='Big Ray';
const START=800, BILLS=300, RENT=100, MAXB=6, WEEKS=6, DAYS=['MONDAY','WEDNESDAY','FRIDAY'], HAND=5;
let S=null;
const $=id=>document.getElementById(id);
const img=c=>'cards/'+c.img+'.webp';
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const money=n=>(n<0?'-$':'$')+Math.abs(n).toLocaleString();

// ---------- sheets ----------
function sheet(html){ $('box').innerHTML=html; $('sheet').classList.add('on'); }
function close(){ $('sheet').classList.remove('on'); }
function ask(html,buttons){ return new Promise(res=>{
  sheet(html+'<div class="row">'+buttons.map((b,i)=>`<button class="btn ${b[1]||''}" data-i="${i}">${b[0]}</button>`).join('')+'</div>');
  $('box').querySelectorAll('[data-i]').forEach(el=>el.onclick=()=>{close();res(+el.dataset.i)});
});}
async function banner(t,ms=1100){ const b=$('banner'); b.textContent=t; b.classList.add('on'); await sleep(ms); b.classList.remove('on'); await sleep(250); }
function log(t){ $('log').innerHTML=t; }

// ---------- how to play (3 screens) ----------
async function howTo(){
  const steps=[
    ['Tap a card to play it','Good cards (green) help your house. Bad cards go to your friend\'s house on their own.'],
    ['Hit your friend','Red and pink cards hit THEIR house. Gold cards are sneaky moves. Some block a hit when you get one.'],
    ['Survive to payday','Monday the bills come out ($300). Friday every guy pays rent ($100). Most money when the clock runs out wins. Under $0 after a Friday and your house closes.']];
  for(let i=0;i<steps.length;i++) await ask(`<h2 class="bang">${steps[i][0]}</h2><p>${steps[i][1]}</p><p style="color:var(--dim);font-size:13px">${i+1} of 3</p>`,[[i<2?'Next':'Got it']]);
}

// ---------- setup ----------
$('howBtn').onclick=howTo;
$('goBot').onclick=()=>begin(true);
$('go').onclick=()=>{ if($('n1').classList.contains('hidden')){ $('n1').classList.remove('hidden'); $('n1').focus(); $('go').textContent='Start 2-player game'; return; } begin(false); };
async function begin(bot){
  const names=[$('n0').value.trim()||(bot?'You':'Player 1'),bot?BOT:($('n1').value.trim()||'Player 2')];
  let seen=false; try{seen=localStorage.getItem('sh_seen')==='1'}catch(e){}
  if(!seen){ await howTo(); try{localStorage.setItem('sh_seen','1')}catch(e){} }
  newGame(names,bot);
}
$('quitBtn').onclick=async()=>{
  const i=await ask('<h2 class="bang">Leave this game?</h2><p>This test game won\'t be saved.</p>',[['Keep playing'],['Leave','red']]);
  if(i===1){ $('gameScreen').classList.add('hidden'); $('startScreen').classList.remove('hidden'); }
};
function newGame(names,bot){
  S={deck:shuffle(DECK.map(c=>({...c}))),disc:[],week:1,day:0,turn:0,
     p:names.map(n=>({name:n,cash:START,beds:2,hand:[],skip:0,left:WEEKS*3,norent:false,dbl:false})),plays:0,bot:!!bot};
  if(bot) S.p[1].bot=true;
  S.p.forEach(p=>{for(let i=0;i<HAND;i++)p.hand.push(draw())});
  $('startScreen').classList.add('hidden'); $('gameScreen').classList.remove('hidden');
  startTurn(true);
}
function draw(){ if(!S.deck.length){S.deck=shuffle(S.disc);S.disc=[];} return S.deck.pop(); }
const me=()=>S.p[S.turn], them=()=>S.p[1-S.turn];
const viewer=()=>S.bot?S.p[0]:me(), other=()=>S.bot?S.p[1]:them();

// ---------- render ----------
function houseHTML(p,mine){
  const tags=[p.skip?'Sitting out next turn':'',p.norent?'No rent this Friday':'',p.dbl?'Double rent this Friday':''].filter(Boolean).join(' · ');
  return `<div class="who"><div class="nm bang">${mine?'Your house':p.name+"'s house"}</div>
    <div class="beds">${Array.from({length:MAXB},(_,i)=>`<div class="bed ${i<p.beds?'on':''}"></div>`).join('')}</div>
    <div class="tags">${tags}</div></div>
    <div style="text-align:right"><div class="money bang ${p.cash<0?'neg':''}">${money(p.cash)}</div><div style="font-size:11px;color:var(--dim)">${p.beds} guys</div></div>`;
}
function render(){
  const p=viewer();
  $('myHouse').innerHTML=houseHTML(p,true); $('oppHouse').innerHTML=houseHTML(other(),false);
  $('left').textContent=Math.max(0,p.left); $('day').textContent=`${S.bot?'YOUR':p.name.toUpperCase()+"'S"} TURNS LEFT · ${DAYS[S.day]}`;
  $('clock').classList.toggle('low',p.left<=3);
  $('handLabel').textContent=me().bot?`${BOT.toUpperCase()} IS THINKING...`:(S.plays>1?`PLAY ${S.plays} MORE CARDS`:'YOUR HAND · TAP A CARD');
  $('hand').innerHTML=p.hand.map((c,i)=>`<img src="${img(c)}" data-i="${i}" class="${playable(c,p)?'':'no'}" alt="${c.title}">`).join('');
  $('hand').querySelectorAll('img').forEach(el=>el.onclick=()=>tapCard(+el.dataset.i));
}

// ---------- rules ----------
function playable(c,p){
  if(c.react) return false;
  if(c.kind==='green' && (c.beds||c.fill) && !c.cash && p.beds>=MAXB) return false;
  return true;
}
async function tapCard(i){
  if(S.lock||S.plays<=0||me().bot) return;
  const p=me(), c=p.hand[i], ok=playable(c,p), any=p.hand.some(x=>playable(x,p));
  let why='';
  if(c.react) why='Hang on to this one. When a bad card hits you, you\'ll get the chance to throw it down.';
  else if(!ok) why='Your house is full. Hang on to him. Move him in when a bed opens up.';
  const btns=ok?[['Play it'],['Back','ghost']]:(!any?[['Toss it'],['Back','ghost']]:[['Back','ghost']]);
  const extra=!ok&&!any?'<p style="color:var(--gold)">Nothing to play? Toss one.</p>':'';
  const r=await ask(`<img class="big" src="${img(c)}" alt=""><p>${why}</p>${extra}`,btns);
  if(btns[r][0]==='Back') return;
  p.hand.splice(i,1); S.disc.push(c);
  if(btns[r][0]==='Toss it'){ log(`${p.name} tossed a card.`); return afterPlay(); }
  await resolve(c,p,them());
  afterPlay();
}
async function afterPlay(){
  S.plays--; render();
  if(S.plays>0 && me().hand.length) return;
  S.lock=true; await sleep(500); endTurn();
}
function addBeds(p,n){ p.beds=Math.max(1,Math.min(MAXB,p.beds+n)); }
async function resolve(c,p,o){
  if(c.kind==='green'){
    if(c.fill){ p.beds=MAXB; }
    if(c.beds) addBeds(p,c.beds);
    if(c.cash) p.cash+=c.cash;
    log(`<b>${p.name}</b>: ${c.title}. ${c.words}`); return;
  }
  if(c.self==='double'){ S.plays+=2; log(`<b>${p.name}</b> played Double Trouble. Play 2 more cards.`); return; }
  if(c.self==='dblrent'){ p.dbl=true; log(`<b>${p.name}</b>: everybody pays double rent this Friday.`); return; }
  if(c.hit){
    if(c.hit==='skip'){ o.skip++; log(`<b>${p.name}</b> called a house meeting at ${o.name}'s house. ${o.name} loses a turn.`); }
    if(c.hit==='steal'){ if(o.beds>1&&p.beds<MAXB){o.beds--;p.beds++;log(`One of ${o.name}'s guys likes <b>${p.name}</b>'s house better. He moved over.`);} else log(`${o.name}'s guy wanted to move, but there was no room. Nothing happened.`); }
    if(c.hit==='swap'){ [p.cash,o.cash]=[o.cash,p.cash]; log(`The bank mixed up the accounts. <b>${p.name}</b> and ${o.name} swapped money!`); }
    if(c.hit==='raid'){ o.cash-=100; p.cash+=100; log(`<b>${p.name}</b> borrowed $100 from ${o.name} and never paid it back.`); }
    if(c.hit==='norent'){ o.norent=true; log(`${o.name}'s guys stiffed them. No rent for ${o.name} this Friday.`); }
    if(c.hit==='peek'&&p.bot){ log(`<b>${p.name}</b> peeked at your hand. Sneaky.`); }
    else if(c.hit==='peek'){ await ask(`<h2 class="bang">${o.name}'s hand</h2><div class="peek">${o.hand.map(x=>`<img src="${img(x)}">`).join('')}</div><p style="font-size:13px;color:var(--dim)">Only ${p.name} looks!</p>`,[['Done peeking']]); log(`<b>${p.name}</b> peeked at ${o.name}'s hand.`); }
    return;
  }
  // red / pink hit the other house
  await hit(c,p,o,true);
}
async function hit(c,from,to,canBounce){
  const r=to.hand.findIndex(x=>x.react==='block'||(x.react==='bounce'&&canBounce)||(x.react==='wrench'&&c.wrench));
  if(r>=0 && to.bot){
    const opts=to.hand.map((x,i)=>[x,i]).filter(([x])=>x.react==='block'||(x.react==='bounce'&&canBounce)||(x.react==='wrench'&&c.wrench));
    const dmg=-(c.cash||0)+(c.beds?-c.beds*250:0)+(c.skip?120:0)+(c.payorskip?75:0);
    if(dmg>=100){ opts.sort((a,b)=>(b[0].react==='bounce')-(a[0].react==='bounce')); const [rc,ri]=opts[0]; to.hand.splice(ri,1); S.disc.push(rc); to.hand.push(draw());
      await showPlay(to,rc,'Nice try.');
      if(rc.react==='bounce'){ log(`<b>${to.name}</b>: Not my problem! It bounced right back at you.`); return hit(c,to,from,false); }
      log(`<b>${to.name}</b> threw down ${rc.title}. Nothing happens.`); return; }
  }
  else if(r>=0){
    const opts=to.hand.map((x,i)=>[x,i]).filter(([x])=>x.react==='block'||(x.react==='bounce'&&canBounce)||(x.react==='wrench'&&c.wrench));
    const btns=opts.map(([x])=>[x.title,'']).concat([['Take the hit','ghost']]);
    const k=await ask(`${S.bot?"":`<p style="color:var(--dim);font-size:13px">Hand the phone to <b>${to.name}</b> for a sec</p>`}<h2 class="bang">${from.name} hit you!</h2><img class="big" src="${img(c)}" style="width:48%"><p>You're holding a card that can stop it. Throw it down?</p>`,btns);
    if(k<opts.length){
      const [rc,ri]=opts[k]; to.hand.splice(ri,1); S.disc.push(rc); to.hand.push(draw());
      if(rc.react==='bounce'){ log(`<b>${to.name}</b>: Not my problem! It bounced right back at ${from.name}.`); return hit(c,to,from,false); }
      log(`<b>${to.name}</b> threw down ${rc.title}. Nothing happens.`); return;
    }
  }
  if(c.payorskip){
    const k=to.bot?(to.cash-c.payorskip>=200?0:1):await ask(`${S.bot?'':`<p style="color:var(--dim);font-size:13px">Hand the phone to <b>${to.name}</b></p>`}<h2 class="bang">${c.title}</h2><img class="big" src="${img(c)}" style="width:48%"><p>${c.words}</p>`,[[`Pay $${c.payorskip}`],['Sit out','ghost']]);
    if(k===0){ to.cash-=c.payorskip; log(`${to.name} paid $${c.payorskip}. (${c.title})`); } else { to.skip++; log(`${to.name} sits out a turn. (${c.title})`); }
    return;
  }
  if(c.cash) to.cash+=c.cash;
  if(c.beds) addBeds(to,c.beds);
  if(c.skip) to.skip++;
  log(`<b>${from.name}</b> hit ${to.name}: ${c.title}. ${c.words.replace(/^GOTCHA\. /,'')}`);
}

// ---------- Big Ray (computer player) ----------
const TRASH=['GOTCHA.','Sucks to be you.','Welcome to the neighborhood.','Nothing personal.','Big Ray sends his regards.','Enjoy.'];
async function showPlay(p,c,line){
  sheet(`<p style="color:var(--dim);font-size:13px;margin:0 0 8px"><b>${p.name}</b> played</p><img class="big" src="${img(c)}"><p class="bang" style="font-size:24px;margin-top:10px">${line||''}</p>`);
  await sleep(2100); close(); await sleep(200);
}
function botPick(p,o){
  const val=c=>{ if(c.kind==='green'){ const empty=MAXB-p.beds; return (c.cash||0)+(c.fill?empty*250:0)+Math.min(c.beds||0,empty)*250; }
    if(c.kind==='red'||c.kind==='pink') return -(c.cash||0)+(c.beds?Math.min(-c.beds,o.beds-1)*250:0)+(c.skip?120:0)+(c.payorskip?90:0);
    if(c.self==='double') return p.hand.filter(x=>x.kind==='red'||x.kind==='pink'||(x.kind==='green'&&playable(x,p))).length>=2?220:-1;
    if(c.self==='dblrent') return p.beds*100-50;
    if(c.hit==='swap') return o.cash-p.cash;
    if(c.hit==='steal') return (o.beds>1&&p.beds<MAXB)?380:-1;
    if(c.hit==='raid') return 200; if(c.hit==='norent') return o.beds*100; if(c.hit==='skip') return 130; if(c.hit==='peek') return 20;
    return -1; };
  let best=-1,bv=-1e9;
  p.hand.forEach((c,i)=>{ if(!playable(c,p)) return; const v=val(c); if(v>bv){bv=v;best=i;} });
  if(best<0||bv<0){ // toss the least useful card
    let w=-1,wv=1e9; p.hand.forEach((c,i)=>{ if(c.react) return; const v=playable(c,p)?val(c):-5; if(v<wv){wv=v;w=i;} });
    return {i:w<0?0:w,toss:best<0};
  }
  return {i:best,toss:false};
}
async function botTurn(){
  const p=me(), o=them();
  await sleep(900);
  while(S.plays>0 && p.hand.length){
    const {i,toss}=botPick(p,o); const c=p.hand.splice(i,1)[0]; S.disc.push(c);
    if(toss){ log(`<b>${p.name}</b> tossed a card.`); S.plays--; continue; }
    const hits=c.kind==='red'||c.kind==='pink'||c.hit;
    await showPlay(p,c,hits?TRASH[Math.random()*TRASH.length|0]:'');
    S.plays--;
    await resolve(c,p,o); render(); await sleep(500);
  }
  S.lock=true; await sleep(400); endTurn();
}

// ---------- turn flow ----------
async function startTurn(first){
  const p=me(); S.lock=true;
  if(S.turn===0 && S.day===0 && !S.billed){ S.billed=true; S.p.forEach(x=>x.cash-=BILLS); render(); await banner(`WEEK ${S.week} · BILLS -$${BILLS}`); }
  if(S.bot){ if(!p.bot) log(`Your turn. ${DAYS[S.day].charAt(0)+DAYS[S.day].slice(1).toLowerCase()}, week ${S.week}.`); }
  else {
    await ask(`<img class="big" src="cards/back.webp" style="width:52%"><h2 class="bang" style="margin-top:12px">${p.name}'s turn</h2><p>Pass the phone to ${p.name}. ${DAYS[S.day].charAt(0)+DAYS[S.day].slice(1).toLowerCase()}, week ${S.week}.</p>`,[[`I'm ${p.name}`]]);
  }
  if(p.skip>0){ p.skip--; p.left--; render(); log(`<b>${p.name}</b> sits this one out.`); await banner('SIT DOWN',900); return endTurn(true); }
  while(p.hand.length<HAND+1) p.hand.push(draw());
  S.plays=1; S.lock=false; render();
  if(p.bot) return botTurn();
  if(p.left===1) banner('LAST TURN',1000);
}
async function endTurn(skipped){
  const p=me();
  if(!skipped) p.left--;
  while(p.hand.length>HAND+2){ S.disc.push(p.hand.shift()); }
  if(S.turn===1){
    if(S.day===2){
      for(const x of S.p){ const r=x.norent?0:x.beds*RENT*(x.dbl?2:1); x.cash+=r; x.norent=false; x.dbl=false; }
      render(); await banner('PAYDAY',1100);
      await ask(`<h2 class="bang">Friday payday</h2>${S.p.map(x=>`<p><b>${x.name}</b>: ${x.beds} guys → ${money(x.cash)}</p>`).join('')}`,[['Keep going']]);
      const broke=S.p.filter(x=>x.cash<0);
      if(broke.length) return gameOver(broke.length===2?'Both houses closed!':`${broke[0].name}'s house closed.`);
      if(S.week===WEEKS) return gameOver('The clock ran out.');
      S.week++; S.day=0; S.billed=false;
    } else S.day++;
    S.turn=0;
  } else S.turn=1;
  startTurn();
}
async function gameOver(why){
  const [a,b]=S.p; let w;
  const alive=S.p.filter(x=>x.cash>=0);
  if(alive.length===1) w=alive[0];
  else if(a.cash!==b.cash) w=a.cash>b.cash?a:b;
  else if(a.beds!==b.beds) w=a.beds>b.beds?a:b;
  render();
  const r=await ask(`<img class="big" src="cards/logo.webp" style="width:60%"><h2 class="bang">${w?w.name+' wins!':'Dead tie!'}</h2><p>${why}</p>${S.p.map(x=>`<p><b>${x.name}</b>: ${money(x.cash)} · ${x.beds} guys</p>`).join('')}`,[['Play again'],['Done','ghost']]);
  if(r===0) newGame(S.p.map(x=>x.name),S.bot);
  else { $('gameScreen').classList.add('hidden'); $('startScreen').classList.remove('hidden'); }
}
</script>
</body>
