name: Nightly rebuild on Cloudflare

# THE SITE IS BUILT AND HOSTED BY CLOUDFLARE PAGES NOW (1 Oct 2026).
# Every push to main already builds there (scripts/cf_build.sh). This workflow
# only does the one thing Cloudflare can't do on its own: rebuild the site
# every morning, so the speaker tapes pick up whatever went on the YouTube
# channel since yesterday and the home page's TODAY card (the copy Google
# reads) is baked for the new day.
#
# It calls Cloudflare's deploy hook. The hook URL lives in the GitHub secret
# CF_DEPLOY_HOOK (Cloudflare: project > Settings > Build > Deploy Hooks).
#
# It used to build the site and publish it to GitHub Pages. That copy was no
# longer the one anybody saw, so that part is gone.
#
# 09:20 UTC is about 5:20am Eastern. GitHub turns scheduled workflows off in a
# repo with no pushes for 60 days; if the tapes ever go stale, check that first.

on:
  schedule:
    - cron: '20 9 * * *'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Ask Cloudflare to rebuild the site
        env:
          HOOK: ${{ secrets.CF_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then echo "CF_DEPLOY_HOOK secret is not set"; exit 1; fi
          curl -fsS -X POST "$HOOK"
