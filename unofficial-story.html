<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">

  <title>The Very Very Unofficial Story</title>

  <link rel="icon" href="data:,">

  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      box-sizing: border-box;

      padding:
        env(safe-area-inset-top)
        env(safe-area-inset-right)
        env(safe-area-inset-bottom)
        env(safe-area-inset-left);
    }

    canvas {
      display: block;
      flex: 0 0 auto;
      max-width: 100%;
      max-height: 100%;
      touch-action: none;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }

    /* WAY OUT (14 Oct 2026, Mike: no dead ends). A small X back to where you started the game
       (the Porch's Games sheet or the Fun page). Chapters move by changing the page address,
       so "back" would only go to the last chapter; the starting page is remembered instead. */
    #rmExit {
      position: fixed;
      top: calc(8px + env(safe-area-inset-top, 0px));
      left: calc(8px + env(safe-area-inset-left, 0px));
      z-index: 99999;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: rgba(0, 0, 0, .55);
      color: #fff;
      font: 700 20px/34px Arial, sans-serif;
      text-align: center;
      text-decoration: none;
      -webkit-tap-highlight-color: transparent;
    }
  </style>
</head>

<body>

  <a id="rmExit" href="/fun.html" aria-label="Leave the game">&#10005;</a>
  <script>
    (function () {
      var K = "rm_game_from", r = document.referrer || "";
      try {
        if (r.indexOf(location.origin) === 0 && r.indexOf("unofficial-story") < 0) sessionStorage.setItem(K, r.slice(location.origin.length));
        var from = sessionStorage.getItem(K);
        if (from && from.charAt(0) === "/") document.getElementById("rmExit").href = from;
      } catch (e) {}
    })();
  </script>

  <canvas id="game"></canvas>

  <script src="story.js"></script>
  <script src="recovery-engine.js"></script>

  <script src="chapters/chapter1.js"></script>
  <script src="chapters/chapter2.js"></script>
  <script src="chapters/chapter3.js"></script>
  <script src="chapters/chapter4.js"></script>
  <script src="chapters/chapter5.js"></script>
  <script src="chapters/chapter6.js"></script>

  <script src="engine/ui.js"></script>

  <script src="chapters/chapter2-gameplay.js"></script>
  <script src="chapters/chapter3-gameplay.js"></script>
  <script src="chapters/chapter4-gameplay.js"></script>
  <script src="chapters/chapter5.gameplay.v2.js"></script>
    <script src="chapters/chapter6-gameplay.js"></script>

  <script src="engine/runtime.js"></script>
  <script src="engine/player.js"></script>
  <script src="engine/input.js"></script>
  <script src="engine/background.js"></script>
  <script src="engine/entities.js"></script>
  <script src="engine/gameflow.js"></script>
  <script src="engine/story.js"></script>

  <script src="game2.js"></script>

</body>
</html>
