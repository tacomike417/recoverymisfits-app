<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Meme of the Day — Recovery Misfits</title>
<meta name="theme-color" content="#0e0e0d">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Recovery Misfits">
<link rel="apple-touch-icon" href="./icon-192.png">

<meta property="og:title" content="Recovery Meme of the Day — Recovery Misfits">
<meta property="og:description" content="A new one every day. Free, no account, nothing to sign up for.">
<meta property="og:url" content="https://recoverymisfits.org/meme.html">
<meta name="twitter:card" content="summary_large_image">

<style>html{background:#0e0e0d}body{background:#0e0e0d;color:#eee6d5;margin:0}</style>
<link rel="stylesheet" href="./assets/daily-reading.css">

<style>
  /* ---- MEME OF THE DAY ---------------------------------------------------
     BUILT FOR A PHONE, and reviewed at phone width. The meme is square, so
     on a phone it wants the full column and nothing beside it. On a desktop
     it is capped rather than blown up to 1080 -- a square that tall pushes
     the share button off the bottom of the screen, which is the one control
     this page exists for.

     THERE IS NO BACK BUTTON ON PURPOSE. The phone's own back gesture and the
     bottom nav are the way out. An on-screen back arrow is one more thing to
     miss and it lies about where "back" goes once somebody has landed here
     from a shared link. */

  .wrap{
    max-width:520px;margin:0 auto;
    padding:14px 16px 0;                 /* 16px side gutter, phone first */
  }

  .head{margin:2px 0 12px}
  .head h1{
    font-family:var(--display);font-weight:600;
    font-size:clamp(28px,8.5vw,40px);line-height:.98;letter-spacing:.5px;
    text-transform:uppercase;color:var(--ivory);margin:0;
  }
  .head .when{
    font-family:var(--ui);font-weight:800;font-size:10.5px;letter-spacing:2px;
    text-transform:uppercase;color:var(--gold);margin:7px 0 0;
  }

  /* THE MEME ITSELF. The box holds its shape before the image lands so the
     share button does not jump down the screen mid-tap. */
  .frame{
    position:relative;aspect-ratio:1/1;width:100%;
    border-radius:14px;overflow:hidden;
    border:1px solid rgba(215,178,83,.34);
    background:#141412;
  }
  .frame img{width:100%;height:100%;object-fit:cover;display:block}
  .frame .load{
    position:absolute;inset:0;display:grid;place-items:center;
    font-family:var(--ui);font-size:12px;letter-spacing:1.5px;
    text-transform:uppercase;color:var(--muted);
  }
  .frame.ready .load{display:none}

  .acts{display:grid;gap:9px;margin:14px 0 0}
  .btn{
    display:flex;align-items:center;justify-content:center;gap:9px;
    width:100%;min-height:52px;padding:0 16px;border-radius:999px;
    font-family:var(--ui);font-weight:800;font-size:14.5px;letter-spacing:1.4px;
    text-transform:uppercase;cursor:pointer;
  }
  .btn svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.9}
  .btn-go{background:var(--gold);color:#17130b;border:0}
  .btn-go:active{filter:brightness(.92)}
  .btn-alt{
    background:transparent;color:var(--ivory);
    border:1.4px solid rgba(215,178,83,.5);
  }
  .btn[disabled]{opacity:.5;pointer-events:none}

  .say{
    margin:11px 0 0;min-height:17px;text-align:center;
    font-family:var(--ui);font-size:12px;color:var(--muted);
  }
  .say.bad{color:#e2a08f}

  .note{
    margin:16px 0 0;padding-top:13px;
    border-top:1px solid rgba(215,178,83,.2);
    font-family:var(--ui);font-size:11.5px;line-height:1.55;color:var(--muted);
  }
  .note b{color:var(--ivory);font-weight:700}


  /* .tailroom comes from the shared stylesheet at 150px -- the same clearance
     the other reading pages give the Sober Date strip and the nav. Setting it
     here would only let this page drift away from them. */

  /* The canvas the shared copy is drawn on never needs to be seen. */
  #stage{position:absolute;left:-9999px;top:0;width:1px;height:1px}
</style>
</head>

<!-- Lives in the daily stack, so Readings is the tab that stays lit. -->
<body data-rm-nav="readings.html">

<div id="rm-topbar"></div>
<script src="./topbar.js" defer></script>

<div class="wrap">
<main>

  <header class="head">
    <h1>Meme of the Day</h1>
    <p class="when" id="when">&nbsp;</p>
  </header>

  <div class="frame" id="frame">
    <p class="load">Loading&hellip;</p>
    <img id="shot" alt="" width="1080" height="1080">
  </div>

  <div class="acts">
    <button class="btn btn-go" id="share" type="button" disabled>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16V3m0 0L8 7m4-4 4 4M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span id="shareLabel">Share this one</span>
    </button>
    <button class="btn btn-alt" id="copy" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 14a3.5 3.5 0 0 0 5 0l3-3a3.5 3.5 0 0 0-5-5l-1 1M14 10a3.5 3.5 0 0 0-5 0l-3 3a3.5 3.5 0 0 0 5 5l1-1" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Copy the link
    </button>
  </div>

  <p class="say" id="say" role="status" aria-live="polite"></p>

  <p class="note">
    The copy that gets shared has <b>recoverymisfits.org</b> printed along the
    bottom, because a picture is all that travels &mdash; Instagram and Facebook
    do not carry a link with it.
  </p>

</main>
</div>

<canvas id="stage" width="1080" height="1170"></canvas>

<div class="tailroom"></div>

<div id="rm-bottom-nav"></div>
<script src="./nav.js" defer></script>

<script>
(function () {
  "use strict";

  var SITE  = "recoverymisfits.org";
  var LINK  = "https://recoverymisfits.org/meme.html";
  var BAND  = 90;                       /* the strip under the art, in art pixels */

  var shot  = document.getElementById("shot");
  var frame = document.getElementById("frame");
  var when  = document.getElementById("when");
  var say   = document.getElementById("say");
  var btn   = document.getElementById("share");
  var lab   = document.getElementById("shareLabel");
  var cpy   = document.getElementById("copy");

  function tell(msg, bad) {
    say.textContent = msg || "";
    say.className = bad ? "say bad" : "say";
  }

  /* THE DATE IS READ OFF THIS PHONE'S CLOCK, same as every other daily in
     the app, and the key is MM-DD rather than a day number. Day numbers slide
     by one after February in a leap year, which would quietly shift the whole
     year's memes every fourth year. MM-DD cannot. */
  var now = new Date();
  var pad = function (n) { return (n < 10 ? "0" : "") + n; };
  var key = pad(now.getMonth() + 1) + "-" + pad(now.getDate());

  var MONTHS = ["January","February","March","April","May","June","July",
                "August","September","October","November","December"];
  when.textContent = MONTHS[now.getMonth()] + " " + now.getDate();

  var file = null;

  fetch("./data/memes.json", { cache: "no-cache" })
    .then(function (r) { if (!r.ok) throw new Error("memes.json " + r.status); return r.json(); })
    .then(function (data) {
      file = (data.dates || {})[key];
      if (!file) throw new Error("no meme set for " + key);
      shot.alt = "Recovery Misfits meme for " + MONTHS[now.getMonth()] + " " + now.getDate();
      shot.src = "./assets/memes/" + file;
    })
    .catch(function (e) {
      frame.classList.add("ready");
      shot.remove();
      tell("Could not load today's meme. Check back in a minute.", true);
      if (window.console) console.error(e);
    });

  shot.addEventListener("load", function () {
    frame.classList.add("ready");
    btn.disabled = false;
  });
  shot.addEventListener("error", function () {
    frame.classList.add("ready");
    tell("Could not load today's meme. Check back in a minute.", true);
  });

  /* ---- THE SHARED COPY ---------------------------------------------------
     The art in the app stays exactly as it was made. The copy that leaves
     gets a strip along the bottom with the address on it, drawn here rather
     than baked into the files -- so the 50 memes never had to be re-exported,
     and changing the wording later is one line in this file instead of 50
     images run through a script again. */
  function withFooter() {
    return new Promise(function (resolve, reject) {
      var c = document.getElementById("stage");
      var W = 1080, H = 1080 + BAND;
      c.width = W; c.height = H;
      var g = c.getContext("2d");

      g.fillStyle = "#0e0e0d";
      g.fillRect(0, 0, W, H);
      g.drawImage(shot, 0, 0, W, 1080);

      /* a gold hairline, the same one the app uses to separate things */
      g.fillStyle = "rgba(215,178,83,.42)";
      g.fillRect(0, 1080, W, 2);

      g.fillStyle = "#d7b253";
      g.textAlign = "center";
      g.textBaseline = "middle";
      g.font = "700 34px system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif";

      /* Letter-spacing is not a canvas property everywhere yet, so the text is
         spaced by hand where it is not. Same look either way. */
      var y = 1080 + BAND / 2 + 2;
      if ("letterSpacing" in g) {
        g.letterSpacing = "5px";
        g.fillText(SITE, W / 2, y);
        g.letterSpacing = "0px";
      } else {
        var sp = 5, txt = SITE, total = 0, i;
        for (i = 0; i < txt.length; i++) total += g.measureText(txt[i]).width + sp;
        total -= sp;
        var x = (W - total) / 2;
        g.textAlign = "left";
        for (i = 0; i < txt.length; i++) {
          g.fillText(txt[i], x, y);
          x += g.measureText(txt[i]).width + sp;
        }
        g.textAlign = "center";
      }

      c.toBlob(function (b) {
        if (b) resolve(b); else reject(new Error("canvas gave nothing back"));
      }, "image/jpeg", 0.9);
    });
  }

  /* Handing over an actual image file is a phone thing. Desktop browsers
     mostly refuse files, so the button becomes a download there instead of
     failing in front of somebody. */
  function canSendFiles(f) {
    try {
      return !!(navigator.canShare && navigator.share && navigator.canShare({ files: [f] }));
    } catch (e) { return false; }
  }

  function download(blob) {
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = "recovery-misfits-" + key + ".jpg";
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
  }

  btn.addEventListener("click", function () {
    if (!file) return;
    tell("Getting it ready…");
    btn.disabled = true;

    withFooter().then(function (blob) {
      var f = new File([blob], "recovery-misfits-" + key + ".jpg", { type: "image/jpeg" });

      if (canSendFiles(f)) {
        return navigator.share({
          files: [f],
          text: "Recovery Misfits — " + SITE
        }).then(function () { tell(""); })
          .catch(function (err) {
            /* Backing out of the share sheet is not an error worth shouting about. */
            if (err && (err.name === "AbortError" || err.name === "NotAllowedError")) { tell(""); return; }
            download(blob);
            tell("Saved the image instead — attach it wherever you like.");
          });
      }

      download(blob);
      tell("Saved to your downloads. The address is printed on it.");
    }).catch(function (e) {
      tell("Could not build the share copy. Try again in a second.", true);
      if (window.console) console.error(e);
    }).then(function () {
      btn.disabled = false;
    });
  });

  /* On a desktop the share sheet is not coming, so say what the button does. */
  if (!(navigator.canShare && navigator.share)) {
    lab.textContent = "Save the image";
  }

  cpy.addEventListener("click", function () {
    var done = function () { tell("Link copied."); };
    var fail = function () { tell("Could not copy — the address is " + LINK, true); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(LINK).then(done).catch(fail);
    } else {
      try {
        var t = document.createElement("textarea");
        t.value = LINK; t.setAttribute("readonly", "");
        t.style.position = "absolute"; t.style.left = "-9999px";
        document.body.appendChild(t); t.select();
        document.execCommand("copy"); t.remove(); done();
      } catch (e) { fail(); }
    }
  });

})();
</script>

<script>
if ("serviceWorker" in navigator) { navigator.serviceWorker.register("./sw.js"); }
</script>

</body>
</html>
